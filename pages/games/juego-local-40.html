const CATALOGO_COSM = {
  personaje: [
    { id: 'ah_bot',    nombre: 'Androide Astro',  precio: 0,   c1: '#38bdf8', c2: '#0284c7', acc: '#ff6600' },
    { id: 'ah_knight', nombre: 'Caballero Solar', precio: 100, c1: '#fde047', c2: '#d97706', acc: '#ff2a5f' },
    { id: 'ah_ninja',  nombre: 'Shinobi Sombra',  precio: 180, c1: '#a855f7', c2: '#4c1d95', acc: '#10b981' },
    { id: 'ah_diver',  nombre: 'Buzo Abisal',     precio: 240, c1: '#34d399', c2: '#065f46', acc: '#ffb800' }
  ],
  escenario: [
    { id: 'sc_bosque',  nombre: 'Bosque Nocturno', precio: 0,   sky1: '#0f172a', sky2: '#1e293b', ground: '#14532d', wood: '#92400e', accent: '#38bdf8' },

  ]
};
const DEF_COSM = { personaje: 'ah_bot', escenario: 'sc_bosque' };
let cosmEquip = Object.assign({}, DEF_COSM, BG.load('cosm', {}));
let portalCoins = 0, portalItems = [], portalConectado = false, compraPendiente = null;

const FILAS_TECLADO = [
  ['Q','W','E','R','T','Y','U','I','O','P'],
  ['A','S','D','F','G','H','J','K','L','Ñ'],
  ['Z','X','C','V','B','N','M']
];

BG.init({
  id: 'ahorcado',
  title: 'AHORCADO HD',
  icon: '🔤',
  accent: '#ff6600',
  accent2: '#00b4ff',
  music: true,
  subtitle: 'Escenario ilustrado, pistas y 3 modos de juego.',
  hud: [
    { id: 'score',  label: 'Puntos', color: '#ff6600' },
    { id: 'streak', label: 'Racha',  color: '#10b981' },
    { id: 'lives',  label: 'Vidas',  color: '#00b4ff', value: '6/6' },

  ],

  helpTouch: 'Tocá las letras del teclado o el botón de Pista para revelar una letra.',
  onRestart: () => iniciarPartida(modo),
  onMenu: () => mostrarMenu()
});

// Resolución adaptable: vertical en celulares (390x844) para llenar la pantalla y horizontal en escritorio
const esVerticalInicial = window.innerHeight > window.innerWidth * 1.05;
const view = BG.canvas(esVerticalInicial ? 460 : 900, esVerticalInicial ? 740 : 540, { pad: 6 });
const ctx = view.ctx;

function actualizarOrientacionCanvas() {
  if (!BG.stage) return;
  const r = BG.stage.getBoundingClientRect();
  const vert = r.height > r.width * 1.05;
  const targetW = vert ? 460 : 900;
  const targetH = vert ? 740 : 540;
  if (view.W !== targetW || view.H !== targetH) {
    view.W = targetW;
    view.H = targetH;
    view.fit();
  }
}
window.addEventListener('resize', actualizarOrientacionCanvas);
setTimeout(actualizarOrientacionCanvas, 30);

const shopBtn = U.el('button', { id: 'ah-shop-btn' }, 'Personalizar');
shopBtn.addEventListener('click', () => abrirModalPersonalizar());
BG.stage.appendChild(shopBtn);

// ── Sincronización de cosméticos con el Portal (bg-hello-ack / bg-buy-result) ──
function itemCat(catKey, id) { return CATALOGO_COSM[catKey].find(x => x.id === id); }
function loTengo(catKey, id) { const it = itemCat(catKey, id); return !!it && (it.precio === 0 || portalItems.includes(id)); }
function validarCosm() {
  for (const k of Object.keys(DEF_COSM)) if (!loTengo(k, cosmEquip[k])) cosmEquip[k] = DEF_COSM[k];
}

window.addEventListener('message', e => {
  if (e.source !== window.parent) return;
  const d = e.data;
  if (!d || typeof d !== 'object') return;
  if (d.type === 'bg-hello-ack') {
    portalConectado = true;
    portalCoins = Number(d.coins) || 0;
    portalItems = Array.isArray(d.items) ? d.items.map(String) : [];
    validarCosm();
  } else if (d.type === 'bg-buy-result') {
    portalCoins = Number(d.coins) || portalCoins;
    if (Array.isArray(d.items)) portalItems = d.items.map(String);
    const pend = compraPendiente;
    compraPendiente = null;
    if (d.ok && pend && pend.id === d.item) {
      cosmEquip[pend.catKey] = pend.id;
      BG.save('cosm', cosmEquip);
      SFX.play('power');
      abrirModalPersonalizar();
    } else if (!d.ok) {
      SFX.play('error');
      const av = document.getElementById('ah-cos-aviso');
      if (av) av.textContent = d.error || 'No se pudo completar la compra';
    }
  }
});

function abrirModalPersonalizar() {
  const estabaJugando = (estado === 'play' && !BG.paused);
  if (estabaJugando) BG.paused = true;

  const renderGrupo = (titulo, catKey) => {
    const btns = CATALOGO_COSM[catKey].map(it => {
      const owned = loTengo(catKey, it.id);
      const sel = cosmEquip[catKey] === it.id;
      const lbl = sel ? '✓ Equipado' : (owned ? 'Equipar' : `${it.precio} VicioCoins`);
      return `<button class="cos-btn ${sel ? 'sel' : ''}" data-cat="${catKey}" data-id="${it.id}">
        ${U.esc(it.nombre)}<small>${U.esc(lbl)}</small>
      </button>`;
    }).join('');
    return `<div class="bg-label">${U.esc(titulo)}</div><div class="cos-grid">${btns}</div>`;
  };

  const html = `
    <div style="font-size:12px;color:var(--bg-muted);margin-bottom:4px">
      Tus VicioCoins: <b style="color:var(--bg-accent2)">${U.fmt(portalCoins)}</b>
    </div>
    <div class="cos-aviso" id="ah-cos-aviso">${portalConectado ? '' : 'Abrí el juego desde AltoVicio para usar tus VicioCoins.'}</div>
    ${renderGrupo('Personaje', 'personaje')}
    ${renderGrupo('Escenario Ilustrado', 'escenario')}
  `;

  BG.ui.show({
    title: 'PERSONALIZAR',
    sub: 'Cambiá el personaje y el escenario ilustrado.',
    html,
    buttons: [{
      label: estabaJugando ? '▶ CONTINUAR PARTIDA' : '← VOLVER AL MENÚ',
      primary: true,
      onClick: () => { if (estabaJugando) { BG.paused = false; BG.ui.hide(); } else mostrarMenu(); }
    }],
    onShow: card => {
      card.querySelectorAll('.cos-btn').forEach(b => {
        b.addEventListener('click', () => {
          const catKey = b.dataset.cat, id = b.dataset.id;
          const it = itemCat(catKey, id);
          if (!it) return;
          if (loTengo(catKey, id)) {
            cosmEquip[catKey] = id;
            BG.save('cosm', cosmEquip);
            SFX.play('select');
            abrirModalPersonalizar();
            return;
          }
          const av = card.querySelector('#ah-cos-aviso');
          if (!portalConectado) { if (av) av.textContent = 'Conectate desde el portal AltoVicio para comprar.'; return; }
          if (portalCoins < it.precio) { if (av) av.textContent = 'No tenés suficientes VicioCoins.'; SFX.play('error'); return; }
          if (av) av.textContent = 'Comprando…';
          compraPendiente = { catKey, id };
          BG.portal.send('bg-buy', { item: id, price: it.precio });
        });
      });
    }
  });
}

// ── Estado y Mecánicas del Juego ──────────────────────────────────────────
let modo = BG.load('modo', 'classic');
let catActiva = 'Todas';
let estado = 'menu';
let palabra = '', pista = '', categoria = '';
let usadas = new Set(), errores = 0, puntaje = 0, racha = 0, mejorRacha = 0, resueltas = 0;
let tiempo = 90, t = 0, errorAnimT = 0, winAnimT = 0, transicionT = 0;
let keyRects = [], hintRect = null, hoverLetra = null;
let historialPalabras = new Set();
const estrellas = D.stars(45, 900, 740, 19);

function sortearPalabra() {
  const lista = [];
  BANCO.forEach(g => {
    if (catActiva === 'Todas' || catActiva === g.cat) {
      g.w.forEach(([pal, pis]) => lista.push({ pal, pis, cat: g.cat }));
    }
  });
  if (historialPalabras.size >= lista.length) historialPalabras.clear();
  let item = U.pick(lista);
  for (let i = 0; i < 30; i++) {
    if (!historialPalabras.has(item.pal)) break;
    item = U.pick(lista);
  }
  historialPalabras.add(item.pal);
  palabra = item.pal;
  pista = item.pis;
  categoria = item.cat;
  usadas.clear();
  errores = 0;
  errorAnimT = 0;
  winAnimT = 0;
  sincronizarHUD();
}

function sincronizarHUD() {
  const vidas = Math.max(0, MAX_ERR - errores);
  BG.hud.set('score', modo === 'streak' ? racha : puntaje);
  BG.hud.set('streak', racha);
  BG.hud.set('lives', modo === 'timed' ? U.fmtTime(tiempo) : `${vidas}/${MAX_ERR}`);
  BG.hud.set('best', BG.getBest(modo) || 0);
}

function iniciarPartida(m) {
  modo = m || modo;
  BG.save('modo', modo);
  puntaje = 0; racha = 0; mejorRacha = 0; resueltas = 0;
  tiempo = 90; transicionT = 0;
  sortearPalabra();
  FX.clear();
  estado = 'play';
  BG.start();
  if (!BG.music.playing) BG.music.play(SONG);
}

function mostrarMenu() {
  estado = 'menu';
  BG.stop();
  BG.music.stop();
  const cats = ['Todas', ...BANCO.map(g => g.cat)];
  BG.ui.show({
    title: 'AHORCADO HD',
    sub: BG.game.subtitle,
    buttons: Object.values(MODOS).map(m => {
      const rec = BG.getBest(m.id);
      return {
        label: m.nombre.toUpperCase(),
        small: `${m.desc} · ${rec ? 'Récord: ' + U.fmt(rec) : 'Sin récord'}`,
        primary: m.id === modo,
        onClick: () => { BG.ui.hide(); iniciarPartida(m.id); }
      };
    }),
    html: '<div class="bg-label">Categoría de Palabras</div><div class="bg-seg" id="ah-cat-seg"></div>',
    help: BG.isTouch ? BG.game.helpTouch : BG.game.help,
    onShow: card => {
      const seg = card.querySelector('#ah-cat-seg');
      cats.forEach(c => {
        const btn = U.el('button', { class: 'bg-btn' + (c === catActiva ? ' sel' : ''), style: 'padding:6px 10px;font-size:11px;min-width:auto;flex:0 1 auto' }, U.esc(c));
        btn.addEventListener('click', () => {
          catActiva = c;
          seg.querySelectorAll('.bg-btn').forEach(x => x.classList.toggle('sel', x === btn));
          SFX.play('tick');
        });
        seg.appendChild(btn);
      });
    }
  });
}

function intentarLetra(l) {
  if (estado !== 'play' || transicionT > 0) return;
  l = String(l || '').toUpperCase();
  if (!/^[A-ZÑ]$/.test(l) || usadas.has(l)) return;

  usadas.add(l);
  const kr = keyRects.find(k => k.l === l);
  const fxX = kr ? kr.x + kr.w / 2 : view.W / 2;
  const fxY = kr ? kr.y + kr.h / 2 : view.H * 0.7;

  if (palabra.includes(l)) {
    let cant = 0;
    for (const c of palabra) if (c === l) cant++;
    const ganados = cant * (20 + racha * 4);
    puntaje += ganados;
    if (modo === 'timed') tiempo = Math.min(120, tiempo + 2);
    SFX.play('coin');
    FX.burst(fxX, fxY, { n: 14, color: ['#10b981', '#38bdf8', '#fff'], speed: 160, life: 0.45 });
    FX.text(fxX, fxY - 16, `+${ganados}`, { color: '#10b981', size: 15 });

    if ([...palabra].every(c => usadas.has(c))) {
      racha++;
      mejorRacha = Math.max(mejorRacha, racha);
      resueltas++;
      const bonus = (MAX_ERR - errores) * 25;
      puntaje += 100 + bonus;
      if (modo === 'timed') tiempo = Math.min(120, tiempo + 12);
      winAnimT = 1.1;
      transicionT = 1.15;
      SFX.play('win');
      FX.burst(view.W / 2, view.H * 0.35, { n: 32, color: ['#ffb800', '#10b981', '#00b4ff'], speed: 220, life: 0.7 });
    }
  } else {
    errores++;
    errorAnimT = 0.65;
    if (modo === 'timed') tiempo = Math.max(0, tiempo - 4);
    SFX.play('hurt');
    FX.shake(7, 0.28);
    FX.burst(fxX, fxY, { n: 10, color: ['#ff2a5f', '#ff6600'], speed: 130, life: 0.35 });

    if (errores >= MAX_ERR) {
      if (modo === 'timed' && tiempo > 6) {
        BG.ui.toast('¡Palabra fallada! -8s', '#ff2a5f');
        tiempo = Math.max(0, tiempo - 8);
        racha = 0;
        transicionT = 1.1;
      } else {
        finDePartida();
      }
    }
  }
  sincronizarHUD();
}

function usarPistaLetra() {
  if (estado !== 'play' || transicionT > 0) return;
  const ocultas = [...palabra].filter(c => !usadas.has(c));
  if (ocultas.length <= 1) {
    BG.ui.toast('¡Solo queda la última letra!', '#ffb800');
    return;
  }
  if (modo === 'classic' && puntaje < 30) {
    SFX.play('error');
    BG.ui.toast('Necesitás 30 puntos para revelar una letra', '#ff2a5f');
    return;
  }
  if (modo === 'classic') puntaje = Math.max(0, puntaje - 30);
  const letra = U.pick(ocultas);
  SFX.play('power');
  intentarLetra(letra);
}

function finDePartida() {
  estado = 'over';
  BG.stop();
  BG.music.stop();
  SFX.play(resueltas >= 3 ? 'win' : 'lose');
  const scoreFinal = modo === 'streak' ? mejorRacha : puntaje;
  const r = BG.submitScore(scoreFinal, { mode: modo, won: resueltas > 0 });

  setTimeout(() => {
    BG.ui.gameOver({
      win: resueltas >= 3,
      title: resueltas >= 3 ? '¡GRAN PARTIDA!' : '¡ATRAPADO!',
      sub: `La palabra era: ${palabra} (${categoria})`,
      score: scoreFinal,
      scoreLabel: modo === 'streak' ? 'MEJOR RACHA' : 'PUNTOS',
      isRecord: r.isRecord || r.first,
      stats: [
        { label: 'Palabras', value: resueltas },
        { label: 'Mejor Racha', value: mejorRacha },
        { label: 'Récord', value: U.fmt(BG.getBest(modo) || scoreFinal) }
      ],
      onRetry: () => iniciarPartida(modo),
      onMenu: () => mostrarMenu()
    });
  }, 850);
}

// ── Controles ─────────────────────────────────────────────────────────────
BG.input.onKey((e, code, down) => {
  if (!down || estado !== 'play' || BG.paused || BG.ui.open) return;
  if (e.key === '1') { usarPistaLetra(); return; }
  const l = (e.key || '').toUpperCase();
  if (/^[A-ZÑ]$/.test(l)) intentarLetra(l);
});

view.canvas.addEventListener('pointermove', e => {
  const p = view.toLocal(e.clientX, e.clientY);
  hoverLetra = null;
  for (const k of keyRects) {
    if (p.x >= k.x && p.x <= k.x + k.w && p.y >= k.y && p.y <= k.y + k.h) {
      hoverLetra = k.l;
      break;
    }
  }
});

view.canvas.addEventListener('pointerdown', e => {
  if (estado !== 'play') return;
  const p = view.toLocal(e.clientX, e.clientY);
  if (hintRect && p.x >= hintRect.x && p.x <= hintRect.x + hintRect.w && p.y >= hintRect.y && p.y <= hintRect.y + hintRect.h) {
    usarPistaLetra();
    return;
  }
  for (const k of keyRects) {
    if (p.x >= k.x && p.x <= k.x + k.w && p.y >= k.y && p.y <= k.y + k.h) {
      intentarLetra(k.l);
      return;
    }
  }
});

function update(dt) {
  t += dt;
  if (errorAnimT > 0) errorAnimT = Math.max(0, errorAnimT - dt);
  if (winAnimT > 0) winAnimT = Math.max(0, winAnimT - dt);
  if (estado !== 'play') return;

  if (transicionT > 0) {
    transicionT -= dt;
    if (transicionT <= 0) { transicionT = 0; sortearPalabra(); }
    return;
  }
  if (modo === 'timed') {
    tiempo -= dt;
    if (Math.floor(tiempo) !== Math.floor(tiempo + dt)) sincronizarHUD();
    if (tiempo <= 0) { tiempo = 0; finDePartida(); }
  }
}

// ── Dibujo del Escenario Ilustrado y Personaje Animado ────────────────────
function dibujarEscenaIlustrada(x, y, w, h, sc, per) {
  ctx.save();
  D.rr(ctx, x, y, w, h, 20);
  ctx.clip();

  // Cielo con gradiente
  const gSky = ctx.createLinearGradient(x, y, x, y + h);
  gSky.addColorStop(0, sc.sky1);
  gSky.addColorStop(1, sc.sky2);
  ctx.fillStyle = gSky;
  ctx.fillRect(x, y, w, h);

  // Estrellas animadas
  ctx.fillStyle = '#ffffff';
  for (let i = 0; i < 24; i++) {
    const st = estrellas[i];
    const sx = x + ((st.x / 900) * w);
    const sy = y + ((st.y / 740) * (h * 0.72));
    ctx.globalAlpha = 0.25 + 0.45 * Math.sin(t * 2 + st.tw);
    ctx.beginPath();
    ctx.arc(sx, sy, 1.4, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  // Luna / Planeta de fondo
  const moonX = x + w * 0.82, moonY = y + h * 0.22, moonR = Math.min(w, h) * 0.11;
  D.glowCircle(ctx, moonX, moonY, moonR, sc.accent + '44', 24);
  ctx.fillStyle = '#f8fafc';
  ctx.beginPath(); ctx.arc(moonX, moonY, moonR * 0.75, 0, Math.PI * 2); ctx.fill();

  // Colinas y suelo ilustrado
  const floorY = y + h * 0.82;
  ctx.fillStyle = sc.ground;
  ctx.beginPath();
  ctx.moveTo(x, floorY);
  ctx.quadraticCurveTo(x + w * 0.28, floorY - 22, x + w * 0.55, floorY - 6);
  ctx.quadraticCurveTo(x + w * 0.8, floorY + 8, x + w, floorY - 10);
  ctx.lineTo(x + w, y + h);
  ctx.lineTo(x, y + h);
  ctx.closePath();
  ctx.fill();

  // Estructura / Pórtico ilustrado con vetas de madera y remaches
  const scale = Math.min(w / 280, h / 270);
  const baseX = x + w * 0.5, baseY = floorY + 4;
  ctx.save();
  ctx.translate(baseX, baseY);
  ctx.scale(scale, scale);

  // Base de piedra
  ctx.fillStyle = '#334155';
  D.rr(ctx, -95, -14, 190, 16, 6);
  ctx.fill();

  // Poste vertical y travesaño superior
  ctx.fillStyle = sc.wood;
  ctx.strokeStyle = 'rgba(0,0,0,0.45)';
  ctx.lineWidth = 2;
  D.rr(ctx, -78, -215, 18, 205, 5); ctx.fill(); ctx.stroke();
  D.rr(ctx, -84, -222, 128, 16, 5); ctx.fill(); ctx.stroke();
  // Escuadra diagonal
  ctx.beginPath();
  ctx.moveTo(-60, -175); ctx.lineTo(-28, -206); ctx.lineTo(-16, -206); ctx.lineTo(-60, -162);
  ctx.closePath(); ctx.fill();

  // Cuerda / Haz tensor con balanceo cuando hay error
  const swing = Math.sin(t * 4) * 0.03 + (errorAnimT > 0 ? Math.sin(t * 32) * 0.18 * errorAnimT : 0);
  ctx.save();
  ctx.translate(22, -206);
  ctx.rotate(swing);

  ctx.strokeStyle = sc.accent;
  ctx.lineWidth = 3.5;
  ctx.beginPath();
  ctx.moveTo(0, 0);
  ctx.lineTo(0, 34);
  ctx.stroke();

  // Personaje ilustrado articulado: se va construyendo / activando parte por parte con animación
  const bounce = winAnimT > 0 ? -Math.abs(Math.sin(t * 14)) * 12 : 0;
  ctx.translate(0, 56 + bounce);

  const dibujarParte = (num, fn) => {
    const activa = errores >= num;
    ctx.save();
    ctx.globalAlpha = activa ? 1 : 0.14;
    if (activa && errores === num && errorAnimT > 0) {
      const s = 1 + errorAnimT * 0.35;
      ctx.scale(s, s);
    }
    fn(activa);
    ctx.restore();
  };

  // 3 y 4: Brazos articulados
  dibujarParte(3, () => {
    ctx.save();
    ctx.translate(-16, 28);
    ctx.rotate(0.35 + Math.sin(t * 3) * 0.08);
    ctx.fillStyle = per.c2;
    D.rr(ctx, -26, -6, 28, 12, 6); ctx.fill();
    ctx.fillStyle = per.acc;
    ctx.beginPath(); ctx.arc(-26, 0, 6, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  });
  dibujarParte(4, () => {
    ctx.save();
    ctx.translate(16, 28);
    ctx.rotate(-0.35 - Math.sin(t * 3) * 0.08);
    ctx.fillStyle = per.c2;
    D.rr(ctx, -2, -6, 28, 12, 6); ctx.fill();
    ctx.fillStyle = per.acc;
    ctx.beginPath(); ctx.arc(26, 0, 6, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  });

  // 5 y 6: Piernas con botas
  dibujarParte(5, () => {
    ctx.save();
    ctx.translate(-9, 72);
    ctx.rotate(0.12 + Math.sin(t * 4) * 0.06);
    ctx.fillStyle = per.c2;
    D.rr(ctx, -7, 0, 13, 34, 6); ctx.fill();
    ctx.fillStyle = per.acc;
    D.rr(ctx, -10, 28, 16, 9, 4); ctx.fill();
    ctx.restore();
  });
  dibujarParte(6, () => {
    ctx.save();
    ctx.translate(9, 72);
    ctx.rotate(-0.12 - Math.sin(t * 4) * 0.06);
    ctx.fillStyle = per.c2;
    D.rr(ctx, -6, 0, 13, 34, 6); ctx.fill();
    ctx.fillStyle = per.acc;
    D.rr(ctx, -6, 28, 16, 9, 4); ctx.fill();
    ctx.restore();
  });

  // 2: Torso con armadura y núcleo luminoso
  dibujarParte(2, () => {
    const gT = ctx.createLinearGradient(-20, 20, 20, 75);
    gT.addColorStop(0, per.c1);
    gT.addColorStop(1, per.c2);
    ctx.fillStyle = gT;
    D.rr(ctx, -19, 20, 38, 54, 13);
    ctx.fill();
    ctx.strokeStyle = '#ffffff44';
    ctx.lineWidth = 2;
    ctx.stroke();
    D.glowCircle(ctx, 0, 44, 7, per.acc, 12);
  });

  // 1: Cabeza con expresiones dinámicas según errores
  dibujarParte(1, () => {
    const gH = ctx.createLinearGradient(-22, -22, 22, 22);
    gH.addColorStop(0, per.c1);
    gH.addColorStop(1, per.c2);
    ctx.fillStyle = gH;
    ctx.beginPath(); ctx.arc(0, 0, 23, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#ffffff55'; ctx.lineWidth = 2; ctx.stroke();

    // Visor oscuro
    ctx.fillStyle = '#0f172a';
    D.rr(ctx, -16, -9, 32, 16, 7);
    ctx.fill();

    // Ojos expresivos
    if (errores >= MAX_ERR) {
      // Ojos X al perder
      ctx.strokeStyle = '#ff2a5f'; ctx.lineWidth = 2.5;
      for (const ox of [-7, 7]) {
        ctx.beginPath();
        ctx.moveTo(ox - 3.5, -4); ctx.lineTo(ox + 3.5, 3);
        ctx.moveTo(ox + 3.5, -4); ctx.lineTo(ox - 3.5, 3);
        ctx.stroke();
      }
    } else if (errorAnimT > 0 || errores >= 4) {
      // Ojos de preocupación
      ctx.fillStyle = '#ffb800';
      ctx.beginPath();
      ctx.arc(-7, -1, 3.5, 0, Math.PI * 2);
      ctx.arc(7, -1, 3.5, 0, Math.PI * 2);
      ctx.fill();
    } else {
      // Ojos normales brillantes
      ctx.fillStyle = '#38bdf8';
      ctx.beginPath();
      ctx.arc(-7, -1, 3.2, 0, Math.PI * 2);
      ctx.arc(7, -1, 3.2, 0, Math.PI * 2);
      ctx.fill();
    }
  });

  ctx.restore();
  ctx.restore();

  // Marco exterior de la escena
  D.rr(ctx, x, y, w, h, 20);
  ctx.strokeStyle = 'rgba(255,255,255,0.12)';
  ctx.lineWidth = 2;
  ctx.stroke();
  ctx.restore();
}

function render() {
  const W = view.W, H = view.H;
  const vert = H > W;
  const sc  = CATALOGO_COSM.escenario.find(x => x.id === cosmEquip.escenario) || CATALOGO_COSM.escenario[0];
  const per = CATALOGO_COSM.personaje.find(x => x.id === cosmEquip.personaje) || CATALOGO_COSM.personaje[0];

  ctx.fillStyle = '#0b0f19';
  ctx.fillRect(0, 0, W, H);

  ctx.save();
  FX.applyShake(ctx);

  // Coordenadas adaptables según orientación (Vertical 390x844 vs Horizontal escritorio)
  const sceneRect = vert
    ? { x: 14, y: 12, w: W - 28, h: 255 }
    : { x: 18, y: 18, w: 310, h: H - 36 };
  const panelX = vert ? 14 : 346;
  const panelW = vert ? W - 28 : W - 364;
  const centerX = panelX + panelW / 2;

  dibujarEscenaIlustrada(sceneRect.x, sceneRect.y, sceneRect.w, sceneRect.h, sc, per);

  // Bloque de Categoría, Pista y Botón de Revelar Letra
  const infoY = vert ? 278 : 18;
  const infoH = vert ? 76 : 86;
  D.rr(ctx, panelX, infoY, panelW, infoH, 16);
  ctx.fillStyle = 'rgba(20, 28, 46, 0.92)';
  ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,0.09)';
  ctx.lineWidth = 1.5;
  ctx.stroke();

  D.text(ctx, (categoria || 'GENERAL').toUpperCase(), panelX + 16, infoY + 23, {
    size: 12, weight: 800, color: sc.accent, align: 'left'
  });
  D.text(ctx, pista || 'Adiviná la palabra secreta', panelX + 16, infoY + (vert ? 52 : 56), {
    size: vert ? 12.5 : 14, weight: 600, color: '#e2e8f0', align: 'left', family: 'body'
  });

  const hbW = vert ? 96 : 122, hbH = 32;
  const hbX = panelX + panelW - hbW - 12, hbY = infoY + 10;
  hintRect = { x: hbX, y: hbY, w: hbW, h: hbH };
  D.rr(ctx, hbX, hbY, hbW, hbH, 9);
  ctx.fillStyle = 'rgba(0, 180, 255, 0.16)';
  ctx.fill();
  ctx.strokeStyle = '#00b4ff';
  ctx.lineWidth = 1.4;
  ctx.stroke();
  D.text(ctx, modo === 'classic' ? 'PISTA (-30)' : 'PISTA', hbX + hbW / 2, hbY + hbH / 2 + 1, {
    size: 10.5, weight: 800, color: '#38bdf8'
  });

  // Casillas de la palabra secreta
  const len = Math.max(1, palabra.length);
  const gap = len > 10 ? 5 : 7;
  const maxBoxW = vert ? 42 : 50;
  const boxW = Math.min(maxBoxW, Math.floor((panelW - (len - 1) * gap - 12) / len));
  const boxH = Math.round(boxW * 1.22);
  const totalW = len * boxW + (len - 1) * gap;
  const startX = centerX - totalW / 2;
  const wordY = vert ? 372 : 148;

  for (let i = 0; i < len; i++) {
    const ch = palabra[i];
    const rev = usadas.has(ch) || estado === 'over';
    const bx = startX + i * (boxW + gap);
    D.rr(ctx, bx, wordY, boxW, boxH, 10);
    if (rev) {
      ctx.fillStyle = usadas.has(ch) ? 'rgba(16, 185, 129, 0.2)' : 'rgba(255, 42, 95, 0.22)';
      ctx.fill();
      ctx.strokeStyle = usadas.has(ch) ? '#10b981' : '#ff2a5f';
      ctx.lineWidth = 2;
      ctx.stroke();
      D.text(ctx, ch, bx + boxW / 2, wordY + boxH / 2 + 1, {
        size: Math.round(boxW * 0.56), weight: 900, color: '#fff'
      });
    } else {
      ctx.fillStyle = 'rgba(255, 255, 255, 0.05)';
      ctx.fill();
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.16)';
      ctx.lineWidth = 1.6;
      ctx.stroke();
    }
  }

  // Teclado táctil grande (ocupa todo el ancho disponible en celular)
  keyRects = [];
  const kbY = vert ? 455 : 265;
  const kGap = vert ? 5 : 7;
  const kW = Math.floor((panelW - 9 * kGap - 8) / 10);
  const kH = vert ? 72 : 56;

  FILAS_TECLADO.forEach((fila, rIdx) => {
    const rowW = fila.length * kW + (fila.length - 1) * kGap;
    const rx = centerX - rowW / 2;
    const ry = kbY + rIdx * (kH + kGap);

    fila.forEach((l, cIdx) => {
      const kx = rx + cIdx * (kW + kGap);
      keyRects.push({ l, x: kx, y: ry, w: kW, h: kH });

      const ya = usadas.has(l);
      const ok = ya && palabra.includes(l);
      const bad = ya && !palabra.includes(l);

      D.rr(ctx, kx, ry, kW, kH, 10);
      if (ok) {
        ctx.fillStyle = 'rgba(16, 185, 129, 0.26)';
        ctx.strokeStyle = '#10b981';
      } else if (bad) {
        ctx.fillStyle = 'rgba(15, 23, 42, 0.5)';
        ctx.strokeStyle = 'rgba(255, 42, 95, 0.35)';
      } else if (hoverLetra === l) {
        ctx.fillStyle = 'rgba(255, 102, 0, 0.26)';
        ctx.strokeStyle = '#ff6600';
      } else {
        ctx.fillStyle = 'rgba(26, 36, 56, 0.95)';
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.14)';
      }
      ctx.fill();
      ctx.lineWidth = 1.6;
      ctx.stroke();

      D.text(ctx, l, kx + kW / 2, ry + kH / 2 + 1, {
        size: vert ? 18 : 17,
        weight: 800,
        color: bad ? '#475569' : (ok ? '#34d399' : '#f8fafc')
      });
    });
  });

  // Resumen inferior
  const footerY = H - 18;
  D.text(ctx, `PALABRAS RESUELTAS: ${resueltas} · RACHA ACTUAL: ${racha}`, centerX, footerY, {
    size: 11.5, weight: 700, color: '#94a3b8'
  });

  FX.draw(ctx);
  ctx.restore();
  FX.drawFlash(ctx, W, H);
}

const SONG = {
  bpm: 116,
  tracks: [
    { type: 'triangle', vol: 0.22, notes: 'A4 . C5 . E5 . C5 . D5 . F5 . E5 . . . G4 . B4 . D5 . B4 . C5 . E5 . A4 . . .' },
    { type: 'sine',     vol: 0.32, notes: 'A2 . A2 . E2 . E2 . D2 . D2 . E2 . E2 . G2 . G2 . D2 . D2 . A2 . E2 . A2 . . .' }
  ]
};

sortearPalabra();
if (BG.thumb) {
  palabra = 'ALTOVICIO';
  categoria = 'Videojuegos';
  pista = 'El portal para jugar y competir con amigos';
  usadas = new Set(['A','L','T','O','V','C','E','M']);
  errores = 2;
  estado = 'play';
  if (BG.preview) {
    sortearPalabra();
    const ordenBot = ['A','E','O','S','I','R','N','L','U','C','T','M','P','B','D','G','V','H','F','J','Z','Ñ','Q','X','K','W','Y'];
    let bIdx = 0;
    setInterval(() => {
      if (estado !== 'play' || transicionT > 0) return;
      while (bIdx < ordenBot.length && usadas.has(ordenBot[bIdx])) bIdx++;
      if (bIdx >= ordenBot.length) { bIdx = 0; sortearPalabra(); return; }
      intentarLetra(ordenBot[bIdx]);
    }, 520);
  }
} else {
  BG.ready.then(mostrarMenu);
}

BG.loop(dt => update(dt), render);
</script>
