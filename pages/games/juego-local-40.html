<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ahorcado</title>
<link rel="stylesheet" href="kit/bg-kit.css">
<style>
#wrap { display: flex; flex-direction: column; align-items: center; gap: 10px; width: 100%; max-width: 640px; height: 100%; padding: 8px; justify-content: space-between; }
#top { display: flex; align-items: center; gap: 10px; width: 100%; justify-content: center; }
#cat { font-family: 'Orbitron', sans-serif; font-size: 12px; letter-spacing: 2px; color: #ff9a1f; padding: 6px 12px; border-radius: 999px; background: rgba(255,154,31,.12); border: 1px solid rgba(255,154,31,.35); }
#hintBtn { padding: 6px 12px; font-size: 11px; }
#hint { min-height: 22px; color: #c9c9e6; font-weight: 600; font-size: 15px; text-align: center; }
canvas#gallows { width: min(300px, 60vw); aspect-ratio: 1; }
#word { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; min-height: 56px; }
.lt { width: clamp(28px, 7vw, 42px); height: clamp(40px, 9vw, 54px); border-bottom: 3px solid rgba(255,255,255,.4); display: flex; align-items: center; justify-content: center; font-family: 'Orbitron', sans-serif; font-weight: 900; font-size: clamp(18px, 5vw, 28px); color: #fff; }
.lt.sp { border: none; width: 16px; }
.lt.show { animation: drop .3s ease; border-color: #39ff88; }
.lt.miss { color: #ff3d6e; border-color: #ff3d6e; }
@keyframes drop { from { transform: translateY(-14px); opacity: 0; } }
#kb { display: flex; flex-direction: column; gap: 6px; width: 100%; }
.kr { display: flex; gap: 5px; justify-content: center; }
.k { flex: 1; max-width: 46px; height: 48px; border: none; border-radius: 8px; background: #34345a; color: #fff; font-family: 'Rajdhani', sans-serif; font-weight: 700; font-size: 17px; cursor: pointer; transition: transform .08s, background .2s; }
.k:active { transform: scale(.92); }
.k.ok { background: linear-gradient(135deg, #22c55e, #15803d); }
.k.no { background: #24243a; color: #5a5a7a; }
</style>
</head>
<body>
<div id="bg-stage">
  <div id="wrap">
    <div id="top"><span id="cat">—</span><button class="bg-btn" id="hintBtn">💡 PISTA</button></div>
    <div id="hint"></div>
    <canvas id="gallows" width="300" height="300"></canvas>
    <div id="word"></div>
    <div id="kb"></div>
  </div>
</div>
<script src="kit/bg-kit.js"></script>
<script>
// ═══════════════════════════════════════════════════════════════════════════
//  AHORCADO — BandaGamer
//  8 categorías con pistas · racha de palabras = puntaje · modo 2 jugadores
//  (uno escribe la palabra secreta, el otro adivina) · tildes no importan
// ═══════════════════════════════════════════════════════════════════════════
const { util: U, sfx: SFX } = BG;
const CATS = {
  'ANIMALES': 'PERRO|Ladra y mueve la cola;GATO|Maúlla y caza ratones;ELEFANTE|Tiene trompa;JIRAFA|Cuello larguísimo;PINGUINO|Ave que no vuela y vive en el frío;TIBURON|Pez de dientes filosos;MARIPOSA|Antes fue oruga;COCODRILO|Reptil de gran mandíbula;DELFIN|Mamífero marino muy inteligente;CANGURO|Salta y lleva a su cría en una bolsa;MURCIELAGO|Mamífero que vuela de noche;TORTUGA|Lleva la casa a cuestas;CAMALEON|Cambia de color;HORMIGA|Pequeña y trabajadora;CARPINCHO|Roedor gigante de los esteros;YAGUARETE|El felino más grande de América;HORNERO|Pájaro que hace su nido de barro;GUANACO|Pariente de la llama;PULPO|Ocho brazos;BUHO|Ave nocturna que gira la cabeza',
  'PAÍSES': 'ARGENTINA|Tierra del tango y el dulce de leche;BRASIL|El país más grande de Sudamérica;URUGUAY|Banda Oriental;CHILE|País largo y angosto;MEXICO|Tacos y mariachis;ESPAÑA|Flamenco y paella;ITALIA|Pizza y el Coliseo;FRANCIA|Torre Eiffel;JAPON|País del sol naciente;EGIPTO|Pirámides y faraones;CANADA|Hoja de arce en la bandera;AUSTRALIA|País-continente de los canguros;ALEMANIA|Su capital es Berlín;PERU|Machu Picchu;COLOMBIA|Café y cumbia;PORTUGAL|Su capital es Lisboa;GRECIA|Cuna de los Juegos Olímpicos;INDIA|El Taj Mahal;MARRUECOS|Su capital es Rabat;NORUEGA|Fiordos y auroras boreales',
  'COMIDA': 'EMPANADA|Masa rellena al horno o frita;MILANESA|Carne empanada, a la napolitana también;ASADO|Domingo de parrilla;ALFAJOR|Dos tapitas y dulce de leche;CHOCOLATE|Se hace con cacao;HAMBURGUESA|Medallón entre dos panes;FIDEOS|Pasta larga o corta;ÑOQUIS|Se comen el 29;PIZZA|Muzzarella y salsa;HELADO|Postre frío;MEDIALUNA|Factura con forma de luna;CHORIPAN|Clásico de cancha;LOCRO|Guiso patrio del 25 de mayo;TORTILLA|De papas, con o sin cebolla;SUSHI|Arroz y pescado crudo;ENSALADA|Lechuga, tomate y algo más;PANQUEQUE|Fino, con dulce de leche;FLAN|Postre con caramelo;MANDARINA|Cítrico pequeño y fácil de pelar;SANDIA|Fruta grande, roja por dentro',
  'PROFESIONES': 'MEDICO|Cura a los enfermos;BOMBERO|Apaga incendios;ABOGADO|Defiende en un juicio;ARQUITECTO|Diseña edificios;PANADERO|Hace el pan de cada día;ASTRONAUTA|Viaja al espacio;CARPINTERO|Trabaja la madera;PERIODISTA|Informa las noticias;VETERINARIO|Médico de animales;PROGRAMADOR|Escribe código;PILOTO|Maneja aviones;COCINERO|Trabaja en la cocina;MAESTRA|Enseña en la escuela;ELECTRICISTA|Arregla cables y enchufes;FOTOGRAFO|Saca fotos;PLOMERO|Arregla caños;JARDINERO|Cuida las plantas;ENFERMERA|Ayuda al médico;MUSICO|Toca un instrumento;CIENTIFICO|Investiga en un laboratorio',
  'DEPORTES': 'FUTBOL|Once contra once;BASQUET|Se encesta en un aro;TENIS|Raqueta y red;NATACION|Se practica en una pileta;VOLEY|Pelota por arriba de la red;RUGBY|Pelota ovalada y tackles;HOCKEY|Palo y bocha;BOXEO|Guantes y ring;CICLISMO|En bicicleta;ATLETISMO|Correr, saltar y lanzar;AJEDREZ|Deporte mental de 64 casillas;GOLF|Hoyos y palos;ESGRIMA|Combate con espadas;SURF|Se monta una ola;PATINAJE|Sobre ruedas o hielo;HANDBALL|Se juega con la mano;ESCALADA|Subir paredes de roca;KARATE|Arte marcial japonés;POLO|Se juega a caballo;REMO|Se impulsa un bote',
  'OBJETOS': 'PARAGUAS|Te protege de la lluvia;TELEFONO|Sirve para llamar;LAMPARA|Da luz;TIJERA|Corta papel;MOCHILA|Se lleva en la espalda;RELOJ|Marca la hora;ESPEJO|Refleja tu imagen;CUCHARA|Para tomar la sopa;COMPUTADORA|Tiene teclado y pantalla;AURICULARES|Para escuchar música;BICICLETA|Dos ruedas y pedales;LINTERNA|Luz portátil;ALMOHADA|Para apoyar la cabeza;BILLETERA|Guarda la plata;CANDADO|Cierra con llave;ESCOBA|Para barrer;GUITARRA|Seis cuerdas;TERMO|Mantiene el agua caliente para el mate;CALCULADORA|Hace cuentas;SOMBRERO|Se usa en la cabeza',
  'NATURALEZA': 'VOLCAN|Montaña que escupe lava;CASCADA|Agua que cae desde lo alto;DESIERTO|Arena y poco agua;GLACIAR|Río de hielo;ARCOIRIS|Siete colores en el cielo;TORMENTA|Truenos y relámpagos;SELVA|Bosque tropical espeso;MONTAÑA|Gran elevación de tierra;OCEANO|Inmensa masa de agua salada;HURACAN|Viento violento que gira;ISLA|Rodeada de agua;CUEVA|Hueco en la roca;PLAYA|Arena y mar;RELAMPAGO|Luz de una tormenta;NEBLINA|Nube a ras del suelo;LAGUNA|Lago chico;AURORA|Luces en el cielo polar;ECLIPSE|La luna tapa al sol;CONSTELACION|Grupo de estrellas;TERREMOTO|La tierra tiembla',
  'VIDEOJUEGOS': 'CONSOLA|Aparato para jugar;JOYSTICK|Palanca de control;NIVEL|Etapa de un juego;JEFE|Enemigo final;PUNTAJE|Los puntos que hiciste;VIDAS|Si se terminan, perdiste;RANKING|Tabla de los mejores;LOGRO|Trofeo por hacer algo difícil;AVATAR|Tu personaje;PIXEL|Puntito de la pantalla;MULTIJUGADOR|Para jugar con otros;PARTIDA|Una sesión de juego;POWERUP|Te da poderes por un rato;ESTRATEGIA|Género de pensar jugadas;PLATAFORMAS|Género de saltar y correr;TETRIS|Encajá las piezas;LABERINTO|Hay que encontrar la salida;MONEDAS|Se juntan para comprar cosas;TIENDA|Donde comprás accesorios;BANDAGAMER|¡Este portal!',
};
const norm = s => s.toUpperCase().replace(/Ñ/g, '#').normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/#/g, 'Ñ');
const BANK = Object.fromEntries(Object.entries(CATS).map(([k, v]) => [k, v.split(';').map(x => { const [w, h] = x.split('|'); return { w: norm(w), h }; })]));
const MAXERR = 6;

BG.init({
  id: 'ahorcado', title: 'AHORCADO', icon: '🪢', accent: '#ff9a1f', accent2: '#ff3d6e', scroll: true, pausable: false, muteKey: false,
  subtitle: 'Adiviná la palabra antes de completar el dibujo. Cada palabra seguida suma a tu racha.',
  hud: [{ id: 'score', label: 'Puntos' }, { id: 'streak', label: 'Racha', color: '#39ff88' }, { id: 'lives', label: 'Vidas', color: '#ff3d6e', value: '6' }],
  help: 'Escribí letras con el teclado o tocá las teclas. La Ñ cuenta como letra. La pista cuesta 1 vida.',
});
const gc = document.getElementById('gallows'), g = gc.getContext('2d');
let cat = 'MEZCLA', word, hint, guessed, errors, score = 0, streak = 0, over = false, twoP = false, hintUsed = false, used = new Set(), anim = 0;

function pickWord() {
  const pool = cat === 'MEZCLA' ? Object.entries(BANK).flatMap(([k, a]) => a.map(o => ({ ...o, k }))) : BANK[cat].map(o => ({ ...o, k: cat }));
  let free = pool.filter(o => !used.has(o.w)); if (!free.length) { used.clear(); free = pool; }
  const o = U.pick(free); used.add(o.w); return o;
}
function newWord(custom) {
  if (custom) { word = custom.w; hint = custom.h || ''; document.getElementById('cat').textContent = '2 JUGADORES'; }
  else { const o = pickWord(); word = o.w; hint = o.h; document.getElementById('cat').textContent = o.k; }
  guessed = new Set(); errors = 0; over = false; hintUsed = false;
  document.getElementById('hint').textContent = '';
  document.getElementById('hintBtn').disabled = !hint;
  buildKb(); paintWord(); draw(); hud(); BG.start();
}
function hud() { BG.hud.set('score', score); BG.hud.set('streak', streak); BG.hud.set('lives', String(MAXERR - errors)); }
function buildKb() {
  const kb = document.getElementById('kb'); kb.innerHTML = '';
  ['QWERTYUIOP', 'ASDFGHJKLÑ', 'ZXCVBNM'].forEach(r => { const row = document.createElement('div'); row.className = 'kr'; [...r].forEach(ch => { const b = document.createElement('button'); b.className = 'k'; b.textContent = ch; b.dataset.k = ch; b.onclick = () => guess(ch); row.appendChild(b); }); kb.appendChild(row); });
}
function paintWord(reveal) {
  const el = document.getElementById('word'); el.innerHTML = '';
  [...word].forEach(ch => {
    const d = document.createElement('div');
    if (ch === ' ') { d.className = 'lt sp'; el.appendChild(d); return; }
    const known = guessed.has(ch) || !/[A-ZÑ]/.test(ch);
    d.className = 'lt' + (known ? ' show' : '') + (reveal && !known ? ' miss' : '');
    d.textContent = known || reveal ? ch : '';
    el.appendChild(d);
  });
}
function guess(ch) {
  if (over || guessed.has(ch) || BG.ui.open) return;
  guessed.add(ch);
  const k = document.querySelector(`.k[data-k="${ch}"]`);
  if (word.includes(ch)) { if (k) k.classList.add('ok'); SFX.play('coin'); paintWord(); if ([...word].every(c => !/[A-ZÑ]/.test(c) || guessed.has(c))) win(); }
  else { if (k) k.classList.add('no'); errors++; anim = 1; SFX.play('error'); draw(); hud(); if (errors >= MAXERR) lose(); }
}
function win() {
  over = true;
  const pts = twoP ? 0 : (10 + (MAXERR - errors) * 5 + word.replace(/ /g, '').length * 2) * (1 + Math.floor(streak / 3));
  score += pts; streak++; hud();
  SFX.play('win'); celebrate();
  setTimeout(() => BG.ui.show({ icon: '🎉', title: '¡BIEN!', tone: 'good', sub: `La palabra era <b>${word}</b>`, score: twoP ? null : pts, scoreLabel: 'PUNTOS GANADOS',
    stats: twoP ? null : [{ label: 'Racha', value: streak }, { label: 'Total', value: U.fmt(score) }],
    buttons: twoP ? [{ label: '✍ OTRA PALABRA SECRETA', primary: true, onClick: askSecret }, { label: '☰ MENÚ', onClick: showMenu }] : [{ label: '▶ SIGUIENTE PALABRA', primary: true, onClick: () => { BG.ui.hide(); newWord(); } }] }), 700);
}
function lose() {
  over = true; paintWord(true); SFX.play('lose'); BG.stop();
  const r = !twoP && score > 0 ? BG.submitScore(score) : null;
  setTimeout(() => BG.ui.gameOver({ icon: '🪢', title: '¡AHORCADO!', sub: `La palabra era <b>${word}</b>`, score: twoP ? null : score, scoreLabel: 'PUNTOS DE LA RACHA',
    isRecord: r && (r.isRecord || r.first), stats: twoP ? null : [{ label: 'Palabras', value: streak }, { label: 'Récord', value: U.fmt(BG.getBest() || score) }],
    retryLabel: twoP ? '✍ OTRA PALABRA SECRETA' : '↻ NUEVA RACHA', onRetry: () => { if (twoP) askSecret(); else { score = 0; streak = 0; BG.ui.hide(); newWord(); } }, onMenu: showMenu }), 900);
  streak = 0;
}
function celebrate() { const ws = document.querySelectorAll('.lt'); ws.forEach((d, i) => setTimeout(() => d.animate([{ transform: 'translateY(0)' }, { transform: 'translateY(-12px)' }, { transform: 'translateY(0)' }], { duration: 300 }), i * 60)); }
function askSecret() {
  twoP = true;
  BG.ui.show({ icon: '✍', title: 'PALABRA SECRETA', sub: 'Jugador 1: escribí una palabra (o frase corta) sin que mire el otro.',
    html: `<input id="sec" type="password" maxlength="24" autocomplete="off" style="width:100%;padding:12px;border-radius:10px;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.06);color:#fff;font-size:18px;font-family:Orbitron,sans-serif;letter-spacing:3px;margin-bottom:8px">
      <input id="pis" type="text" maxlength="60" placeholder="Pista (opcional)" autocomplete="off" style="width:100%;padding:10px;border-radius:10px;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.06);color:#fff;font-size:15px;margin-bottom:10px">`,
    buttons: [{ label: '▶ ¡QUE ADIVINE!', primary: true, onClick: () => {
      const w = norm(document.getElementById('sec').value.trim()).replace(/[^A-ZÑ ]/g, '').replace(/\s+/g, ' ');
      if (w.replace(/ /g, '').length < 3) { BG.ui.toast('Mínimo 3 letras', '#ff3d6e'); return; }
      BG.ui.hide(); newWord({ w, h: document.getElementById('pis').value.trim() });
    } }, { label: '☰ MENÚ', onClick: showMenu }],
    onShow: c => setTimeout(() => c.querySelector('#sec').focus(), 60) });
}
function showMenu() {
  twoP = false;
  const cats = ['MEZCLA', ...Object.keys(BANK)];
  BG.ui.show({ icon: '🪢', title: 'AHORCADO', sub: BG.game.subtitle,
    html: `<div class="bg-label">Categoría</div><div class="bg-seg" style="flex-wrap:wrap">${cats.map(c => `<button class="bg-btn ${c === cat ? 'sel' : ''}" data-cat="${c}" style="min-width:110px;font-size:11px;padding:9px">${c}</button>`).join('')}</div>`,
    buttons: [{ label: '▶ JUGAR', primary: true, onClick: () => { BG.ui.hide(); score = 0; streak = 0; newWord(); } }, { label: '👥 2 JUGADORES', small: 'Uno elige la palabra, el otro adivina', onClick: askSecret }],
    stats: BG.getBest() ? [{ label: 'Récord', value: U.fmt(BG.getBest()) }] : null, help: BG.game.help,
    onShow: c => c.querySelectorAll('[data-cat]').forEach(b => b.onclick = () => { cat = b.dataset.cat; c.querySelectorAll('[data-cat]').forEach(x => x.classList.toggle('sel', x === b)); SFX.play('tick'); }) });
}
document.getElementById('hintBtn').onclick = () => {
  if (over || hintUsed || !hint) return;
  hintUsed = true; document.getElementById('hint').textContent = '💡 ' + hint;
  if (!twoP) { errors++; anim = 1; draw(); hud(); SFX.play('swap'); if (errors >= MAXERR) lose(); }
};
BG.input.onKey((e, code, down) => { if (!down || e.repeat || BG.ui.open || e.ctrlKey || e.metaKey) return; if (e.key && e.key.length === 1) { const ch = norm(e.key); if (/^[A-ZÑ]$/.test(ch)) guess(ch); } });

// ── Dibujo del ahorcado (neón) ────────────────────────────────────────────
function draw() {
  g.clearRect(0, 0, 300, 300);
  g.lineCap = 'round'; g.lineJoin = 'round';
  const line = (pts, c = '#8b8bb3', w = 6) => { g.strokeStyle = c; g.lineWidth = w; g.shadowColor = c; g.shadowBlur = c === '#8b8bb3' ? 0 : 12; g.beginPath(); pts.forEach(([x, y], i) => i ? g.lineTo(x, y) : g.moveTo(x, y)); g.stroke(); g.shadowBlur = 0; };
  line([[40, 280], [160, 280]]); line([[80, 280], [80, 30], [200, 30], [200, 60]]); line([[80, 80], [130, 30]], '#8b8bb3', 4);
  const c = errors >= MAXERR ? '#ff3d6e' : '#ff9a1f';
  if (errors > 0) { g.strokeStyle = c; g.lineWidth = 5; g.shadowColor = c; g.shadowBlur = 14; g.beginPath(); g.arc(200, 88, 26, 0, 7); g.stroke(); g.shadowBlur = 0;
    if (errors >= MAXERR) { g.lineWidth = 3; [[188, 80], [212, 80]].forEach(([x, y]) => { g.beginPath(); g.moveTo(x - 5, y - 5); g.lineTo(x + 5, y + 5); g.moveTo(x + 5, y - 5); g.lineTo(x - 5, y + 5); g.stroke(); }); }
    else { g.fillStyle = c; g.beginPath(); g.arc(191, 84, 3, 0, 7); g.arc(209, 84, 3, 0, 7); g.fill(); } }
  if (errors > 1) line([[200, 114], [200, 190]], c, 5);
  if (errors > 2) line([[200, 135], [168, 165]], c, 5);
  if (errors > 3) line([[200, 135], [232, 165]], c, 5);
  if (errors > 4) line([[200, 190], [174, 235]], c, 5);
  if (errors > 5) line([[200, 190], [226, 235]], c, 5);
  if (anim > 0) { gc.animate([{ transform: 'translateX(-5px)' }, { transform: 'translateX(5px)' }, { transform: 'none' }], { duration: 200 }); anim = 0; }
}

if (BG.thumb) { word = 'CARPINCHO'; hint = ''; guessed = new Set(['C', 'A', 'R', 'O']); errors = 3; buildKb(); paintWord(); draw(); document.getElementById('cat').textContent = 'ANIMALES'; ['C', 'A', 'R', 'O'].forEach(ch => document.querySelector(`.k[data-k="${ch}"]`).classList.add('ok')); ['E', 'S', 'T'].forEach(ch => document.querySelector(`.k[data-k="${ch}"]`).classList.add('no')); }
else BG.ready.then(showMenu);
</script>
</body>
</html>
