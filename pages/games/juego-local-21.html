<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Color Flood</title>
<link rel="stylesheet" href="kit/bg-kit.css">
<style>
#wrap { display: flex; flex-direction: column; align-items: center; gap: 12px; }
#pal { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
.cb { width: 54px; height: 54px; border-radius: 14px; border: 3px solid rgba(255,255,255,.15); cursor: pointer; transition: transform .1s, border-color .15s, opacity .15s; position: relative; }
.cb:hover { transform: translateY(-3px); border-color: #fff; }
.cb:active { transform: scale(.92); }
.cb.dis { opacity: .2; cursor: not-allowed; transform: none; }
.cb kbd { position: absolute; bottom: -18px; left: 50%; transform: translateX(-50%); font-size: 10px; color: #8b8ba3; font-family: 'Rajdhani', sans-serif; }
</style>
</head>
<body>
<div id="bg-stage"><div id="wrap"><div id="pal"></div></div></div>
<script src="kit/bg-kit.js"></script>
<script>
// ═══════════════════════════════════════════════════════════════════════════
//  COLOR FLOOD — BandaGamer
//  Solitario: inundá todo con un color en los movimientos disponibles (3 tamaños)
//  Diario: el mismo tablero para todos ese día · Duelo: vos desde arriba a la
//  izquierda contra la CPU desde abajo a la derecha (no podés elegir su color)
// ═══════════════════════════════════════════════════════════════════════════
const { util: U, draw: D, fx: FX, sfx: SFX } = BG;
const COLORS = ['#ff3d5a', '#ff9a1f', '#ffd400', '#22e06b', '#2e8bff', '#c04dff'];
const MODES = {
  s12: { name: '12×12', n: 12, moves: 22, kind: 'solo' },
  s16: { name: '16×16', n: 16, moves: 29, kind: 'solo' },
  s20: { name: '20×20', n: 20, moves: 36, kind: 'solo' },
  daily: { name: 'DESAFÍO DEL DÍA', n: 14, moves: 25, kind: 'solo', daily: true },
  duel: { name: 'DUELO VS CPU', n: 16, kind: 'duel' },
};
BG.init({
  post: { vignette: .2 },
  id: 'colorflood', title: 'COLOR FLOOD', icon: '🎨', accent: '#2e8bff', accent2: '#ff3d5a', pausable: false,
  subtitle: 'Elegí colores para que tu mancha (arriba a la izquierda) se coma todo el tablero.',
  hud: [{ id: 'moves', label: 'Movimientos' }, { id: 'pct', label: 'Dominado', color: '#22e06b', value: '0%' }, { id: 'mode', label: 'Modo', color: '#ffd400', value: '—' }],
  help: 'Tocá un color (o teclas <kbd>1</kbd>-<kbd>6</kbd>). Tu zona se expande a todas las casillas vecinas de ese color.',
});
const SIZE = 520;
const view = BG.canvas(SIZE, SIZE, { pad: 6, parent: document.getElementById('wrap'), prepend: true, reserveH: 96 });
const ctx = view.ctx;
let mk = BG.load('mode', 's12'), M, N, grid, own, moves, used, over, wave = [], waveT = 0, cpuOwn, turn = 'p';

function build() {
  M = MODES[mk]; N = M.n; over = false; used = 0; turn = 'p';
  const rnd = M.daily ? U.rng(U.hash('flood' + U.today())) : Math.random;
  grid = Array.from({ length: N * N }, () => Math.floor(rnd() * COLORS.length));
  own = new Uint8Array(N * N);
  cpuOwn = new Uint8Array(N * N);
  if (M.kind === 'duel') { if (grid[N * N - 1] === grid[0]) grid[N * N - 1] = (grid[0] + 1) % COLORS.length; flood(cpuOwn, N * N - 1, grid[N * N - 1], true); }
  flood(own, 0, grid[0], true);
  moves = M.moves || 0;
  BG.hud.set('mode', M.name.length > 10 ? (M.daily ? 'DIARIO' : 'DUELO') : M.name);
  buildPal(); hud(); BG.start();
}
function neighbors(i) { const x = i % N, y = (i / N) | 0, o = []; if (x > 0) o.push(i - 1); if (x < N - 1) o.push(i + 1); if (y > 0) o.push(i - N); if (y < N - 1) o.push(i + N); return o; }
// Expande la zona "mine" al color c. Devuelve las celdas nuevas con su distancia (para la animación)
function flood(mine, start, c, init) {
  const other = mine === own ? cpuOwn : own;
  const owned = []; for (let i = 0; i < N * N; i++) if (mine[i]) owned.push(i);
  if (init) { mine[start] = 1; owned.push(start); }
  owned.forEach(i => grid[i] = c);
  const q = owned.map(i => [i, 0]), added = [], seen = new Set(owned);
  while (q.length) {
    const [i, d] = q.shift();
    for (const j of neighbors(i)) {
      if (seen.has(j) || other[j]) continue;
      if (grid[j] === c) { seen.add(j); mine[j] = 1; added.push([j, d + 1]); q.push([j, d + 1]); }
    }
  }
  return added;
}
function count(a) { let n = 0; for (let i = 0; i < a.length; i++) n += a[i]; return n; }
function play(c) {
  if (over || BG.ui.open || turn !== 'p') return;
  const curP = grid[own.indexOf(1)];
  if (c === curP) return;
  if (M.kind === 'duel' && c === grid[cpuOwn.indexOf(1)]) { SFX.play('error'); BG.ui.toast('Ese color es de la CPU', '#ff3d5a'); return; }
  const added = flood(own, 0, c);
  used++; if (M.kind === 'solo') moves--;
  addWave(added, c);
  SFX.tone({ f: 300 + Math.min(added.length, 40) * 15, dur: .12, type: 'triangle', vol: .2 });
  if (added.length > 20) FX.burst(SIZE / 2, SIZE / 2, { n: 12, color: COLORS[c], speed: 160 });
  hud();
  if (M.kind === 'solo') {
    if (count(own) === N * N) return win();
    if (moves <= 0) return lose();
  } else {
    if (count(own) + count(cpuOwn) === N * N || noMoves()) return duelEnd();
    turn = 'cpu'; buildPal(); setTimeout(cpuPlay, 520);
  }
  buildPal();
}
function noMoves() {
  // ¿quedan casillas libres alcanzables?
  for (let i = 0; i < N * N; i++) if (!own[i] && !cpuOwn[i]) return false;
  return true;
}
function cpuPlay() {
  if (over) return;
  const pc = grid[own.indexOf(1)], cc = grid[cpuOwn.indexOf(1)];
  let best = -1, bestN = -1;
  for (let c = 0; c < COLORS.length; c++) {
    if (c === pc || c === cc) continue;
    // simulación barata: cuántas celdas ganaría
    const g2 = grid.slice(), o2 = cpuOwn.slice(), saveG = grid, saveO = cpuOwn;
    grid = g2; cpuOwn = o2;
    const n = flood(cpuOwn, 0, c).length + Math.random() * .5;
    grid = saveG; cpuOwn = saveO;
    if (n > bestN) { bestN = n; best = c; }
  }
  const added = flood(cpuOwn, 0, best);
  addWave(added, best); SFX.tone({ f: 200 + Math.min(added.length, 40) * 10, dur: .12, type: 'square', vol: .1 });
  hud(); turn = 'p'; buildPal();
  if (count(own) + count(cpuOwn) === N * N || noMoves()) duelEnd();
}
function addWave(added, c) { const t0 = performance.now(); added.forEach(([i, d]) => wave.push({ i, t: t0 + d * 35, c })); }
function hud() {
  const p = Math.round(count(own) / (N * N) * 100);
  BG.hud.set('pct', p + '%');
  BG.hud.set('moves', M.kind === 'solo' ? `${moves}` : `${count(own)} vs ${count(cpuOwn)}`);
  document.querySelector('[data-hud="moves"] span').textContent = M.kind === 'solo' ? 'Quedan' : 'Casillas';
}
function win() {
  over = true; BG.stop(); SFX.play('win');
  const r = BG.submitScore(used, { mode: mk, order: 'asc', won: true });
  setTimeout(() => BG.ui.gameOver({ win: true, icon: '🎨', title: '¡INUNDADO!', score: used, scoreLabel: 'MOVIMIENTOS USADOS', isRecord: r.isRecord || r.first, recordText: r.first ? '★ ¡PRIMER RÉCORD! ★' : null,
    stats: [{ label: 'Récord', value: BG.getBest(mk) + ' mov.' }, { label: 'Sobraron', value: moves }], onRetry: () => build(), onMenu: showMenu }), 900);
}
function lose() {
  over = true; BG.stop(); SFX.play('lose');
  const p = Math.round(count(own) / (N * N) * 100);
  setTimeout(() => BG.ui.gameOver({ icon: '🎨', title: 'SIN MOVIMIENTOS', sub: `Llegaste al ${p}% del tablero.`, onRetry: () => build(), onMenu: showMenu, stats: [{ label: 'Modo', value: M.name }] }), 700);
}
function duelEnd() {
  over = true; BG.stop();
  const a = count(own), b = count(cpuOwn), won = a > b;
  SFX.play(won ? 'win' : 'lose');
  const r = won ? BG.submitScore(a, { mode: 'duel', won: true }) : null;
  setTimeout(() => BG.ui.gameOver({ win: won, icon: won ? '🏆' : '🤖', title: won ? '¡GANASTE EL DUELO!' : a === b ? 'EMPATE' : 'GANÓ LA CPU', score: a, scoreLabel: 'TUS CASILLAS',
    isRecord: r && (r.isRecord || r.first), stats: [{ label: 'CPU', value: b }, { label: 'Turnos', value: used }], onRetry: () => build(), onMenu: showMenu }), 900);
}
function buildPal() {
  const pal = document.getElementById('pal'); pal.innerHTML = '';
  const pc = grid ? grid[own.indexOf(1)] : -1, cc = grid && M.kind === 'duel' ? grid[cpuOwn.indexOf(1)] : -1;
  COLORS.forEach((col, i) => {
    const b = document.createElement('button'); b.className = 'cb' + (i === pc || i === cc || turn !== 'p' ? ' dis' : '');
    b.style.background = col; b.style.boxShadow = `0 6px 18px ${col}55`;
    if (!BG.isTouch) b.innerHTML = `<kbd>${i + 1}</kbd>`;
    b.onclick = () => play(i); pal.appendChild(b);
  });
}
function showMenu() {
  BG.ui.show({ icon: '🎨', title: 'COLOR FLOOD', sub: BG.game.subtitle,
    buttons: Object.entries(MODES).map(([k, m]) => { const b = BG.getBest(k); return { label: m.name, small: m.kind === 'duel' ? 'Vos contra la CPU, cada uno desde su esquina' + (b ? ` · Récord ${b}` : '') : `${m.moves} movimientos${m.daily ? ' · igual para todos hoy' : ''} · ${b ? 'Récord ' + b + ' mov.' : 'sin récord'}`, primary: k === mk, onClick: () => { mk = k; BG.save('mode', k); BG.ui.hide(); build(); } }; }),
    help: BG.game.help });
}
function render() {
  ctx.fillStyle = '#0b0b18'; ctx.fillRect(0, 0, SIZE, SIZE);
  if (!grid) return;
  const cs = SIZE / N, now = performance.now();
  for (let i = 0; i < N * N; i++) {
    const x = (i % N) * cs, y = ((i / N) | 0) * cs;
    ctx.fillStyle = COLORS[grid[i]]; ctx.fillRect(x, y, cs + .5, cs + .5);
  }
  // ondas de la inundación
  wave = wave.filter(w => now - w.t < 300);
  for (const w of wave) {
    const k = (now - w.t) / 300; if (k < 0) continue;
    const x = (w.i % N) * cs, y = ((w.i / N) | 0) * cs;
    ctx.fillStyle = `rgba(255,255,255,${(1 - k) * .55})`; ctx.fillRect(x, y, cs, cs);
  }
  // borde de las zonas
  const edge = (arr, col) => {
    ctx.strokeStyle = col; ctx.lineWidth = 3; ctx.beginPath();
    for (let i = 0; i < N * N; i++) {
      if (!arr[i]) continue;
      const x = (i % N) * cs, y = ((i / N) | 0) * cs;
      if (i % N === 0 || !arr[i - 1]) { ctx.moveTo(x, y); ctx.lineTo(x, y + cs); }
      if (i % N === N - 1 || !arr[i + 1]) { ctx.moveTo(x + cs, y); ctx.lineTo(x + cs, y + cs); }
      if (i < N || !arr[i - N]) { ctx.moveTo(x, y); ctx.lineTo(x + cs, y); }
      if (i >= N * N - N || !arr[i + N]) { ctx.moveTo(x, y + cs); ctx.lineTo(x + cs, y + cs); }
    }
    ctx.stroke();
  };
  edge(own, 'rgba(255,255,255,.95)');
  if (M && M.kind === 'duel') edge(cpuOwn, 'rgba(0,0,0,.75)');
  FX.draw(ctx);
}
BG.input.onKey((e, code, down) => { if (!down || e.repeat) return; const m = /^(?:Digit|Numpad)([1-6])$/.exec(code); if (m) play(+m[1] - 1); });
if (BG.thumb) { mk = 's16'; build(); for (const c of [3, 1, 4, 2, 5, 0, 3]) play(c); BG.stop(); document.getElementById('pal').style.display = 'none'; }
else BG.ready.then(showMenu);
BG.loop(() => {}, render);
</script>
</body>
</html>
