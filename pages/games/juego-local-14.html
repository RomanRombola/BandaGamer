<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Asteroids</title>
<link rel="stylesheet" href="kit/bg-kit.css">
</head>
<body>
<script src="kit/bg-kit.js"></script>
<script>
// ═══════════════════════════════════════════════════════════════════════════
//  ASTEROIDS — BandaGamer
//  Nave con inercia · asteroides que se parten en 3 tamaños · platillos (el grande
//  dispara al azar, el chico apunta) · hiperespacio · power-ups (triple, escudo,
//  ráfaga) · oleadas crecientes · vida extra cada 10.000
// ═══════════════════════════════════════════════════════════════════════════
const { util: U, draw: D, fx: FX, sfx: SFX } = BG;
const W = 800, H = 600;
const SIZES = { 3: { r: 46, pts: 20, sp: 50 }, 2: { r: 26, pts: 50, sp: 85 }, 1: { r: 14, pts: 100, sp: 130 } };
const PU = [{ id: 'triple', c: '#ffd400', t: 'TRIPLE' }, { id: 'shield', c: '#2ef2ff', t: 'ESCUDO' }, { id: 'rapid', c: '#ff3d6e', t: 'RÁFAGA' }];

BG.init({
  id: 'asteroids', title: 'ASTEROIDS', icon: '☄️', accent: '#a46bff', accent2: '#2ef2ff', music: true,
  subtitle: 'Sobreviví al campo de asteroides. Cuidado con los platillos.',
  hud: [{ id: 'score', label: 'Puntos' }, { id: 'wave', label: 'Oleada', color: '#2ef2ff' }, { id: 'lives', label: 'Naves', color: '#ff3d6e', value: '▲▲▲' }],
  help: '<kbd>←</kbd><kbd>→</kbd> girar · <kbd>↑</kbd> acelerar · <kbd>Espacio</kbd> disparar · <kbd>Shift</kbd> hiperespacio · <kbd>P</kbd> pausa',
  helpTouch: 'Flechas para girar · ▲ acelerar · ● disparar · ⟳ hiperespacio',
  touch: { dpad: 'h', buttons: [{ action: 'action2', label: '⟳' }, { action: 'up', label: '▲' }, { action: 'action', label: '●' }] },
  onRestart: () => start(), onMenu: () => showMenu(),
});
const view = BG.canvas(W, H);
const ctx = view.ctx;
const stars = D.stars(140, W, H, 11);

let ship, bullets, rocks, saucers, eBullets, pups, score, lives, wave, state = 'menu', waveT = 0, saucerT = 0, nextLife, beatT = 0, beatHi = false, t = 0;

function makeRock(size, x, y) {
  const s = SIZES[size], n = U.randInt(9, 13), pts = [];
  for (let i = 0; i < n; i++) { const a = i / n * Math.PI * 2; pts.push([Math.cos(a), Math.sin(a), U.rand(.72, 1.1)]); }
  const a = U.rand(Math.PI * 2), sp = s.sp * U.rand(.7, 1.3) * (1 + (wave - 1) * .06);
  return { size, x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, r: s.r, rot: 0, vr: U.rand(-1.4, 1.4), pts, hue: U.pick(['#a46bff', '#8b7bff', '#b98bff', '#7a9bff']) };
}
function newShip() { return { x: W / 2, y: H / 2, vx: 0, vy: 0, a: -Math.PI / 2, thrust: false, cool: 0, inv: 2.5, hyper: 0, triple: 0, rapid: 0, shield: 0, alive: true }; }
function spawnWave() {
  const n = Math.min(3 + wave, 11);
  for (let i = 0; i < n; i++) {
    let x, y;
    do { x = U.rand(W); y = U.rand(H); } while (U.dist(x, y, W / 2, H / 2) < 180);
    rocks.push(makeRock(3, x, y));
  }
  BG.hud.set('wave', wave, true);
  BG.ui.toast(`OLEADA ${wave}`, '#2ef2ff');
}
function start() {
  ship = newShip(); bullets = []; rocks = []; saucers = []; eBullets = []; pups = [];
  score = 0; lives = 3; wave = 1; nextLife = 10000; saucerT = 12; waveT = 0;
  BG.hud.setAll({ score: 0, wave: 1 }); updLives();
  FX.clear(); spawnWave(); state = 'play'; BG.start(); SFX.play('go');
}
function updLives() { BG.hud.set('lives', lives > 0 ? '▲'.repeat(Math.min(lives, 6)) : '—'); }
function showMenu() {
  state = 'menu'; BG.stop();
  if (!rocks || !rocks.length) { wave = 1; rocks = Array.from({ length: 7 }, () => makeRock(U.randInt(1, 3), U.rand(W), U.rand(H))); bullets = []; saucers = []; eBullets = []; pups = []; }
  BG.ui.menu({ buttons: [{ label: '▶ JUGAR', primary: true, onClick: start }] });
}
const wrap = o => { if (o.x < -o.r) o.x += W + o.r * 2; else if (o.x > W + o.r) o.x -= W + o.r * 2; if (o.y < -o.r) o.y += H + o.r * 2; else if (o.y > H + o.r) o.y -= H + o.r * 2; };

function addScore(n) {
  score += n; BG.hud.set('score', score, true);
  if (score >= nextLife) { nextLife += 10000; lives++; updLives(); SFX.play('levelup'); BG.ui.toast('¡NAVE EXTRA!', '#39ff88'); }
}
function shoot() {
  const s = ship;
  const dirs = s.triple > 0 ? [-.18, 0, .18] : [0];
  for (const d of dirs) {
    const a = s.a + d;
    bullets.push({ x: s.x + Math.cos(a) * 16, y: s.y + Math.sin(a) * 16, vx: s.vx + Math.cos(a) * 560, vy: s.vy + Math.sin(a) * 560, life: .95, r: 2 });
  }
  s.cool = s.rapid > 0 ? .09 : .2;
  SFX.play('shoot');
}
function hyperspace() {
  const s = ship; if (s.hyper > 0) return;
  FX.burst(s.x, s.y, { n: 20, color: ['#2ef2ff', '#fff'], speed: 200, life: .4 });
  s.x = U.rand(40, W - 40); s.y = U.rand(40, H - 40); s.vx = s.vy = 0; s.hyper = 1.2; s.inv = .4;
  SFX.play('whoosh');
  FX.burst(s.x, s.y, { n: 20, color: ['#2ef2ff', '#fff'], speed: 160, life: .4 });
  // pequeño riesgo: aparecer encima de un asteroide = explotar
  if (rocks.some(r => U.dist(r.x, r.y, s.x, s.y) < r.r + 6)) { s.inv = 0; }
}
function splitRock(r, i) {
  rocks.splice(i, 1);
  addScore(SIZES[r.size].pts);
  FX.burst(r.x, r.y, { n: 6 + r.size * 6, color: [r.hue, '#fff', '#c9b8ff'], speed: 60 + r.size * 50, life: .6, size: 2.5 });
  FX.ring(r.x, r.y, { color: r.hue, max: r.r * 1.6, life: .35 });
  SFX.play(r.size === 3 ? 'explode' : 'hit');
  if (r.size === 3) FX.shake(4, .2);
  if (r.size > 1) for (let k = 0; k < 2; k++) { const nr = makeRock(r.size - 1, r.x, r.y); rocks.push(nr); }
  if (U.chance(r.size === 1 ? .05 : .03)) pups.push({ ...U.pick(PU), x: r.x, y: r.y, t: 10, r: 11 });
}
function killShip() {
  const s = ship; if (!s.alive) return;
  if (s.shield > 0) { s.shield = 0; s.inv = 1; SFX.play('power'); FX.ring(s.x, s.y, { color: '#2ef2ff', max: 60 }); return; }
  s.alive = false; lives--; updLives();
  FX.burst(s.x, s.y, { n: 40, color: ['#ffffff', '#ff3d6e', '#ffd400'], speed: 260, life: 1, shape: 'line', size: 3 });
  FX.shake(9, .45); FX.flash('#ff3d6e', .3); SFX.play('explode'); SFX.play('hurt');
  setTimeout(() => {
    if (lives <= 0) gameOver();
    else { ship = newShip(); ship.inv = 3; }
  }, 1600);
}
function gameOver() {
  state = 'over'; BG.stop(); BG.music.stop();
  const r = BG.submitScore(score);
  SFX.play('lose');
  BG.ui.gameOver({
    icon: '☄️', score, isRecord: r.isRecord || r.first, recordText: r.first ? '★ ¡PRIMER RÉCORD! ★' : null,
    stats: [{ label: 'Récord', value: U.fmt(BG.getBest() || score) }, { label: 'Oleada', value: wave }],
    onRetry: start, onMenu: showMenu,
  });
}
function spawnSaucer() {
  const small = score > 8000 ? U.chance(.6) : score > 3000 ? U.chance(.35) : false;
  const left = U.chance(.5);
  saucers.push({ x: left ? -30 : W + 30, y: U.rand(60, H - 60), vx: (left ? 1 : -1) * (small ? 140 : 100), vy: 0, small, r: small ? 12 : 20, cool: 1, zig: 0 });
}

function update(dt) {
  t += dt;
  for (const r of rocks || []) { r.x += r.vx * dt; r.y += r.vy * dt; r.rot += r.vr * dt; wrap(r); }
  if (state !== 'play') return;
  const s = ship, I = BG.input;
  // nave
  if (s.alive) {
    const turn = I.axisX();
    s.a += turn * 4.4 * dt;
    s.thrust = I.isDown('up');
    if (s.thrust) {
      s.vx += Math.cos(s.a) * 300 * dt; s.vy += Math.sin(s.a) * 300 * dt;
      if (Math.random() < .7) FX.burst(s.x - Math.cos(s.a) * 12, s.y - Math.sin(s.a) * 12, { n: 1, color: ['#ff9a1f', '#ffd400', '#ff3d6e'], speed: 120, angle: s.a + Math.PI, spread: .35, life: .3, size: 3 });
    }
    const sp = Math.hypot(s.vx, s.vy); if (sp > 420) { s.vx *= 420 / sp; s.vy *= 420 / sp; }
    s.vx *= Math.pow(.55, dt); s.vy *= Math.pow(.55, dt);
    s.x += s.vx * dt; s.y += s.vy * dt; s.r = 12; wrap(s);
    s.cool -= dt; s.inv = Math.max(0, s.inv - dt); s.hyper = Math.max(0, s.hyper - dt);
    s.triple = Math.max(0, s.triple - dt); s.rapid = Math.max(0, s.rapid - dt); s.shield = Math.max(0, s.shield - dt);
    if ((I.isDown('action')) && s.cool <= 0 && bullets.length < (s.rapid > 0 ? 14 : 7)) shoot();
    if (I.pressed('action2')) hyperspace();
  }
  // balas
  for (const b of bullets) { b.x += b.vx * dt; b.y += b.vy * dt; b.life -= dt; b.r = 2; wrap(b); }
  bullets = bullets.filter(b => b.life > 0);
  for (const b of eBullets) { b.x += b.vx * dt; b.y += b.vy * dt; b.life -= dt; wrap(b); }
  eBullets = eBullets.filter(b => b.life > 0);
  // colisiones balas ↔ asteroides
  for (let i = rocks.length - 1; i >= 0; i--) {
    const r = rocks[i];
    const bi = bullets.findIndex(b => U.dist(b.x, b.y, r.x, r.y) < r.r);
    if (bi >= 0) { bullets.splice(bi, 1); splitRock(r, i); continue; }
    if (s.alive && s.inv <= 0 && U.dist(s.x, s.y, r.x, r.y) < r.r + 9) { splitRock(r, i); killShip(); }
  }
  // platillos
  saucerT -= dt;
  if (saucerT <= 0 && !saucers.length) { spawnSaucer(); saucerT = U.rand(14, 22) - Math.min(wave, 8); }
  for (let i = saucers.length - 1; i >= 0; i--) {
    const u = saucers[i];
    u.zig -= dt; if (u.zig <= 0) { u.zig = U.rand(.8, 1.8); u.vy = U.pick([-1, 0, 1]) * 70; }
    u.x += u.vx * dt; u.y = U.clamp(u.y + u.vy * dt, 30, H - 30);
    u.cool -= dt;
    if (u.cool <= 0 && s.alive) {
      u.cool = u.small ? .9 : 1.3;
      const a = u.small ? U.angle(u.x, u.y, s.x, s.y) + U.rand(-.12, .12) : U.rand(Math.PI * 2);
      eBullets.push({ x: u.x, y: u.y, vx: Math.cos(a) * 300, vy: Math.sin(a) * 300, life: 1.6, r: 3 });
      SFX.tone({ f: 700, f2: 300, dur: .1, type: 'square', vol: .06 });
    }
    if (t % .4 < dt) SFX.tone({ f: u.small ? 1100 : 700, f2: u.small ? 900 : 560, dur: .12, type: 'sine', vol: .04 });
    const bi = bullets.findIndex(b => U.dist(b.x, b.y, u.x, u.y) < u.r + 2);
    if (bi >= 0) {
      bullets.splice(bi, 1); saucers.splice(i, 1);
      const pts = u.small ? 1000 : 200; addScore(pts);
      FX.text(u.x, u.y, '+' + pts, { color: '#39ff88', size: 16 });
      FX.burst(u.x, u.y, { n: 30, color: ['#39ff88', '#fff'], speed: 220, life: .7 }); SFX.play('explode');
      if (U.chance(.5)) pups.push({ ...U.pick(PU), x: u.x, y: u.y, t: 10, r: 11 });
      continue;
    }
    if (s.alive && s.inv <= 0 && U.dist(s.x, s.y, u.x, u.y) < u.r + 9) { saucers.splice(i, 1); killShip(); continue; }
    if (u.x < -60 || u.x > W + 60) saucers.splice(i, 1);
  }
  if (s.alive && s.inv <= 0) for (let i = eBullets.length - 1; i >= 0; i--) if (U.dist(eBullets[i].x, eBullets[i].y, s.x, s.y) < 11) { eBullets.splice(i, 1); killShip(); break; }
  // power-ups
  for (let i = pups.length - 1; i >= 0; i--) {
    const p = pups[i]; p.t -= dt;
    if (p.t <= 0) { pups.splice(i, 1); continue; }
    if (s.alive && U.dist(s.x, s.y, p.x, p.y) < p.r + 12) {
      pups.splice(i, 1); s[p.id] = p.id === 'shield' ? 12 : 10;
      SFX.play('power');
      BG.ui.toast(PU.find(x => x.id === p.id).t, p.c);
    }
  }
  // latido de fondo (más rápido cuantos menos asteroides quedan)
  beatT -= dt;
  if (beatT <= 0) { beatT = Math.max(.28, .9 - (1 - rocks.length / 20) * .5); beatHi = !beatHi; SFX.tone({ f: beatHi ? 70 : 60, dur: .12, type: 'triangle', vol: .3 }); }
  // siguiente oleada
  if (!rocks.length && !saucers.length) {
    waveT += dt;
    if (waveT > 1.6) { waveT = 0; wave++; addScore(wave * 100); spawnWave(); }
  }
}

function drawShip(s) {
  if (!s || !s.alive) return;
  if (s.inv > 0 && Math.floor(s.inv * 10) % 2) return;
  ctx.save(); ctx.translate(s.x, s.y); ctx.rotate(s.a);
  ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 2; ctx.shadowColor = '#2ef2ff'; ctx.shadowBlur = 14; ctx.lineJoin = 'round';
  ctx.beginPath(); ctx.moveTo(17, 0); ctx.lineTo(-11, -10); ctx.lineTo(-6, 0); ctx.lineTo(-11, 10); ctx.closePath(); ctx.stroke();
  if (s.thrust && Math.random() < .8) { ctx.strokeStyle = '#ff9a1f'; ctx.shadowColor = '#ff9a1f'; ctx.beginPath(); ctx.moveTo(-8, -5); ctx.lineTo(-18 - Math.random() * 8, 0); ctx.lineTo(-8, 5); ctx.stroke(); }
  ctx.restore();
  if (s.shield > 0) { ctx.strokeStyle = `rgba(46,242,255,${.35 + Math.sin(t * 10) * .2})`; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(s.x, s.y, 22, 0, 7); ctx.stroke(); }
}
function render() {
  ctx.fillStyle = '#040410'; ctx.fillRect(0, 0, W, H);
  for (const st of stars) { ctx.globalAlpha = st.z * (.6 + .4 * Math.sin(t * 2 + st.tw)); ctx.fillStyle = '#c9d4ff'; ctx.fillRect(st.x, st.y, st.z * 1.8, st.z * 1.8); }
  ctx.globalAlpha = 1;
  const neb = ctx.createRadialGradient(W * .7, H * .3, 10, W * .7, H * .3, 380);
  neb.addColorStop(0, 'rgba(120,60,200,.18)'); neb.addColorStop(1, 'rgba(0,0,0,0)'); ctx.fillStyle = neb; ctx.fillRect(0, 0, W, H);
  ctx.save(); FX.applyShake(ctx);
  // asteroides (con copias en los bordes para que el "wrap" se vea continuo)
  ctx.lineWidth = 2; ctx.lineJoin = 'round';
  for (const r of rocks || []) {
    ctx.strokeStyle = r.hue; ctx.shadowColor = r.hue; ctx.shadowBlur = 12;
    ctx.fillStyle = 'rgba(70,40,140,.25)';
    ctx.save(); ctx.translate(r.x, r.y); ctx.rotate(r.rot);
    ctx.beginPath(); r.pts.forEach(([cx, cy, k], i) => { const x = cx * r.r * k, y = cy * r.r * k; i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); }); ctx.closePath();
    ctx.fill(); ctx.stroke(); ctx.restore();
  }
  ctx.shadowBlur = 0;
  // platillos
  for (const u of saucers || []) {
    ctx.save(); ctx.translate(u.x, u.y); ctx.strokeStyle = '#39ff88'; ctx.shadowColor = '#39ff88'; ctx.shadowBlur = 14; ctx.lineWidth = 2;
    const k = u.r / 20;
    ctx.beginPath(); ctx.ellipse(0, 0, 22 * k, 8 * k, 0, 0, 7); ctx.stroke();
    ctx.beginPath(); ctx.ellipse(0, -6 * k, 10 * k, 8 * k, 0, Math.PI, 0); ctx.stroke();
    ctx.fillStyle = '#39ff88'; for (let i = -1; i <= 1; i++) ctx.fillRect(i * 9 * k - 1.5, -1.5, 3, 3);
    ctx.restore();
  }
  // balas
  for (const b of bullets || []) D.glowCircle(ctx, b.x, b.y, 2.4, '#ffffff', 10);
  for (const b of eBullets || []) D.glowCircle(ctx, b.x, b.y, 3, '#39ff88', 12);
  // power-ups
  for (const p of pups || []) {
    if (p.t < 3 && Math.floor(p.t * 6) % 2) continue;
    ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(t * 2); ctx.strokeStyle = p.c; ctx.shadowColor = p.c; ctx.shadowBlur = 14; ctx.lineWidth = 2;
    ctx.strokeRect(-9, -9, 18, 18); ctx.restore();
    D.text(ctx, p.id === 'triple' ? '3' : p.id === 'shield' ? 'S' : 'R', p.x, p.y + 1, { size: 11, color: p.c });
  }
  drawShip(ship);
  FX.draw(ctx);
  ctx.restore();
  // estado de power-ups
  if (ship && state === 'play') {
    let x = 12;
    for (const p of PU) if (ship[p.id] > 0) { D.text(ctx, `${p.t} ${Math.ceil(ship[p.id])}`, x, H - 14, { size: 11, color: p.c, align: 'left' }); x += 110; }
  }
  FX.drawFlash(ctx, W, H);
}

// ── Arranque ──────────────────────────────────────────────────────────────
wave = 1;
if (BG.thumb) {
  rocks = [makeRock(3, 160, 140), makeRock(3, 620, 430), makeRock(2, 560, 150), makeRock(2, 250, 460), makeRock(1, 690, 300), makeRock(1, 120, 360)];
  rocks.forEach(r => { r.vx = r.vy = 0; });
  ship = newShip(); ship.inv = 0; ship.thrust = true; ship.a = -0.6; bullets = [{ x: 460, y: 220, r: 2 }, { x: 500, y: 192, r: 2 }, { x: 540, y: 165, r: 2 }];
  saucers = [{ x: 380, y: 90, r: 20 }]; eBullets = []; pups = [{ ...PU[1], x: 300, y: 380, t: 9, r: 11 }];
  update = () => {};
} else BG.ready.then(showMenu);
BG.loop(dt => update(dt), render);
</script>
</body>
</html>
