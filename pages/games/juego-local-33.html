<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Fruit Catch</title>
<link rel="stylesheet" href="kit/bg-kit.css">
</head>
<body>
<script src="kit/bg-kit.js"></script>
<script>
// ═══════════════════════════════════════════════════════════════════════════
//  FRUIT CATCH — BandaGamer
//  Atrapá frutas (cada una vale distinto), la dorada vale ×5 · esquivá bombas
//  Combo por atrapar seguidas · power-ups: imán, canasta XL, cámara lenta, escudo
// ═══════════════════════════════════════════════════════════════════════════
const { util: U, draw: D, fx: FX, sfx: SFX } = BG;
const W = 480, H = 680, GROUND = 620;
const FRUITS = [['🍎', 10], ['🍊', 10], ['🍌', 15], ['🍇', 20], ['🍓', 20], ['🍉', 30], ['🍍', 40], ['🥭', 25], ['🍒', 35]];
const POWERS = [{ id: 'magnet', e: '🧲', n: 'IMÁN', t: 7 }, { id: 'wide', e: '🧺', n: 'CANASTA XL', t: 8 }, { id: 'slow', e: '⏳', n: 'CÁMARA LENTA', t: 6 }, { id: 'shield', e: '🛡️', n: 'ESCUDO', t: 15 }];
BG.init({
  post: { bloom: .12, vignette: .22 },
  id: 'fruitcatch', title: 'FRUIT CATCH', icon: '🧺', accent: '#39ff88', accent2: '#ffd400',
  subtitle: 'Atrapá todas las frutas que puedas. ¡Las bombas te sacan una vida!',
  hud: [{ id: 'score', label: 'Puntos' }, { id: 'combo', label: 'Combo', color: '#ffd400', value: '×1' }, { id: 'lives', label: 'Vidas', color: '#ff3d6e', value: '❤❤❤' }],
  help: 'Mové la canasta con el mouse, el dedo o <kbd>←</kbd><kbd>→</kbd>',
  touch: { dpad: 'h', buttons: [] },
  onRestart: () => start(), onMenu: () => showMenu(),
});
const view = BG.canvas(W, H);
const ctx = view.ctx;
let basket, items = [], score, lives, combo, maxCombo, caught, spawnT, elapsed, power = {}, state = 'menu', t = 0, pointerX = null;
const clouds = Array.from({ length: 5 }, (_, i) => ({ x: i * 110, y: 40 + (i % 3) * 40, s: .7 + (i % 3) * .2 }));
function start() {
  basket = { x: W / 2, w: 96, vx: 0, squash: 0 }; items = []; score = 0; lives = 3; combo = 0; maxCombo = 0; caught = 0; spawnT = .5; elapsed = 0; power = {};
  BG.hud.setAll({ score: 0, combo: '×1' }); updLives(); FX.clear(); state = 'play'; BG.start();
}
function showMenu() { state = 'menu'; BG.stop(); if (!basket) { basket = { x: W / 2, w: 96, vx: 0, squash: 0 }; items = []; power = {}; } BG.ui.menu({ buttons: [{ label: '▶ JUGAR', primary: true, onClick: start }] }); }
function updLives() { BG.hud.set('lives', lives > 0 ? '❤'.repeat(lives) : '—'); }
const mult = () => 1 + Math.floor(combo / 8);
function spawn() {
  const diff = Math.min(1, elapsed / 120);
  const r = Math.random();
  let it;
  if (r < .16 + diff * .14) it = { kind: 'bomb', e: '💣' };
  else if (r < .2 + diff * .14) it = { kind: 'gold', e: '🌟', pts: 0 };
  else if (r < .235 + diff * .14) { const p = U.pick(POWERS); it = { kind: 'power', e: p.e, p }; }
  else { const f = U.pick(FRUITS); it = { kind: 'fruit', e: f[0], pts: f[1] }; }
  it.x = U.rand(30, W - 30); it.y = -30; it.vy = U.rand(140, 200) + diff * 220; it.vx = U.rand(-30, 30); it.rot = U.rand(6); it.vr = U.rand(-3, 3);
  if (it.kind === 'gold') { const f = U.pick(FRUITS); it.e = f[0]; it.pts = f[1] * 5; }
  items.push(it);
}
function catchIt(it) {
  if (it.kind === 'bomb') {
    if (power.shield > 0) { power.shield = 0; SFX.play('power'); FX.ring(basket.x, GROUND - 20, { color: '#2ef2ff', max: 80 }); BG.ui.toast('¡ESCUDO!', '#2ef2ff'); return; }
    lives--; updLives(); combo = 0; BG.hud.set('combo', '×1');
    SFX.play('explode'); FX.shake(10, .4); FX.flash('#ff3d6e', .4);
    FX.burst(it.x, it.y, { n: 40, color: ['#ff3d6e', '#ffd400', '#444'], speed: 300, life: .7 });
    if (lives <= 0) over();
    return;
  }
  if (it.kind === 'power') { power[it.p.id] = it.p.t; SFX.play('power'); BG.ui.toast(it.p.n, '#2ef2ff'); FX.burst(it.x, it.y, { n: 16, color: ['#2ef2ff', '#fff'], speed: 160 }); return; }
  combo++; caught++; maxCombo = Math.max(maxCombo, combo);
  const pts = it.pts * mult(); score += pts;
  BG.hud.set('score', score, true); BG.hud.set('combo', '×' + mult());
  basket.squash = 1;
  SFX.tone({ f: 500 + Math.min(combo, 30) * 20, dur: .08, type: 'sine', vol: .2 });
  if (it.kind === 'gold') { SFX.play('coin'); FX.flash('#ffd400', .2); }
  FX.burst(it.x, it.y, { n: it.kind === 'gold' ? 22 : 8, color: it.kind === 'gold' ? ['#ffd400', '#fff'] : ['#39ff88', '#fff', '#ffd400'], speed: 150, life: .4 });
  FX.text(it.x, it.y - 20, '+' + pts, { color: it.kind === 'gold' ? '#ffd400' : '#fff', size: it.kind === 'gold' ? 22 : 16 });
  if (combo % 8 === 0) { SFX.play('combo', combo / 8); BG.ui.toast(`¡COMBO ×${mult()}!`, '#ffd400'); }
}
function over() {
  state = 'over'; BG.stop(); SFX.play('lose');
  const r = BG.submitScore(score);
  setTimeout(() => BG.ui.gameOver({ icon: '🧺', score, isRecord: r.isRecord || r.first, recordText: r.first ? '★ ¡PRIMER RÉCORD! ★' : null,
    stats: [{ label: 'Récord', value: U.fmt(BG.getBest() || score) }, { label: 'Frutas', value: caught }, { label: 'Combo máx', value: maxCombo }], onRetry: start, onMenu: showMenu }), 800);
}
function update(dt) {
  t += dt;
  if (state !== 'play') return;
  const slow = power.slow > 0 ? .5 : 1, gdt = dt * slow;
  elapsed += dt;
  for (const k in power) power[k] = Math.max(0, power[k] - dt);
  // canasta
  const bw = power.wide > 0 ? 150 : 96; basket.w = U.lerp(basket.w, bw, dt * 8);
  if (pointerX != null) basket.x = U.lerp(basket.x, pointerX, Math.min(1, dt * 18));
  else { basket.vx = U.lerp(basket.vx, BG.input.axisX() * 520, Math.min(1, dt * 12)); basket.x += basket.vx * dt; }
  basket.x = U.clamp(basket.x, basket.w / 2, W - basket.w / 2);
  basket.squash = Math.max(0, basket.squash - dt * 6);
  spawnT -= gdt;
  if (spawnT <= 0) { spawn(); spawnT = Math.max(.28, .9 - elapsed * .005) * U.rand(.6, 1.2); }
  for (const it of items) {
    if (power.magnet > 0 && it.kind !== 'bomb' && it.y > 200) it.vx = U.lerp(it.vx, (basket.x - it.x) * 3, gdt * 4);
    it.x += it.vx * gdt; it.y += it.vy * gdt; it.rot += it.vr * gdt;
    if (it.x < 20 || it.x > W - 20) it.vx *= -1;
    if (!it.done && it.y > GROUND - 50 && it.y < GROUND - 10 && Math.abs(it.x - basket.x) < basket.w / 2) { it.done = true; catchIt(it); }
    if (!it.done && it.y > GROUND + 10) { it.done = true; if (it.kind === 'fruit' || it.kind === 'gold') { combo = 0; BG.hud.set('combo', '×1'); FX.burst(it.x, GROUND, { n: 8, color: ['#c0392b', '#8b5a2b'], speed: 100, gravity: 400, life: .5 }); SFX.tone({ f: 160, dur: .1, type: 'triangle', vol: .15 }); } }
  }
  items = items.filter(it => !it.done && it.y < H + 40);
}
function render() {
  const sky = ctx.createLinearGradient(0, 0, 0, H); sky.addColorStop(0, '#5ec8ff'); sky.addColorStop(.7, '#bdeeff'); sky.addColorStop(1, '#e8fbff');
  ctx.fillStyle = sky; ctx.fillRect(0, 0, W, H);
  D.glowCircle(ctx, W - 70, 80, 34, '#fff4b0', 40);
  for (const c of clouds) { const x = ((c.x + t * 10 * c.s) % (W + 140)) - 70; ctx.fillStyle = 'rgba(255,255,255,.9)'; ctx.beginPath(); ctx.arc(x, c.y, 20 * c.s, 0, 7); ctx.arc(x + 22 * c.s, c.y - 8 * c.s, 24 * c.s, 0, 7); ctx.arc(x + 46 * c.s, c.y, 19 * c.s, 0, 7); ctx.fill(); }
  // árboles del fondo
  for (let i = 0; i < 5; i++) { const x = 40 + i * 105; ctx.fillStyle = '#8b5a2b'; ctx.fillRect(x - 6, GROUND - 110, 12, 110); ctx.fillStyle = i % 2 ? '#3fae4a' : '#4cc35a'; ctx.beginPath(); ctx.arc(x, GROUND - 130, 48, 0, 7); ctx.fill(); }
  ctx.fillStyle = '#5fbf4a'; ctx.fillRect(0, GROUND, W, H - GROUND); ctx.fillStyle = '#4ea83c'; ctx.fillRect(0, GROUND, W, 8);
  ctx.save(); FX.applyShake(ctx);
  if (power.slow > 0) { ctx.fillStyle = 'rgba(80,120,255,.12)'; ctx.fillRect(0, 0, W, H); }
  for (const it of items) {
    ctx.save(); ctx.translate(it.x, it.y); ctx.rotate(it.kind === 'bomb' ? 0 : it.rot * .3);
    if (it.kind === 'gold') { ctx.shadowColor = '#ffd400'; ctx.shadowBlur = 24; }
    if (it.kind === 'power') { D.glowCircle(ctx, 0, 0, 22, 'rgba(46,242,255,.35)', 20); }
    D.text(ctx, it.e, 0, 0, { size: it.kind === 'gold' ? 40 : 34, family: 'body' });
    if (it.kind === 'gold') D.text(ctx, '✦', 16, -16, { size: 16, color: '#fff' });
    ctx.restore();
  }
  // canasta
  if (basket) {
    const bx = basket.x, by = GROUND - 30, w = basket.w, sq = basket.squash * .15;
    ctx.save(); ctx.translate(bx, by); ctx.scale(1 + sq, 1 - sq);
    if (power.magnet > 0) { ctx.strokeStyle = `rgba(255,61,110,${.3 + Math.sin(t * 10) * .2})`; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(0, -10, w * .7, Math.PI, 0); ctx.stroke(); }
    ctx.fillStyle = '#b5772f'; ctx.beginPath(); ctx.moveTo(-w / 2, -20); ctx.lineTo(w / 2, -20); ctx.lineTo(w / 2 - 12, 26); ctx.lineTo(-w / 2 + 12, 26); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = '#8a5520'; ctx.lineWidth = 2; for (let y = -12; y < 26; y += 9) { ctx.beginPath(); ctx.moveTo(-w / 2 + 6, y); ctx.lineTo(w / 2 - 6, y); ctx.stroke(); }
    ctx.fillStyle = '#d99a4e'; D.rr(ctx, -w / 2 - 4, -26, w + 8, 10, 5); ctx.fill();
    if (power.shield > 0) { ctx.strokeStyle = `rgba(46,242,255,${.5 + Math.sin(t * 8) * .3})`; ctx.lineWidth = 3; ctx.beginPath(); ctx.ellipse(0, 0, w * .62, 42, 0, 0, 7); ctx.stroke(); }
    ctx.restore();
  }
  FX.draw(ctx);
  ctx.restore();
  let px = 12; for (const p of POWERS) if (power[p.id] > 0) { D.text(ctx, `${p.e} ${Math.ceil(power[p.id])}`, px, H - 18, { size: 14, color: '#fff', align: 'left', family: 'body', stroke: 'rgba(0,0,0,.4)' }); px += 64; }
  FX.drawFlash(ctx, W, H);
}
view.canvas.addEventListener('pointermove', e => { if (e.pointerType === 'mouse' || e.buttons) pointerX = view.toLocal(e.clientX, e.clientY).x; });
view.canvas.addEventListener('pointerdown', e => { pointerX = view.toLocal(e.clientX, e.clientY).x; });
view.canvas.addEventListener('pointerleave', () => { pointerX = null; });
window.addEventListener('keydown', e => { if (/Arrow|KeyA|KeyD/.test(e.code)) pointerX = null; });
if (BG.thumb) { start(); BG.stop(); state = 'thumb'; items = [{ kind: 'fruit', e: '🍉', x: 120, y: 200, rot: 0 }, { kind: 'gold', e: '🍓', x: 300, y: 320, rot: .4 }, { kind: 'bomb', e: '💣', x: 380, y: 140, rot: 0 }, { kind: 'fruit', e: '🍌', x: 210, y: 470, rot: .2 }, { kind: 'power', e: '🧲', x: 70, y: 380, rot: 0 }]; basket.x = 230; update = () => {}; }
else BG.ready.then(showMenu);
BG.loop(dt => update(dt), render);
</script>
</body>
</html>
