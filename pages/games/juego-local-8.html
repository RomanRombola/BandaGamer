<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Buscaminas</title>
<link rel="stylesheet" href="kit/bg-kit.css">
<style>
#wrap { display: flex; flex-direction: column; align-items: center; gap: 10px; max-width: 100%; }
#bar { display: flex; align-items: center; gap: 10px; }
#face { width: 46px; height: 46px; font-size: 26px; border-radius: 12px; border: 1px solid rgba(255,255,255,.15); background: rgba(255,255,255,.06); cursor: pointer; }
#face:active { transform: scale(.92); }
#flagmode { display: none; }
body.bg-touch-dev #flagmode { display: inline-flex; }
#flagmode.on { border-color: #ff3d6e; background: rgba(255,61,110,.2); }
#board { display: grid; gap: 2px; padding: 8px; border-radius: 14px; background: #10102a; box-shadow: 0 0 0 1px rgba(0,229,255,.22), 0 14px 44px rgba(0,0,0,.6); touch-action: manipulation; user-select: none; }
.c { display: flex; align-items: center; justify-content: center; border-radius: 4px; font-family: 'Orbitron', sans-serif; font-weight: 900; cursor: pointer;
  background: linear-gradient(145deg, #34346a, #26264f); box-shadow: inset 0 1px 0 rgba(255,255,255,.12), inset 0 -2px 0 rgba(0,0,0,.25); transition: background .12s; }
.c:hover { background: linear-gradient(145deg, #42428a, #2f2f62); }
.c.open { background: #0b0b1e; box-shadow: inset 0 0 0 1px rgba(255,255,255,.04); cursor: default; animation: reveal .18s ease both; }
@keyframes reveal { from { transform: scale(.6); opacity: .2; } }
.c.flag::after { content: '🚩'; font-size: .9em; animation: plant .2s ease; }
@keyframes plant { from { transform: translateY(-6px) scale(1.4); } }
.c.mine { background: #2a0b17; }
.c.mine::after { content: '💣'; font-size: .9em; }
.c.boom { background: radial-gradient(circle, #ff3d6e, #7a0f2b); animation: boom .4s ease; }
.c.wrong { background: #2a1a0b; }
.c.wrong::after { content: '❌'; font-size: .8em; }
.c.press { background: #1a1a38; }
.n1 { color: #39a0ff; } .n2 { color: #39ff88; } .n3 { color: #ff3d6e; } .n4 { color: #c04dff; }
.n5 { color: #ff9a1f; } .n6 { color: #2ef2ff; } .n7 { color: #ffe066; } .n8 { color: #ffffff; }
@keyframes boom { 0% { transform: scale(1.5); } 100% { transform: scale(1); } }
</style>
</head>
<body>
<div id="bg-stage">
  <div id="wrap">
    <div id="bar">
      <button class="bg-btn" id="lvl">INTERMEDIO</button>
      <button id="face" title="Nueva partida">🙂</button>
      <button class="bg-btn" id="flagmode" title="Modo bandera">🚩 BANDERA</button>
    </div>
    <div id="board"></div>
  </div>
</div>
<script src="kit/bg-kit.js"></script>
<script>
// ═══════════════════════════════════════════════════════════════════════════
//  BUSCAMINAS — BandaGamer
//  Principiante / Intermedio / Experto con récord de tiempo · primer clic seguro
//  Chording (clic en un número abre los vecinos) · bandera con clic derecho,
//  pulsación larga o modo bandera en celular · apertura en cascada animada
// ═══════════════════════════════════════════════════════════════════════════
const { util: U, sfx: SFX, fx: FX } = BG;
const LEVELS = {
  facil: { name: 'PRINCIPIANTE', w: 9, h: 9, m: 10 },
  medio: { name: 'INTERMEDIO', w: 16, h: 16, m: 40 },
  dificil: { name: 'EXPERTO', w: 30, h: 16, m: 99 },
};
BG.init({
  id: 'buscaminas', title: 'BUSCAMINAS', icon: '💣', accent: '#00e5ff', accent2: '#c04dff', scroll: true, pausable: false,
  subtitle: 'Abrí todas las casillas sin minas. Los números dicen cuántas minas hay alrededor.',
  hud: [{ id: 'mines', label: 'Minas', color: '#ff3d6e' }, { id: 'time', label: 'Tiempo', value: '0:00' }, { id: 'best', label: 'Récord', color: '#39ff88', value: '—' }],
  help: 'Clic: abrir · Clic derecho: bandera · Clic en un número con sus banderas puestas: abre los vecinos',
  helpTouch: 'Tocá para abrir · mantené apretado (o activá 🚩) para poner bandera · tocá un número para abrir sus vecinos',
});
if (BG.isTouch) document.body.classList.add('bg-touch-dev');

const boardEl = document.getElementById('board');
let lvKey = BG.load('lvl', 'medio'), L, W, Hh, cells, mines, opened, flags, started, over, t0, timerId, flagMode = false, rotated = false;

function idx(x, y) { return y * W + x; }
function neigh(i) {
  const x = i % W, y = (i / W) | 0, out = [];
  for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
    if (!dx && !dy) continue;
    const nx = x + dx, ny = y + dy;
    if (nx >= 0 && nx < W && ny >= 0 && ny < Hh) out.push(idx(nx, ny));
  }
  return out;
}

function setup(key) {
  lvKey = key || lvKey; BG.save('lvl', lvKey); L = LEVELS[lvKey];
  // en celular vertical, el experto se gira (16×30) para que entre
  const st = BG.stage.getBoundingClientRect();
  rotated = L.w > L.h && st.height > st.width * 1.15;
  W = rotated ? L.h : L.w; Hh = rotated ? L.w : L.h;
  cells = Array.from({ length: W * Hh }, () => ({ mine: false, n: 0, open: false, flag: false }));
  mines = new Set(); opened = 0; flags = 0; started = false; over = false;
  clearInterval(timerId);
  document.getElementById('lvl').textContent = L.name;
  document.getElementById('face').textContent = '🙂';
  BG.hud.setAll({ mines: L.m, time: '0:00' });
  const b = BG.getBest(lvKey); BG.hud.set('best', b ? U.fmtTime(b) : '—');
  build();
  BG.start();
}
function build() {
  boardEl.innerHTML = '';
  const st = BG.stage.getBoundingClientRect();
  const size = Math.max(16, Math.min(40, Math.floor(Math.min((st.width - 40) / W, (st.height - 110) / Hh)) - 2));
  boardEl.style.gridTemplateColumns = `repeat(${W}, ${size}px)`;
  boardEl.style.gridAutoRows = size + 'px';
  boardEl.style.fontSize = Math.round(size * .55) + 'px';
  for (let i = 0; i < W * Hh; i++) {
    const d = document.createElement('div'); d.className = 'c'; d.dataset.i = i;
    boardEl.appendChild(d);
  }
}
function el(i) { return boardEl.children[i]; }

function placeMines(safe) {
  const forbid = new Set([safe, ...neigh(safe)]);
  const pool = [];
  for (let i = 0; i < W * Hh; i++) if (!forbid.has(i)) pool.push(i);
  U.shuffle(pool);
  for (let k = 0; k < L.m; k++) { mines.add(pool[k]); cells[pool[k]].mine = true; }
  for (let i = 0; i < W * Hh; i++) cells[i].n = neigh(i).filter(j => cells[j].mine).length;
}

function startTimer() {
  started = true; t0 = performance.now();
  timerId = setInterval(() => BG.hud.set('time', U.fmtTime((performance.now() - t0) / 1000)), 250);
}

function reveal(i) {
  if (over || cells[i].open || cells[i].flag) return;
  if (!started) { placeMines(i); startTimer(); }
  const c = cells[i];
  if (c.mine) { lose(i); return; }
  // apertura en cascada (BFS) con pequeño retardo por distancia
  const q = [[i, 0]], seen = new Set([i]);
  let count = 0;
  while (q.length) {
    const [j, d] = q.shift();
    const cj = cells[j];
    if (cj.open || cj.flag) continue;
    cj.open = true; opened++; count++;
    const e = el(j);
    setTimeout(() => {
      e.classList.add('open');
      if (cj.n) { e.textContent = cj.n; e.classList.add('n' + cj.n); }
    }, Math.min(d * 18, 400));
    if (cj.n === 0) neigh(j).forEach(k => { if (!seen.has(k) && !cells[k].mine) { seen.add(k); q.push([k, d + 1]); } });
  }
  SFX.play(count > 6 ? 'whoosh' : 'click');
  checkWin();
}
function toggleFlag(i) {
  if (over || cells[i].open) return;
  const c = cells[i];
  c.flag = !c.flag; flags += c.flag ? 1 : -1;
  el(i).classList.toggle('flag', c.flag);
  BG.hud.set('mines', L.m - flags);
  SFX.play(c.flag ? 'place' : 'swap');
  if (navigator.vibrate && (!navigator.userActivation || navigator.userActivation.hasBeenActive)) try { navigator.vibrate(c.flag ? 25 : 10); } catch (e) {}
}
function chord(i) {
  const c = cells[i];
  if (!c.open || !c.n) return;
  const ns = neigh(i), f = ns.filter(j => cells[j].flag).length;
  if (f !== c.n) { ns.forEach(j => { if (!cells[j].open && !cells[j].flag) { const e = el(j); e.classList.add('press'); setTimeout(() => e.classList.remove('press'), 150); } }); return; }
  ns.forEach(j => { if (!cells[j].open && !cells[j].flag) reveal(j); });
}

function checkWin() {
  if (over || opened !== W * Hh - L.m) return;
  over = true; clearInterval(timerId); BG.stop();
  const secs = Math.max(1, Math.round((performance.now() - t0) / 1000));
  mines.forEach(j => { if (!cells[j].flag) { cells[j].flag = true; el(j).classList.add('flag'); } });
  BG.hud.set('mines', 0);
  document.getElementById('face').textContent = '😎';
  const r = BG.submitScore(secs, { mode: lvKey, order: 'asc', won: true });
  SFX.play('win');
  confetti();
  setTimeout(() => BG.ui.gameOver({
    win: true, title: '¡DESPEJADO!', icon: '😎', score: secs, scoreText: U.fmtTime(secs), scoreLabel: 'TIEMPO',
    isRecord: r.isRecord || r.first, recordText: r.first ? '★ ¡PRIMER RÉCORD! ★' : null,
    stats: [{ label: 'Récord', value: U.fmtTime(BG.getBest(lvKey) || secs) }, { label: 'Dificultad', value: L.name }],
    onRetry: () => setup(), onMenu: showMenu,
  }), 900);
}
function lose(i) {
  over = true; clearInterval(timerId); BG.stop();
  document.getElementById('face').textContent = '😵';
  el(i).classList.add('open', 'boom'); el(i).classList.add('mine');
  SFX.play('explode'); FX.shake && document.body.animate([{ transform: 'translate(4px,0)' }, { transform: 'translate(-4px,0)' }, { transform: 'none' }], { duration: 250 });
  // cadena de explosiones por distancia
  const x0 = i % W, y0 = (i / W) | 0;
  [...mines].filter(j => j !== i).sort((a, b) => Math.hypot(a % W - x0, ((a / W) | 0) - y0) - Math.hypot(b % W - x0, ((b / W) | 0) - y0)).forEach((j, k) => {
    setTimeout(() => { if (!cells[j].flag) { el(j).classList.add('open', 'mine'); if (k % 6 === 0) SFX.play('hit'); } }, 60 + k * 35);
  });
  cells.forEach((c, j) => { if (c.flag && !c.mine) { el(j).classList.remove('flag'); el(j).classList.add('wrong'); } });
  const pct = Math.round(opened / (W * Hh - L.m) * 100);
  setTimeout(() => BG.ui.gameOver({
    title: '¡BOOM!', icon: '💥', sub: `Despejaste el ${pct}% del tablero.`,
    stats: [{ label: 'Tiempo', value: U.fmtTime((performance.now() - t0) / 1000) }, { label: 'Dificultad', value: L.name }],
    onRetry: () => setup(), onMenu: showMenu,
  }), 1200 + Math.min(mines.size * 35, 1500));
}
function confetti() {
  const r = boardEl.getBoundingClientRect();
  for (let k = 0; k < 40; k++) {
    const s = document.createElement('div');
    s.textContent = U.pick(['✦', '★', '●', '▲']);
    s.style.cssText = `position:fixed;left:${r.left + r.width / 2}px;top:${r.top + r.height / 2}px;color:${U.pick(['#00e5ff', '#c04dff', '#39ff88', '#ffe066', '#ff3d6e'])};font-size:${U.randInt(10, 20)}px;pointer-events:none;z-index:40`;
    document.body.appendChild(s);
    const a = U.rand(Math.PI * 2), d = U.rand(80, 260);
    s.animate([{ transform: 'translate(0,0) rotate(0)', opacity: 1 }, { transform: `translate(${Math.cos(a) * d}px,${Math.sin(a) * d + 120}px) rotate(${U.rand(-360, 360)}deg)`, opacity: 0 }], { duration: 1400, easing: 'cubic-bezier(.2,.8,.3,1)' });
    setTimeout(() => s.remove(), 1400);
  }
}
function showMenu() {
  BG.ui.show({
    icon: '💣', title: 'BUSCAMINAS', sub: BG.game.subtitle,
    buttons: Object.entries(LEVELS).map(([k, v]) => {
      const b = BG.getBest(k);
      return { label: v.name, small: `${v.w}×${v.h} · ${v.m} minas · ${b ? 'Récord ' + U.fmtTime(b) : 'sin récord'}`, primary: k === lvKey, onClick: () => { BG.ui.hide(); setup(k); } };
    }),
    help: BG.isTouch ? BG.game.helpTouch : BG.game.help,
    onBack: () => BG.ui.hide(),
  });
}

// ── Entrada: mouse y táctil ───────────────────────────────────────────────
let pressT = null, pressI = -1, longDone = false;
// Celda bajo el puntero (si cae en la separación entre casillas, se usa la más cercana)
function cellAt(e) {
  const c = e.target.closest && e.target.closest('.c');
  if (c) return +c.dataset.i;
  const first = boardEl.children[0]; if (!first) return -1;
  const r0 = first.getBoundingClientRect(), step = r0.width + 2;
  const x = Math.floor((e.clientX - r0.left + 1) / step), y = Math.floor((e.clientY - r0.top + 1) / step);
  return (x >= 0 && x < W && y >= 0 && y < Hh) ? idx(x, y) : -1;
}
boardEl.addEventListener('contextmenu', e => e.preventDefault());
boardEl.addEventListener('pointerdown', e => {
  const i = cellAt(e); if (i < 0 || over) return;
  document.getElementById('face').textContent = '😮';
  if (e.button === 2) { toggleFlag(i); return; }
  if (e.button === 1) { e.preventDefault(); chord(i); return; }
  pressI = i; longDone = false;
  if (e.pointerType !== 'mouse') pressT = setTimeout(() => { longDone = true; toggleFlag(i); }, 340);
});
boardEl.addEventListener('pointerup', e => {
  clearTimeout(pressT);
  if (!over) document.getElementById('face').textContent = '🙂';
  const i = cellAt(e); if (i < 0 || e.button !== 0) return;
  if (longDone || i !== pressI) return;
  if (cells[i].open) chord(i);
  else if (flagMode) toggleFlag(i);
  else reveal(i);
});
boardEl.addEventListener('pointerleave', () => clearTimeout(pressT));
boardEl.addEventListener('pointercancel', () => clearTimeout(pressT));
document.getElementById('face').onclick = () => { SFX.play('select'); setup(); };
document.getElementById('lvl').onclick = showMenu;
document.getElementById('flagmode').onclick = e => { flagMode = !flagMode; e.currentTarget.classList.toggle('on', flagMode); SFX.play('click'); };
let rz; new ResizeObserver(() => { clearTimeout(rz); rz = setTimeout(() => { if (!started && !over) setup(); }, 150); }).observe(BG.stage);

// ── Arranque ──────────────────────────────────────────────────────────────
if (BG.thumb) {
  lvKey = 'medio'; setup('medio');
  placeMines(idx(8, 8)); started = true;
  reveal(idx(8, 8)); [idx(1, 1), idx(14, 2), idx(3, 13)].forEach(j => { if (!cells[j].mine) reveal(j); });
  [...mines].slice(0, 6).forEach(j => toggleFlag(j));
  clearInterval(timerId);
} else BG.ready.then(() => setup());
</script>
</body>
</html>
