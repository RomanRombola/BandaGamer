<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>8-Bit Quest</title>
<link rel="stylesheet" href="kit/bg-kit.css">
</head>
<body>
<script src="kit/bg-kit.js"></script>
<script>
// ═══════════════════════════════════════════════════════════════════════════
//  8-BIT QUEST — BandaGamer (plataformas con scroll, estilo consola de 8 bits)
//  Corré, saltá y usá la espada a través de 6 niveles: Pradera, Colinas, Cueva,
//  Cielo, Castillo y la Torre final. Bloques "?" y ladrillos, monedas y gemas,
//  babosas, murciélagos, erizos (¡no se pisan!) y esqueletos arqueros,
//  plataformas móviles, checkpoints y bandera al final de cada nivel.
//  Idea basada en "8-Bit Quest" de 90s-games (MIT © 2026 Prateek): aquel era una
//  sola pantalla fija; este es un juego nuevo con niveles, cámara y física.
// ═══════════════════════════════════════════════════════════════════════════
const { util: U, draw: D, fx: FX, sfx: SFX } = BG;
const W = 800, H = 450, VW = 400, VH = 225, T = 16, ROWS = 14;
const RUN = 118, ACC = 760, DEC = 950, AIR = .75, G = 1080, JUMP = -318, HOLD = .58, MAXFALL = 330;

BG.init({
  id: 'quest8', title: '8-BIT QUEST', icon: '⚔️', accent: '#ff3d6e', accent2: '#ffd400', music: true,
  post: { bloom: .25, vignette: .3, scan: .07, thumbFx: true },
  subtitle: 'Un plataformas como los de antes: 6 niveles, espada, bloques sorpresa, monedas y monstruos. Llegá a la bandera de cada nivel.',
  hud: [{ id: 'score', label: 'Puntos' }, { id: 'coins', label: 'Monedas', color: '#ffd400', value: '0' }, { id: 'lives', label: 'Vidas', color: '#ff3d6e', value: '×3' }],
  help: '<kbd>←</kbd><kbd>→</kbd> correr · <kbd>Espacio</kbd>/<kbd>↑</kbd> saltar (mantené = más alto) · <kbd>X</kbd> espada · <kbd>P</kbd> pausa',
  helpTouch: '◀ ▶ correr · ⤒ saltar · ⚔ espada',
  touch: { dpad: 'h', buttons: [{ action: 'action2', label: '⚔' }, { action: 'action', label: '⤒', wide: true }] },
  onRestart: () => start(curLevel), onMenu: () => showMenu(),
});
const view = BG.canvas(W, H);
const ctx = view.ctx;
const buf = document.createElement('canvas'); buf.width = VW; buf.height = VH;
const b = buf.getContext('2d'); b.imageSmoothingEnabled = false;

// ── Diseño de niveles por "bloques" (cada bloque se escribe de abajo hacia arriba) ──
// # tierra · X piedra · B ladrillo · ? bloque moneda · H bloque corazón · = plataforma
// ^ pinchos · o moneda · g gema · e babosa · b murciélago · h erizo · k esqueleto
// M plataforma móvil · C checkpoint · F bandera final · P inicio
const CH = {
  start: ['##############', '##############', ' P            '],
  flat: ['############', '############', '            ', '            ', '   oooooo   '],
  qbox: ['##############', '##############', '              ', '              ', '              ', '   ?B?B?      ', '              ', '              ', '     o o      '],
  qboxH: ['################', '################', '        e       ', '              ', '              ', '   B?BHB?B      ', '              ', '              ', '    o   o       '],
  enemy1: ['############', '############', '       e    '],
  enemy2: ['################', '################', '    e     e     ', '                ', '                ', '     ooo        '],
  gap2: ['####  ####', '####  ####', '          ', '          ', '   oooo   '],
  gap3: ['####   ####', '####   ####', '           ', '           ', '           ', '    ooo    '],
  gap4: ['####    #####', '####    #####', '             ', '             ', '             ', '    oooo     '],
  steps: ['################', '################', '   XXXXXXXXXX   ', '    XXXXXXXX    ', '     XXXXXX     ', '      XXXX      ', '                ', '       oo       '],
  pillars: ['##################', '##################', '   XX    e  XX  e ', '   XX       XX    ', '            XX    ', '    o        o    '],
  spikes: ['##############', '##############', '    ^^    ^^^ ', '              ', '              ', '    oo    ooo '],
  spikes2: ['################', '################', '  ^^^  ^^^  ^^^ ', '                ', '       ===      ', '                ', '        g       '],
  platPit: ['####        ####', '####        ####', '                ', '     ===        ', '          ===   ', '                ', '      o    o    '],
  platPit2: ['###          ###', '###          ###', '                ', '    ===         ', '         ===    ', '   o            ', '          o     '],
  moving: ['###          ####', '###          ####', '                 ', '    M            ', '                 ', '        ooo      '],
  moving2: ['###            ###', '###            ###', '                  ', '   M              ', '           M      ', '                  ', '   oo        oo   '],
  hedgehog: ['##############', '##############', '      h       ', '              ', '              ', '   ?     ?    '],
  hedgehog2: ['################', '################', '   h      h     ', '      XX        ', '      XX        ', '                ', '       g        '],
  bats: ['################', '################', '                ', '                ', '     b      b   ', '                ', '   o  o  o  o   '],
  bats2: ['##################', '##################', '    e             ', '                  ', '        b         ', '   B?B        b   ', '                  '],
  archer: ['################', '################', '        XXXXXXXX', '        XXXXXXXX', '            k   ', '                ', '   oo           '],
  archer2: ['################', '################', '                ', '   ==    XXXX   ', '         XXXX   ', '          k     ', '   g            '],
  check: ['######', '######', '   C  '],
  finish: ['################', '################', '        F       '],
};
const LEVELS = [
  { name: 'PRADERA', theme: 'meadow', time: 220, seq: ['start', 'flat', 'qbox', 'enemy1', 'gap2', 'steps', 'enemy2', 'check', 'qboxH', 'gap3', 'pillars', 'flat', 'finish'] },
  { name: 'COLINAS', theme: 'hills', time: 240, seq: ['start', 'enemy2', 'gap3', 'spikes', 'platPit', 'check', 'hedgehog', 'steps', 'qboxH', 'gap4', 'pillars', 'enemy2', 'finish'] },
  { name: 'CUEVA DE CRISTAL', theme: 'cave', time: 240, ceil: 2, seq: ['start', 'bats', 'qbox', 'gap3', 'spikes', 'bats2', 'check', 'platPit', 'hedgehog2', 'steps', 'bats', 'finish'] },
  { name: 'REINO DEL CIELO', theme: 'sky', time: 240, seq: ['start', 'platPit', 'moving', 'gap4', 'platPit2', 'check', 'moving2', 'qboxH', 'platPit', 'bats', 'gap4', 'finish'] },
  { name: 'CASTILLO', theme: 'castle', time: 260, ceil: 1, seq: ['start', 'archer', 'spikes', 'gap3', 'hedgehog', 'check', 'moving', 'archer2', 'pillars', 'spikes2', 'finish'] },
  { name: 'TORRE FINAL', theme: 'castle', time: 280, ceil: 1, seq: ['start', 'archer', 'moving', 'bats2', 'platPit2', 'check', 'spikes2', 'archer2', 'moving2', 'hedgehog2', 'gap4', 'qboxH', 'finish'] },
];
const THEMES = {
  meadow: { sky: ['#5ab4ff', '#c8ecff'], hill: ['#6acb5a', '#4aa84a'], top: '#5cc94a', dirt: '#a8683a', dirt2: '#8a5028', stone: '#9aa0b0', bg: 'hills' },
  hills: { sky: ['#ff9a6a', '#ffe0a0'], hill: ['#c87a5a', '#a85a4a'], top: '#e8b84a', dirt: '#b8784a', dirt2: '#986038', stone: '#b0a090', bg: 'hills' },
  cave: { sky: ['#140a2a', '#2a1450'], hill: ['#2a1a4a', '#1e1238'], top: '#7a5ab8', dirt: '#3a2a5a', dirt2: '#2c1e48', stone: '#5a4a7a', bg: 'cave' },
  sky: { sky: ['#4a9aff', '#e0f4ff'], hill: ['#ffffff', '#e8f0ff'], top: '#ffffff', dirt: '#c8d8f0', dirt2: '#b0c4e4', stone: '#d0d8e8', bg: 'clouds' },
  castle: { sky: ['#1a1030', '#4a2040'], hill: ['#2a2038', '#201830'], top: '#8a8a9a', dirt: '#5a5a6a', dirt2: '#4a4a58', stone: '#7a7a8a', bg: 'castle' },
};
function buildLevel(i) {
  const L = LEVELS[i], cols = [];
  for (const name of L.seq) {
    const chunk = CH[name], w = Math.max(...chunk.map(r => r.length));
    for (let x = 0; x < w; x++) { const col = Array(ROWS).fill(' '); chunk.forEach((row, k) => { col[ROWS - 1 - k] = row[x] || ' '; }); cols.push(col); }
  }
  const grid = Array.from({ length: ROWS }, (_, y) => cols.map(c => c[y]));
  if (L.ceil) for (let y = 0; y < L.ceil; y++) for (let x = 0; x < cols.length; x++) grid[y][x] = 'X';
  return grid;
}

// ── Tiles pre-dibujados por tema ──────────────────────────────────────────
const tileCache = {};
function tiles(th) {
  if (tileCache[th]) return tileCache[th];
  const P = THEMES[th], mk = fn => { const c = document.createElement('canvas'); c.width = c.height = T; const g = c.getContext('2d'); fn(g); return c; };
  const px = (g, x, y, w, h, c) => { g.fillStyle = c; g.fillRect(x, y, w, h); };
  const dirt = g => { px(g, 0, 0, T, T, P.dirt); for (let i = 0; i < 7; i++) px(g, (i * 7 + 3) % 15, (i * 11 + 5) % 15, 2, 2, P.dirt2); };
  return tileCache[th] = {
    top: mk(g => { dirt(g); px(g, 0, 0, T, 5, P.top); for (let x = 0; x < T; x += 3) px(g, x, 5, 2, (x % 2) + 1, P.top); px(g, 0, 0, T, 1, 'rgba(255,255,255,.35)'); }),
    dirt: mk(dirt),
    stone: mk(g => { px(g, 0, 0, T, T, P.stone); px(g, 0, 0, T, 2, 'rgba(255,255,255,.3)'); px(g, 0, T - 2, T, 2, 'rgba(0,0,0,.3)'); px(g, 0, 0, 2, T, 'rgba(255,255,255,.15)'); px(g, T - 2, 0, 2, T, 'rgba(0,0,0,.2)'); px(g, 5, 5, 3, 2, 'rgba(0,0,0,.15)'); }),
    brick: mk(g => { px(g, 0, 0, T, T, '#c8582a'); px(g, 0, 0, T, 1, '#ffa070'); for (let r = 0; r < 4; r++) { px(g, 0, r * 4 + 3, T, 1, '#5a2010'); const o = r % 2 ? 0 : 8; px(g, o, r * 4, 1, 3, '#5a2010'); px(g, (o + 8) % 16, r * 4, 1, 3, '#5a2010'); } }),
    q: mk(g => { px(g, 0, 0, T, T, '#ffb000'); px(g, 1, 1, T - 2, T - 2, '#ffd400'); px(g, 0, T - 1, T, 1, '#8a5a00'); px(g, T - 1, 0, 1, T, '#8a5a00'); for (const [x, y] of [[1, 1], [14, 1], [1, 14], [14, 14]]) px(g, x, y, 1, 1, '#8a5a00'); px(g, 6, 3, 4, 2, '#8a3a00'); px(g, 9, 5, 2, 2, '#8a3a00'); px(g, 7, 7, 2, 2, '#8a3a00'); px(g, 7, 11, 2, 2, '#8a3a00'); }),
    used: mk(g => { px(g, 0, 0, T, T, '#8a5a3a'); px(g, 1, 1, T - 2, T - 2, '#a8704a'); for (const [x, y] of [[2, 2], [13, 2], [2, 13], [13, 13]]) px(g, x, y, 1, 1, '#5a3a20'); }),
    plat: mk(g => { px(g, 0, 0, T, 5, '#b8783a'); px(g, 0, 0, T, 1, '#ffc080'); px(g, 0, 4, T, 1, '#6a4020'); px(g, 3, 5, 2, 3, '#6a4020'); px(g, 11, 5, 2, 3, '#6a4020'); }),
    spike: mk(g => { for (let k = 0; k < 4; k++) { g.fillStyle = '#d8dce8'; g.beginPath(); g.moveTo(k * 4, T); g.lineTo(k * 4 + 2, T - 9); g.lineTo(k * 4 + 4, T); g.fill(); g.fillStyle = '#8a90a0'; g.fillRect(k * 4 + 2, T - 7, 1, 7); } }),
  };
}

// ── Estado ────────────────────────────────────────────────────────────────
let grid = [], cols = 0, theme = THEMES.meadow, tl = null, pl = null, ents = [], items = [], plats = [], arrows = [], bumps = [], deco = [];
let state = 'menu', t = 0, curLevel = 0, score = 0, coins = 0, lives = 3, timeLeft = 0, camX = 0, checkpoint = null, levelT = 0, combo = 0, prog = BG.load('prog', { unlocked: 1 }), runStart = 0;
const solidCh = c => c === '#' || c === 'X' || c === 'B' || c === '?' || c === 'H' || c === 'u';
const tileAt = (x, y) => (y < 0 ? (LEVELS[curLevel].ceil ? 'X' : ' ') : y >= ROWS || x < 0 || x >= cols ? ' ' : grid[y][x]);
const solid = (x, y) => (x < 0 || x >= cols) ? true : solidCh(tileAt(x, y));

function loadLevel(i, keepCheckpoint) {
  curLevel = i; const L = LEVELS[i];
  grid = buildLevel(i); cols = grid[0].length; theme = THEMES[L.theme]; tl = tiles(L.theme);
  ents = []; items = []; plats = []; arrows = []; bumps = [];
  let sx = 2, sy = 11;
  for (let y = 0; y < ROWS; y++) for (let x = 0; x < cols; x++) {
    const c = grid[y][x], cx = x * T + T / 2, by = (y + 1) * T;
    if (c === 'P') { sx = x; sy = y; grid[y][x] = ' '; }
    else if (c === 'o' || c === 'g') { items.push({ k: c === 'o' ? 'coin' : 'gem', x: cx, y: by - 3, ph: x * .3 }); grid[y][x] = ' '; }
    else if ('ebhk'.includes(c)) { ents.push(makeEnemy(c, cx, by)); grid[y][x] = ' '; }
    else if (c === 'M') { plats.push({ x: x * T, y: y * T, w: T * 3, x0: x * T, range: T * 3.2, vx: plats.length % 2 ? -34 : 34 , dx: 0 }); grid[y][x] = ' '; }
    else if (c === 'C' || c === 'F') { items.push({ k: c === 'C' ? 'check' : 'flag', x: cx, y: by, on: false }); grid[y][x] = ' '; }
  }
  plats.sort((p, q) => p.x - q.x).forEach((p, k) => { p.vx = k % 2 ? -34 : 34; });   // vecinas en sentidos opuestos: se acercan entre sí
  const start = keepCheckpoint && checkpoint && checkpoint.level === i ? checkpoint : { x: sx * T + T / 2, y: (sy + 1) * T };
  if (keepCheckpoint && checkpoint && checkpoint.level === i) for (const it of items) if (it.k === 'check' && it.x <= checkpoint.x + 1) it.on = true;
  pl = { x: start.x, y: start.y, vx: 0, vy: 0, w: 10, h: 14, face: 1, ground: false, coyote: 0, buffer: 0, hearts: 3, inv: 0, atk: 0, atkCD: 0, run: 0, dead: false, ride: null, win: 0 };
  timeLeft = L.time; camX = U.clamp(pl.x - VW / 2, 0, cols * T - VW); levelT = 0; combo = 0;
  state = 'intro'; FX.clear();
}
function makeEnemy(k, x, y) {
  const base = { k, x, y, vx: 0, vy: 0, dir: -1, alive: true, t: Math.random() * 6, ground: false };
  if (k === 'e') return Object.assign(base, { w: 12, h: 9, sp: 26, stomp: true, pts: 100 });
  if (k === 'h') return Object.assign(base, { w: 12, h: 10, sp: 20, stomp: false, pts: 200 });
  if (k === 'b') return Object.assign(base, { w: 12, h: 8, sp: 40, stomp: true, pts: 150, fly: true, y0: y - 8 });
  return Object.assign(base, { w: 10, h: 15, sp: 0, stomp: true, pts: 300, shoot: 1.5 });   // k: esqueleto arquero
}
function start(i = 0) {
  score = 0; coins = 0; lives = 3; checkpoint = null; runStart = i;
  BG.hud.setAll({ score: 0, coins: 0 }); updLives(); loadLevel(i); BG.start(); BG.music.play(SONG);
}
function showMenu() {
  state = 'menu'; BG.stop(); BG.music.stop();
  if (!grid.length) { loadLevel(0); state = 'menu'; }
  const btns = LEVELS.map((L, i) => ({ label: i < prog.unlocked ? `${i + 1}. ${L.name}` : `🔒 NIVEL ${i + 1}`, small: i === 0 ? 'empezá acá' : '', primary: i === 0, onClick: () => { if (i < prog.unlocked) start(i); } }));
  BG.ui.show({ icon: '⚔️', title: '8-BIT QUEST', sub: BG.game.subtitle, stats: BG.getBest() != null ? [{ label: 'Récord', value: U.fmt(BG.getBest()) }] : null, buttons: btns.slice(0, Math.min(btns.length, Math.max(2, prog.unlocked + 1))), help: BG.isTouch ? BG.game.helpTouch : BG.game.help });
}
function updLives() { BG.hud.set('lives', '×' + Math.max(0, lives)); }
function addScore(n, x, y, txt) { score += n; BG.hud.set('score', score, true); if (x != null) FX.text(x, y, txt || String(n), { color: '#fff', size: 7, life: .7, vy: -30 }); }
function addCoin(x, y) { coins++; BG.hud.set('coins', coins, true); addScore(10); SFX.play('coin'); if (coins % 100 === 0) { lives++; updLives(); BG.ui.toast('¡VIDA EXTRA! (100 monedas)', '#39ff88'); SFX.play('power'); } if (x != null) FX.burst(x, y, { n: 6, color: ['#ffd400', '#fff'], speed: 60, life: .3, size: 2 }); }

// ── Física con la grilla (primero X, después Y) ───────────────────────────
function moveX(e, dx) {
  e.x += dx;
  const top = Math.floor((e.y - e.h) / T), bot = Math.floor((e.y - .01) / T);
  if (dx > 0) { const c = Math.floor((e.x + e.w / 2 - .01) / T); for (let y = top; y <= bot; y++) if (solid(c, y)) { e.x = c * T - e.w / 2; return true; } }
  else if (dx < 0) { const c = Math.floor((e.x - e.w / 2) / T); for (let y = top; y <= bot; y++) if (solid(c, y)) { e.x = (c + 1) * T + e.w / 2; return true; } }
  return false;
}
function moveY(e, dy, isPlayer) {
  const prevBot = e.y; e.y += dy; e.ground = false;
  const l = Math.floor((e.x - e.w / 2 + .5) / T), r = Math.floor((e.x + e.w / 2 - .5) / T);
  if (dy > 0) {
    const row = Math.floor(e.y / T);
    for (let x = l; x <= r; x++) { const c = tileAt(x, row); if (solidCh(c) || (c === '=' && prevBot <= row * T + .01)) { e.y = row * T; e.vy = 0; e.ground = true; return; } }
    if (isPlayer || !e.fly) for (const p of plats) if (prevBot <= p.y + .5 && e.y >= p.y && e.x + e.w / 2 > p.x && e.x - e.w / 2 < p.x + p.w) { e.y = p.y; e.vy = 0; e.ground = true; e.ride = p; return; }
  } else if (dy < 0) {
    const row = Math.floor((e.y - e.h) / T);
    for (let x = l; x <= r; x++) if (solid(x, row) && row >= 0) {
      e.y = (row + 1) * T + e.h; e.vy = 0;
      if (isPlayer) { const hx = Math.floor(e.x / T); hitBlock(solid(hx, row) ? hx : x, row); }
      return;
    }
  }
}
function hitBlock(x, y) {
  const c = tileAt(x, y), cx = x * T + T / 2, cy = y * T;
  if (c === '?' || c === 'H') {
    grid[y][x] = 'u'; bumps.push({ x, y, t: 0 }); SFX.play('blip');
    if (c === '?') { addCoin(cx, cy - 6); items.push({ k: 'popcoin', x: cx, y: cy, vy: -150, t: 0 }); }
    else { items.push({ k: 'heart', x: cx, y: cy, vy: -90, rise: 1 }); SFX.play('power'); }
  } else if (c === 'B') { breakBrick(x, y); }
  else { bumps.push({ x, y, t: 0 }); SFX.tone({ f: 160, dur: .05, type: 'square', vol: .08 }); }
  // enemigos parados arriba del bloque golpeado
  for (const e of ents) if (e.alive && Math.abs(e.x - cx) < 12 && Math.abs(e.y - cy) < 3) killEnemy(e, 'bump');
}
function breakBrick(x, y) {
  grid[y][x] = ' '; addScore(50); SFX.play('explode');
  for (let i = 0; i < 4; i++) FX.burst(x * T + 4 + (i % 2) * 8, y * T + 4 + (i > 1 ? 8 : 0), { n: 2, color: ['#c8582a', '#ffa070'], speed: 120, gravity: 500, life: .6, size: 3, glow: false });
}
function killEnemy(e, how) {
  if (!e.alive) return;
  e.alive = false; e.deadT = 0; e.how = how;
  combo = how === 'stomp' ? combo + 1 : combo;
  const pts = e.pts * Math.max(1, how === 'stomp' ? combo : 1);
  addScore(pts, e.x, e.y - e.h - 4, String(pts));
  SFX.play(how === 'sword' ? 'hit' : 'pop'); FX.burst(e.x, e.y - e.h / 2, { n: 10, color: e.k === 'e' ? ['#5cff7a', '#fff'] : e.k === 'b' ? ['#a855f7', '#fff'] : e.k === 'h' ? ['#a87040', '#fff'] : ['#eeeeee', '#888'], speed: 90, life: .4, size: 2 });
}
function hurt(srcX) {
  if (pl.inv > 0 || pl.dead || pl.win) return;
  pl.hearts--; pl.inv = 1.4; pl.vx = (pl.x < srcX ? -1 : 1) * 140; pl.vy = -180;
  SFX.play('hurt'); FX.shake(4, .25); FX.flash('#ff3d6e', .2);
  if (pl.hearts <= 0) die();
}
function die() {
  if (pl.dead) return;
  pl.dead = true; pl.deadT = 0; pl.vy = -260; lives--; updLives(); SFX.play('lose'); BG.music.stop();
}

// ── Actualización ─────────────────────────────────────────────────────────
function update(dt) {
  t += dt;
  for (const k of bumps) k.t += dt; bumps = bumps.filter(k => k.t < .2);
  if (state === 'menu' || state === 'over') return;
  if (state === 'intro') { levelT += dt; if (levelT > 1.6) { state = 'play'; levelT = 0; if (!BG.music.playing) BG.music.play(SONG); } return; }
  if (state === 'clear') { levelT += dt; winAnim(dt); return; }
  const I = BG.input;
  // muerte
  if (pl.dead) {
    pl.deadT += dt; pl.vy = Math.min(MAXFALL * 1.5, pl.vy + G * dt); pl.y += pl.vy * dt;
    if (pl.deadT > 1.8) { if (lives <= 0) return over(false); loadLevel(curLevel, true); }
    return;
  }
  levelT += dt; timeLeft -= dt;
  if (timeLeft <= 0) { timeLeft = 0; pl.hearts = 0; die(); return; }
  if (timeLeft < 30 && Math.floor(timeLeft) !== Math.floor(timeLeft + dt)) SFX.play('tick');
  // plataformas móviles
  for (const p of plats) { const ox = p.x; p.x += p.vx * dt; if (Math.abs(p.x - p.x0) > p.range) { p.x = p.x0 + Math.sign(p.x - p.x0) * p.range; p.vx *= -1; } p.dx = p.x - ox; }
  // jugador
  const ax = I.axisX();
  const jp = I.pressed('action'), up = I.pressed('up'), held = I.isDown('action') || I.isDown('up');

}
