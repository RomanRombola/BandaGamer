<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Torre Apilable</title>
<link rel="stylesheet" href="kit/bg-kit.css">
</head>
<body>
<script src="kit/bg-kit.js"></script>
<script>
// ═══════════════════════════════════════════════════════════════════════════
//  TORRE APILABLE — BandaGamer (juego original)
//  Los bloques se deslizan; tocá para soltarlos. Lo que sobresale se corta y cae.
//  Soltalo justo encima (PERFECTO) para no perder tamaño; 3 perfectos seguidos
//  hacen crecer el bloque. ¿Qué tan alto llegás?
// ═══════════════════════════════════════════════════════════════════════════
const { util: U, draw: D, fx: FX, sfx: SFX } = BG;
const W = 420, H = 680, S = 52, BH = 15, BASE = 3.2, PERFECT = .1;
BG.init({
  post: { bloom: .35, vignette: .3, thumbFx: true },
  id: 'stack', title: 'TORRE APILABLE', icon: '🏗️', accent: '#ff9a1f', accent2: '#c04dff',
  subtitle: 'Tocá para soltar cada bloque justo encima del anterior. Un toque, infinitos pisos.',
  hud: [{ id: 'score', label: 'Pisos' }, { id: 'combo', label: 'Perfectos', color: '#ffd400' }, { id: 'best', label: 'Récord', color: '#2ef2ff' }],
  help: '<kbd>Espacio</kbd>, clic o toque para soltar el bloque',
  onRestart: () => start(), onMenu: () => showMenu(),
});
const view = BG.canvas(W, H);
const ctx = view.ctx;
let stack, cur, debris = [], camY = 0, score = 0, combo = 0, state = 'menu', t = 0, hueBase = U.rand(360), dir = 1;
const hue = i => (hueBase + i * 6) % 360;
function iso(x, y, z) { return { x: W / 2 + (x - z) * S * .866, y: H * .62 + (x + z) * S * .5 - y * BH - camY }; }
function drawBox(b, alpha = 1) {
  const { x, z, w, d, y } = b, h = 1;
  const p = (dx, dy, dz) => iso(x + dx, y + dy, z + dz);
  const top = [p(-w / 2, h, -d / 2), p(w / 2, h, -d / 2), p(w / 2, h, d / 2), p(-w / 2, h, d / 2)];
  const right = [p(w / 2, h, -d / 2), p(w / 2, h, d / 2), p(w / 2, 0, d / 2), p(w / 2, 0, -d / 2)];
  const left = [p(-w / 2, h, d / 2), p(w / 2, h, d / 2), p(w / 2, 0, d / 2), p(-w / 2, 0, d / 2)];
  const hh = b.hue;
  ctx.globalAlpha = alpha;
  const poly = (pts, c) => { ctx.fillStyle = c; ctx.beginPath(); pts.forEach((q, i) => i ? ctx.lineTo(q.x, q.y) : ctx.moveTo(q.x, q.y)); ctx.closePath(); ctx.fill(); };
  poly(right, `hsl(${hh},70%,42%)`); poly(left, `hsl(${hh},70%,32%)`); poly(top, `hsl(${hh},80%,${b.flash ? 80 : 58}%)`);
  ctx.globalAlpha = 1;
}
function newMoving() {
  const top = stack[stack.length - 1];
  dir = stack.length % 2 ? 'x' : 'z';
  const b = { x: top.x, z: top.z, w: top.w, d: top.d, y: top.y + 1, hue: hue(stack.length), t: 0 };
  if (dir === 'x') b.x = -BASE * 1.6; else b.z = -BASE * 1.6;
  b.speed = Math.min(5.5, 2.4 + stack.length * .06);
  cur = b;
}
function start() {
  hueBase = U.rand(360); stack = [{ x: 0, z: 0, w: BASE, d: BASE, y: 0, hue: hue(0) }]; debris = []; camY = 0; score = 0; combo = 0;
  BG.hud.setAll({ score: 0, combo: 0, best: BG.getBest() || 0 }); newMoving(); FX.clear(); state = 'play'; BG.start();
}
function showMenu() { state = 'menu'; BG.stop(); if (!stack) { stack = [{ x: 0, z: 0, w: BASE, d: BASE, y: 0, hue: hue(0) }]; for (let i = 1; i < 8; i++) stack.push({ x: 0, z: 0, w: BASE, d: BASE, y: i, hue: hue(i) }); debris = []; camY = 0; } BG.ui.menu({ buttons: [{ label: '▶ JUGAR', primary: true, onClick: start }] }); }
function drop() {
  if (state !== 'play' || !cur || BG.paused || BG.ui.open) return;
  const top = stack[stack.length - 1], axis = dir, sz = axis === 'x' ? 'w' : 'd';
  const delta = cur[axis] - top[axis];
  if (Math.abs(delta) < PERFECT) {
    cur[axis] = top[axis]; combo++;
    SFX.tone({ f: 440 * Math.pow(2, Math.min(combo, 12) / 12), dur: .18, type: 'triangle', vol: .25 });
    const p = iso(cur.x, cur.y + 1, cur.z); FX.ring(p.x, p.y, { color: '#fff', max: 90, life: .5 });
    if (combo >= 3) { cur.w = Math.min(BASE, cur.w + .12); cur.d = Math.min(BASE, cur.d + .12); }   // premio: crece
    if (combo >= 3) BG.ui.toast(`¡PERFECTO ×${combo}!`, '#ffd400');
  } else {
    const overlap = top[sz] - Math.abs(delta);
    if (overlap <= 0) { // se cayó entero
      debris.push({ ...cur, vy: 0, vr: U.rand(-2, 2), rot: 0 }); cur = null; over(); return;
    }
    combo = 0;
    // pedazo que sobresale → cae
    const cut = { ...cur }; cut[sz] = Math.abs(delta);
    cut[axis] = top[axis] + delta / 2 + Math.sign(delta) * top[sz] / 2;
    debris.push({ ...cut, vy: 0 });
    cur[sz] = overlap; cur[axis] = top[axis] + delta / 2;
    SFX.tone({ f: 260, dur: .1, type: 'square', vol: .12 });
  }
  cur.flash = .12;
  stack.push(cur); score++;
  BG.hud.set('score', score, true); BG.hud.set('combo', combo);
  if (score % 10 === 0) { SFX.play('levelup'); }
  newMoving();
}
function over() {
  state = 'over'; BG.stop(); SFX.play('lose'); FX.shake(5, .3);
  const r = score > 0 ? BG.submitScore(score) : { isRecord: false };
  setTimeout(() => BG.ui.gameOver({ icon: '🏗️', title: '¡SE CAYÓ!', score, scoreLabel: 'PISOS', isRecord: r.isRecord || r.first, recordText: r.first ? '★ ¡PRIMER RÉCORD! ★' : null,
    stats: [{ label: 'Récord', value: BG.getBest() || score }], onRetry: start, onMenu: showMenu }), 900);
}
function update(dt) {
  t += dt;
  if (cur && state === 'play') {
    cur.t += dt * cur.speed;
    const pos = Math.sin(cur.t - Math.PI / 2) * BASE * 1.6;
    if (dir === 'x') cur.x = pos; else cur.z = pos;
  }
  stack && stack.forEach(b => { if (b.flash) b.flash = Math.max(0, b.flash - dt); });
  for (const d of debris) { d.vy -= 26 * dt; d.y += d.vy * dt; }
  debris = (debris || []).filter(d => d.y > (stack ? stack.length : 0) - 40);
  // la cámara sube con la torre
  const target = Math.min(0, -((stack ? stack.length : 0) - 6) * BH);
  camY = U.lerp(camY, target, Math.min(1, dt * 4));
}
function render() {
  const n = stack ? stack.length : 0, hh = hue(n);
  const g = ctx.createLinearGradient(0, 0, 0, H); g.addColorStop(0, `hsl(${hh},45%,18%)`); g.addColorStop(1, `hsl(${(hh + 40) % 360},55%,8%)`);
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  for (let i = 0; i < 30; i++) { ctx.fillStyle = `rgba(255,255,255,${.04 + (i % 3) * .03})`; ctx.fillRect((i * 83) % W, ((i * 131 + camY * .3) % H + H) % H, 2, 2); }
  if (!stack) return;
  ctx.save(); FX.applyShake(ctx);
  const from = Math.max(0, n - 26);
  for (let i = from; i < n; i++) drawBox(stack[i]);
  for (const d of debris) drawBox(d, .9);
  if (cur) drawBox(cur);
  FX.draw(ctx);
  ctx.restore();
  if (state === 'play' || state === 'over') D.text(ctx, String(score), W / 2, 90, { size: 56, color: '#fff', alpha: .9, stroke: 'rgba(0,0,0,.3)', strokeW: 6 });
}
BG.input.on('action', drop).on('up', drop);
view.canvas.addEventListener('pointerdown', e => { e.preventDefault(); drop(); });
if (BG.thumb) { stack = []; hueBase = 200; for (let i = 0; i < 14; i++) stack.push({ x: Math.sin(i) * .2, z: Math.cos(i) * .2, w: BASE - i * .08, d: BASE - i * .06, y: i, hue: hue(i) }); cur = { ...stack[13], y: 14, x: 1.2, hue: hue(14) }; debris = [{ ...stack[13], y: 11, x: 2.4, w: .6, hue: hue(13) }]; score = 13; camY = -8 * BH; state = 'thumb'; update = () => {}; }
else BG.ready.then(showMenu);
BG.loop(dt => update(dt), render);
</script>
</body>
</html>
