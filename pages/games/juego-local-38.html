<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Whack-a-Mole</title>
<link rel="stylesheet" href="kit/bg-kit.css">
</head>
<body>
<script src="kit/bg-kit.js"></script>
<script>
// ═══════════════════════════════════════════════════════════════════════════
//  WHACK-A-MOLE — BandaGamer
//  60 segundos · topo común, dorado (rápido, +50), con casco (2 golpes),
//  bomba (−10 s) y reloj (+3 s) · combo multiplicador · martillo animado
//  Teclado: Q W E / A S D / Z X C o el teclado numérico
// ═══════════════════════════════════════════════════════════════════════════
const { util: U, draw: D, fx: FX, sfx: SFX } = BG;
const W = 600, H = 640, COLS = 3, ROWS = 3, GAME_T = 60;
const KEYS = [['KeyQ', 'Numpad7'], ['KeyW', 'Numpad8'], ['KeyE', 'Numpad9'], ['KeyA', 'Numpad4'], ['KeyS', 'Numpad5'], ['KeyD', 'Numpad6'], ['KeyZ', 'Numpad1'], ['KeyX', 'Numpad2'], ['KeyC', 'Numpad3']];
const KINDS = {
  mole: { pts: 10, up: 1.0 }, gold: { pts: 50, up: .55 }, helmet: { pts: 30, up: 1.3, hp: 2 }, bomb: { pts: 0, up: 1.2 }, clock: { pts: 0, up: .9 },
};
BG.init({
  id: 'whack', title: 'WHACK-A-MOLE', icon: '🔨', accent: '#ff9a1f', accent2: '#ffd400', pausable: true,
  subtitle: 'Golpeá todos los topos que puedas en 60 segundos. ¡No toques las bombas!',
  hud: [{ id: 'score', label: 'Puntos' }, { id: 'time', label: 'Tiempo', color: '#2ef2ff', value: '60' }, { id: 'combo', label: 'Combo', color: '#ff3dd0', value: '×1' }],
  help: 'Clic/toque sobre los topos · teclado: <kbd>Q</kbd><kbd>W</kbd><kbd>E</kbd> / <kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> / <kbd>Z</kbd><kbd>X</kbd><kbd>C</kbd>',
  onRestart: () => start(), onMenu: () => showMenu(),
});
const view = BG.canvas(W, H);
const ctx = view.ctx;

let holes, score, timeLeft, combo, maxCombo, hits, misses, spawnT, state = 'menu', hammer = null, t = 0, pointer = { x: W / 2, y: H / 2 };
function holePos(i) { const c = i % COLS, r = (i / COLS) | 0; return { x: 120 + c * 180, y: 200 + r * 160 }; }
function start() {
  holes = Array.from({ length: 9 }, (_, i) => ({ i, kind: null, h: 0, state: 'down', t: 0, hp: 0, hit: 0 }));
  score = 0; timeLeft = GAME_T; combo = 0; maxCombo = 0; hits = 0; misses = 0; spawnT = .6;
  BG.hud.setAll({ score: 0, time: GAME_T, combo: '×1' });
  FX.clear(); state = 'play'; BG.start(); SFX.play('go');
}
function showMenu() { state = 'menu'; BG.stop(); if (!holes) start(), BG.stop(), state = 'menu'; BG.ui.menu({ buttons: [{ label: '▶ JUGAR', primary: true, onClick: start }] }); }
const mult = () => 1 + Math.min(4, Math.floor(combo / 5));

function spawn() {
  const free = holes.filter(h => h.state === 'down');
  if (!free.length) return;
  const h = U.pick(free);
  const p = 1 - timeLeft / GAME_T;
  const r = Math.random();
  h.kind = r < .1 + p * .08 ? 'bomb' : r < .2 + p * .08 ? 'gold' : r < .32 + p * .1 ? 'helmet' : r < .36 ? 'clock' : 'mole';
  h.state = 'up'; h.t = KINDS[h.kind].up * (1.25 - p * .55); h.hp = KINDS[h.kind].hp || 1; h.hit = 0; h.whacked = false;
}
function whack(i) {
  if (state !== 'play' || BG.paused) return;
  const h = holes[i], p = holePos(i);
  hammer = { x: p.x + 30, y: p.y - 40, t: .18 };
  SFX.tone({ f: 120, dur: .06, type: 'square', vol: .1 });
  if (h.state !== 'up' && h.state !== 'rising' || h.h < .45) { combo = 0; misses++; BG.hud.set('combo', '×1'); return; }
  if (h.kind === 'bomb') {
    timeLeft = Math.max(0, timeLeft - 10); combo = 0; BG.hud.set('combo', '×1');
    SFX.play('explode'); FX.shake(10, .4); FX.flash('#ff3d6e', .4);
    FX.burst(p.x, p.y - 20, { n: 40, color: ['#ff3d6e', '#ffd400', '#555'], speed: 300, life: .7 }); FX.text(p.x, p.y - 60, '−10 s', { color: '#ff3d6e', size: 24 });
    h.state = 'falling'; return;
  }
  if (h.kind === 'clock') {
    timeLeft += 3; SFX.play('coin'); FX.text(p.x, p.y - 60, '+3 s', { color: '#2ef2ff', size: 22 });
    FX.burst(p.x, p.y - 20, { n: 16, color: ['#2ef2ff', '#fff'], speed: 160 }); h.state = 'falling'; return;
  }
  h.hp--; h.hit = .15;
  if (h.hp > 0) { SFX.play('hit'); FX.burst(p.x, p.y - 40, { n: 8, color: ['#ccc', '#fff'], speed: 140, life: .3 }); FX.text(p.x, p.y - 70, '¡CLANG!', { color: '#ccc', size: 14 }); return; }
  combo++; hits++; maxCombo = Math.max(maxCombo, combo); h.whacked = true;
  const pts = KINDS[h.kind].pts * mult();
  score += pts; BG.hud.set('score', score, true); BG.hud.set('combo', '×' + mult());
  SFX.play(h.kind === 'gold' ? 'coin' : 'pop'); if (combo % 5 === 0) SFX.play('combo', combo / 5);
  FX.burst(p.x, p.y - 30, { n: h.kind === 'gold' ? 26 : 14, color: h.kind === 'gold' ? ['#ffd400', '#fff'] : ['#ffd400', '#ff9a1f', '#fff'], speed: 200, life: .5, shape: 'square' });
  FX.text(p.x, p.y - 70, '+' + pts, { color: h.kind === 'gold' ? '#ffd400' : '#fff', size: 18 + Math.min(10, mult() * 2) });
  h.state = 'falling';
}
function end() {
  state = 'over'; BG.stop(); SFX.play('win');
  const r = BG.submitScore(score);
  const acc = hits + misses ? Math.round(hits / (hits + misses) * 100) : 0;
  setTimeout(() => BG.ui.gameOver({ icon: '🔨', title: '¡TIEMPO!', tone: 'good', score, isRecord: r.isRecord || r.first, recordText: r.first ? '★ ¡PRIMER RÉCORD! ★' : null,
    stats: [{ label: 'Récord', value: U.fmt(BG.getBest() || score) }, { label: 'Topos', value: hits }, { label: 'Puntería', value: acc + '%' }, { label: 'Combo máx', value: maxCombo }],
    onRetry: start, onMenu: showMenu }), 600);
}
function update(dt) {
  t += dt;
  if (hammer) { hammer.t -= dt; if (hammer.t <= 0) hammer = null; }
  if (state !== 'play') return;
  timeLeft -= dt; BG.hud.set('time', Math.ceil(timeLeft));
  if (timeLeft <= 5 && Math.floor(timeLeft * 2) !== Math.floor((timeLeft + dt) * 2)) SFX.play('tick');
  if (timeLeft <= 0) { timeLeft = 0; end(); return; }
  spawnT -= dt;
  const p = 1 - timeLeft / GAME_T;
  if (spawnT <= 0) { spawn(); if (p > .4 && U.chance(.35)) spawn(); spawnT = U.rand(.35, .8) * (1 - p * .5); }
  for (const h of holes) {
    h.hit = Math.max(0, h.hit - dt);
    if (h.state === 'up') { h.h = Math.min(1, h.h + dt * 8); h.t -= dt; if (h.t <= 0) { if (h.kind !== 'bomb' && h.kind !== 'clock') { combo = 0; BG.hud.set('combo', '×1'); } h.state = 'falling'; } }
    else if (h.state === 'falling') { h.h = Math.max(0, h.h - dt * 7); if (h.h <= 0) { h.state = 'down'; h.kind = null; } }
  }
}
function drawMole(h, x, y) {
  const k = h.kind, rise = U.ease.outBack(h.h), yy = y + 30 - rise * 70;
  ctx.save();
  ctx.beginPath(); ctx.rect(x - 70, y - 130, 140, 136); ctx.clip();
  const sq = h.hit > 0 ? .85 : 1;
  ctx.translate(x, yy); ctx.scale(1 / sq, sq);
  if (k === 'bomb') {
    D.glowCircle(ctx, 0, 0, 32, '#2a2a3a', 10);
    ctx.fillStyle = '#4a4a5e'; ctx.beginPath(); ctx.arc(-10, -10, 9, 0, 7); ctx.fill();
    ctx.strokeStyle = '#c8a060'; ctx.lineWidth = 4; ctx.beginPath(); ctx.moveTo(10, -26); ctx.quadraticCurveTo(20, -42, 30, -38); ctx.stroke();
    if (Math.sin(t * 30) > 0) D.glowCircle(ctx, 31, -39, 5, '#ffd400', 16);
    D.text(ctx, '💀', 0, 4, { size: 26, family: 'body' });
  } else if (k === 'clock') {
    D.glowCircle(ctx, 0, 0, 30, '#2ef2ff', 18); ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(0, 0, 24, 0, 7); ctx.fill();
    ctx.strokeStyle = '#111'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(0, -16); ctx.moveTo(0, 0); ctx.lineTo(Math.cos(t * 6) * 12, Math.sin(t * 6) * 12); ctx.stroke();
  } else {
    const body = k === 'gold' ? '#ffcf3a' : '#8a5a3c', belly = k === 'gold' ? '#fff3b0' : '#c99a72';
    if (k === 'gold') { ctx.shadowColor = '#ffd400'; ctx.shadowBlur = 24; }
    ctx.fillStyle = body; ctx.beginPath(); ctx.ellipse(0, 10, 40, 48, 0, 0, 7); ctx.fill(); ctx.shadowBlur = 0;
    ctx.fillStyle = belly; ctx.beginPath(); ctx.ellipse(0, 26, 24, 26, 0, 0, 7); ctx.fill();
    const hurt = h.whacked;
    if (hurt) { ctx.strokeStyle = '#111'; ctx.lineWidth = 3; for (const ex of [-14, 14]) { ctx.beginPath(); ctx.moveTo(ex - 5, -12); ctx.lineTo(ex + 5, -2); ctx.moveTo(ex + 5, -12); ctx.lineTo(ex - 5, -2); ctx.stroke(); } }
    else { ctx.fillStyle = '#111'; for (const ex of [-14, 14]) { ctx.beginPath(); ctx.arc(ex, -6, 5, 0, 7); ctx.fill(); } ctx.fillStyle = '#fff'; for (const ex of [-12, 16]) { ctx.beginPath(); ctx.arc(ex, -8, 1.6, 0, 7); ctx.fill(); } }
    ctx.fillStyle = '#ff7a9a'; ctx.beginPath(); ctx.ellipse(0, 6, 9, 6, 0, 0, 7); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.fillRect(-6, 12, 5, 7); ctx.fillRect(1, 12, 5, 7);
    if (k === 'helmet' && h.hp > 1) {
      ctx.fillStyle = '#9aa3b8'; ctx.beginPath(); ctx.arc(0, -16, 38, Math.PI, 0); ctx.fill();
      ctx.fillStyle = '#c9d0e0'; ctx.fillRect(-42, -18, 84, 8);
      ctx.fillStyle = '#ffd400'; ctx.beginPath(); ctx.arc(0, -40, 6, 0, 7); ctx.fill();
    }
    if (k === 'gold') D.text(ctx, '★', 0, -46, { size: 18, color: '#fff' });
  }
  ctx.restore();
}
function render() {
  // pasto y cielo
  const sky = ctx.createLinearGradient(0, 0, 0, H); sky.addColorStop(0, '#1b1f4a'); sky.addColorStop(.25, '#2c6e3c'); sky.addColorStop(1, '#1d4d2a');
  ctx.fillStyle = sky; ctx.fillRect(0, 0, W, H);
  for (let i = 0; i < 60; i++) { const x = (i * 53) % W, y = 120 + (i * 37) % (H - 120); ctx.fillStyle = 'rgba(120,220,120,.15)'; ctx.fillRect(x, y, 2, 6); }
  ctx.save(); FX.applyShake(ctx);
  if (holes) holes.forEach((h, i) => {
    const { x, y } = holePos(i);
    ctx.fillStyle = '#2b1a10'; ctx.beginPath(); ctx.ellipse(x, y, 66, 22, 0, 0, 7); ctx.fill();
    ctx.fillStyle = '#120a06'; ctx.beginPath(); ctx.ellipse(x, y + 2, 56, 16, 0, 0, 7); ctx.fill();
    if (h.kind) drawMole(h, x, y);
    ctx.fillStyle = '#3a2416'; ctx.beginPath(); ctx.ellipse(x, y + 10, 70, 14, 0, 0, Math.PI); ctx.fill();
    if (!BG.isTouch) D.text(ctx, KEYS[i][0].slice(3), x + 58, y + 26, { size: 10, color: 'rgba(255,255,255,.35)' });
  });
  // tiempo
  if (state === 'play' || state === 'over') {
    const bw = W - 80, k = timeLeft / GAME_T;
    ctx.fillStyle = 'rgba(0,0,0,.35)'; D.rr(ctx, 40, 50, bw, 14, 7); ctx.fill();
    ctx.fillStyle = k < .2 ? '#ff3d6e' : '#2ef2ff'; D.rr(ctx, 40, 50, Math.max(14, bw * Math.min(1, k)), 14, 7); ctx.fill();
    if (mult() > 1) D.text(ctx, `COMBO ×${mult()}`, W / 2, 100, { size: 20, color: '#ff3dd0', glow: '#ff3dd0' });
  }
  FX.draw(ctx);
  // martillo
  const hx = hammer ? hammer.x : pointer.x + 20, hy = hammer ? hammer.y : pointer.y - 30;
  if (state === 'play' && (!BG.isTouch || hammer)) {
    ctx.save(); ctx.translate(hx, hy); ctx.rotate(hammer ? -.2 : .5);
    ctx.fillStyle = '#8b5a2b'; ctx.fillRect(-4, 0, 8, 60);
    ctx.fillStyle = '#c0c6d6'; D.rr(ctx, -26, -18, 52, 26, 6); ctx.fill(); ctx.fillStyle = '#ff3d6e'; ctx.fillRect(-26, -18, 10, 26); ctx.fillRect(16, -18, 10, 26);
    ctx.restore();
  }
  ctx.restore();
  FX.drawFlash(ctx, W, H);
}
view.canvas.addEventListener('pointermove', e => { pointer = view.toLocal(e.clientX, e.clientY); });
view.canvas.addEventListener('pointerdown', e => {
  pointer = view.toLocal(e.clientX, e.clientY);
  let best = -1, bd = 1e9;
  holes && holes.forEach((h, i) => { const p = holePos(i), d = Math.hypot(pointer.x - p.x, (pointer.y - (p.y - 30)) * 1.2); if (d < bd) { bd = d; best = i; } });
  if (best >= 0 && bd < 95) whack(best);
});
if (!BG.isTouch) view.canvas.style.cursor = 'none';
BG.input.onKey((e, code, down) => { if (!down || e.repeat) return; KEYS.forEach((ks, i) => { if (ks.includes(code)) whack(i); }); });

if (BG.thumb) { start(); BG.stop(); state = 'thumb'; [[1, 'mole', .9], [3, 'gold', 1], [5, 'helmet', 1], [7, 'bomb', .8]].forEach(([i, k, hh]) => { holes[i].kind = k; holes[i].h = hh; holes[i].state = 'up'; holes[i].hp = 2; }); score = 340; update = () => {}; }
else BG.ready.then(showMenu);
BG.loop(dt => update(dt), render);
</script>
</body>
</html>
