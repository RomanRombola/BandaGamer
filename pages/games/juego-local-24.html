<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Arkanoid</title>
<link rel="stylesheet" href="kit/bg-kit.css">
</head>
<body>
<script src="kit/bg-kit.js"></script>
<script>
// ═══════════════════════════════════════════════════════════════════════════
//  ARKANOID — BandaGamer
//  10 niveles dibujados a mano · ladrillos plateados (varios golpes) y dorados
//  (indestructibles) · cápsulas: E agrandar · L láser · C atrapar · S lento ·
//  D triple bola · B salida al siguiente nivel · P vida extra
// ═══════════════════════════════════════════════════════════════════════════
const { util: U, draw: D, fx: FX, sfx: SFX } = BG;
const W = 520, H = 680, COLS = 13, BW = 36, BH = 18, OX = (W - COLS * BW) / 2, OY = 80, PY = H - 60;
const COL = { r: '#ff3d5a', o: '#ff9a1f', y: '#ffd400', g: '#39ff88', c: '#2ef2ff', b: '#3d7bff', p: '#c04dff', w: '#f2f2ff', s: '#b8c0d8', G: '#e6b800' };
// Niveles: cada caracter es un ladrillo · s = plateado · G = dorado · . = vacío
const LEVELS = [
  ['.............', 'sssssssssssss', 'rrrrrrrrrrrrr', 'ooooooooooooo', 'yyyyyyyyyyyyy', 'ggggggggggggg', 'ccccccccccccc', 'bbbbbbbbbbbbb'],
  ['r............', 'ro...........', 'roy..........', 'royg.........', 'roygc........', 'roygcb.......', 'roygcbp......', 'roygcbpw.....', 'roygcbpwr....', 'roygcbpwro...', 'roygcbpwroy..', 'sssssssssssss'],
  ['.............', 'ggggggggggggg', '.............', 'wwwGGGGGGGGGG', '.............', 'rrrrrrrrrrrrr', '.............', 'GGGGGGGGGGwww', '.............', 'ccccccccccccc'],
  ['..p..p..p..p.', '.ppp.ppp.ppp.', 'ppppppppppppp', 'pwpwpwpwpwpwp', 'ppppppppppppp', '.ppp.ppp.ppp.', '..s..s..s..s.'],
  ['....yyyyy....', '...yyyyyyy...', '..yybyyybyy..', '..yyyyyyyyy..', '..yyrrrrryy..', '...yyrrryy...', '....yyyyy....', '.............', 'G...........G'],
  ['ssssGsssGssss', 's.....s.....s', 's.rrr.s.bbb.s', 's.rrr.s.bbb.s', 's.....s.....s', 'sssssssssssss', 's.ggg.s.ccc.s', 's.ggg.s.ccc.s', 's.....s.....s'],
  ['c.c.c.c.c.c.c', '.c.c.c.c.c.c.', 'c.c.c.c.c.c.c', '.o.o.o.o.o.o.', 'o.o.o.o.o.o.o', '.r.r.r.r.r.r.', 'r.r.r.r.r.r.r', 'GGG.......GGG'],
  ['.....w.w.....', '....wpwpw....', '...wppppp w..', '..wppppppppw.', '.wpppbbbpppw.', '.wppbbbbbppw.', '..wppbbbppw..', '...wpppppw...', '....wwwww....'],
  ['rrrr.....bbbb', 'rssr.....bssb', 'rrrr.....bbbb', '.....GGG.....', 'gggg.....yyyy', 'gssg.....yssy', 'gggg.....yyyy'],
  ['sssssssssssss', 'rGrGrGrGrGrGr', 'ooooooooooooo', 'yGyGyGyGyGyGy', 'ggggggggggggg', 'cGcGcGcGcGcGc', 'bbbbbbbbbbbbb', 'ppppppppppppp'],
];
const CAPS = { E: { c: '#3d7bff', n: 'AGRANDAR' }, L: { c: '#ff3d5a', n: 'LÁSER' }, C: { c: '#39ff88', n: 'ATRAPAR' }, S: { c: '#ff9a1f', n: 'LENTO' }, D: { c: '#2ef2ff', n: 'TRIPLE' }, B: { c: '#c04dff', n: 'SALIDA' }, P: { c: '#b8c0d8', n: 'VIDA EXTRA' } };

BG.init({
  id: 'arkanoid', title: 'ARKANOID', icon: '🧱', accent: '#3d7bff', accent2: '#c04dff', music: false,
  subtitle: '10 niveles diseñados a mano. Atrapá las cápsulas para conseguir poderes.',
  hud: [{ id: 'score', label: 'Puntos' }, { id: 'level', label: 'Nivel', color: '#ffd400' }, { id: 'lives', label: 'Vidas', color: '#ff3d5a', value: '●●●' }],
  help: 'Mouse o <kbd>←</kbd><kbd>→</kbd> para mover · <kbd>Espacio</kbd>/clic lanzar y disparar el láser',
  helpTouch: 'Arrastrá para mover la nave · tocá para lanzar/disparar',
  touch: { dpad: 'h', buttons: [{ action: 'action', label: '●' }] },
  onRestart: () => start(), onMenu: () => showMenu(),
});
const view = BG.canvas(W, H);
const ctx = view.ctx;
let bricks, balls, caps, lasers, pad, score, lives, level, state = 'menu', power = null, powerT = 0, t = 0, pointerX = null, warpOpen = false, enemies = [];
function loadLevel(n) {
  bricks = [];
  LEVELS[n % LEVELS.length].forEach((row, r) => [...row].forEach((ch, c) => {
    if (!COL[ch]) return;
    const silver = ch === 's', gold = ch === 'G';
    bricks.push({ x: OX + c * BW, y: OY + r * BH, ch, hp: silver ? 2 + Math.floor(n / 4) : 1, gold, flash: 0 });
  }));
  pad = { x: W / 2, w: 84, tw: 84 }; balls = [newBall(true)]; caps = []; lasers = []; power = null; warpOpen = false; enemies = [];
  BG.hud.set('level', n + 1, true);
}
function newBall(stuck) { return { x: pad ? pad.x : W / 2, y: PY - 10, vx: 0, vy: 0, sp: 330, stuck, off: 0 }; }
function start() { score = 0; lives = 3; level = 0; BG.hud.set('score', 0); updLives(); loadLevel(0); FX.clear(); state = 'play'; BG.start(); }
function showMenu() { state = 'menu'; BG.stop(); if (!bricks) loadLevel(0); BG.ui.menu({ buttons: [{ label: '▶ JUGAR', primary: true, onClick: start }], stats: [{ label: 'Récord', value: U.fmt(BG.getBest() || 0) }, { label: 'Niveles', value: LEVELS.length }] }); }
function updLives() { BG.hud.set('lives', lives > 0 ? '●'.repeat(Math.min(lives, 6)) : '—'); }
function launch() {
  for (const b of balls) if (b.stuck) { b.stuck = false; const a = -Math.PI / 2 + U.rand(-.3, .3) + b.off / 120; b.vx = Math.cos(a) * b.sp; b.vy = Math.sin(a) * b.sp; SFX.play('bounce'); }
}
function fire() {
  if (power !== 'L' || lasers.length > 6) return;
  lasers.push({ x: pad.x - pad.w / 2 + 8, y: PY - 10 }, { x: pad.x + pad.w / 2 - 8, y: PY - 10 }); SFX.play('laser');
}
function addScore(n) { score += n; BG.hud.set('score', score, true); }
function hitBrick(b, byLaser) {
  if (b.gold) { b.flash = .2; SFX.tone({ f: 900, dur: .05, type: 'square', vol: .08 }); return false; }
  b.hp--; b.flash = .15;
  if (b.hp > 0) { SFX.tone({ f: 700, dur: .06, type: 'triangle', vol: .15 }); return false; }
  b.dead = true;
  addScore(b.ch === 's' ? 50 * (level + 1) : 50 + 10 * 'woyrgcbp'.indexOf(b.ch));
  FX.burst(b.x + BW / 2, b.y + BH / 2, { n: 10, color: [COL[b.ch], '#fff'], speed: 160, life: .4, shape: 'square' });
  SFX.tone({ f: 400 + Math.random() * 300, dur: .06, type: 'square', vol: .1 });
  if (!byLaser && Math.random() < .14 && !caps.length) {
    const keys = Object.keys(CAPS).filter(k => k !== 'P' || Math.random() < .3);
    caps.push({ x: b.x + BW / 2, y: b.y + BH / 2, k: U.pick(keys) });
  }
  return true;
}
function grant(k) {
  SFX.play('power'); BG.ui.toast(CAPS[k].n, CAPS[k].c);
  if (power === 'C' && k !== 'C') balls.forEach(b => b.stuck && launch());
  power = k; powerT = 15;
  pad.tw = k === 'E' ? 130 : 84;
  if (k === 'S') balls.forEach(b => { b.sp = 260; norm(b); });
  if (k === 'D') { const src = balls[0]; if (src && !src.stuck) for (const a of [-.5, .5]) { const nb = { ...src }; const ang = Math.atan2(src.vy, src.vx) + a; nb.vx = Math.cos(ang) * src.sp; nb.vy = Math.sin(ang) * src.sp; balls.push(nb); } }
  if (k === 'B') warpOpen = true;
  if (k === 'P') { lives++; updLives(); }
}
function norm(b) { const s = Math.hypot(b.vx, b.vy) || 1; b.vx = b.vx / s * b.sp; b.vy = b.vy / s * b.sp; }
function levelClear() {
  addScore(1000 + level * 250); SFX.play('levelup'); BG.ui.toast(`¡NIVEL ${level + 1} SUPERADO!`, '#39ff88');
  level++;
  if (level >= LEVELS.length) { win(); return; }
  state = 'between'; setTimeout(() => { loadLevel(level); state = 'play'; }, 1200);
}
function win() {
  state = 'over'; BG.stop(); SFX.play('win');
  const r = BG.submitScore(score, { won: true });
  BG.ui.gameOver({ win: true, icon: '🏆', title: '¡TERMINASTE ARKANOID!', score, isRecord: r.isRecord || r.first, stats: [{ label: 'Vidas restantes', value: lives }], onRetry: start, onMenu: showMenu });
}
function loseBall() {
  lives--; updLives(); SFX.play('hurt'); FX.shake(6, .3);
  if (lives <= 0) {
    state = 'over'; BG.stop(); SFX.play('lose');
    const r = BG.submitScore(score);
    setTimeout(() => BG.ui.gameOver({ icon: '🧱', score, isRecord: r.isRecord || r.first, recordText: r.first ? '★ ¡PRIMER RÉCORD! ★' : null, stats: [{ label: 'Récord', value: U.fmt(BG.getBest() || score) }, { label: 'Nivel', value: level + 1 }], onRetry: start, onMenu: showMenu }), 700);
    return;
  }
  power = null; pad.tw = 84; balls = [newBall(true)]; caps = []; lasers = [];
}
function update(dt) {
  t += dt;
  if (state !== 'play') return;
  const I = BG.input;
  if (pointerX != null) pad.x = U.lerp(pad.x, pointerX, Math.min(1, dt * 20));
  else pad.x += I.axisX() * 520 * dt;
  pad.w = U.lerp(pad.w, pad.tw, dt * 10);
  pad.x = U.clamp(pad.x, pad.w / 2 + 8, W - pad.w / 2 - 8 + (warpOpen ? pad.w : 0));
  if (warpOpen && pad.x > W - 8) { addScore(500); levelClear(); return; }
  if (I.pressed('action') || I.pressed('up')) { launch(); fire(); }
  if (power) { powerT -= dt; if (powerT <= 0 && power !== 'C') { if (power === 'E') pad.tw = 84; if (power === 'S') balls.forEach(b => { b.sp = 330 + level * 10; norm(b); }); power = null; } }
  // pelotas (sub-pasos para no atravesar ladrillos)
  for (const b of balls) {
    if (b.stuck) { b.x = pad.x + b.off; b.y = PY - 10; continue; }
    const steps = Math.ceil(b.sp * dt / 6);
    for (let s = 0; s < steps; s++) {
      b.x += b.vx * dt / steps; b.y += b.vy * dt / steps;
      if (b.x < 14) { b.x = 14; b.vx = Math.abs(b.vx); SFX.play('bounce'); }
      if (b.x > W - 14) { b.x = W - 14; b.vx = -Math.abs(b.vx); SFX.play('bounce'); }
      if (b.y < 44) { b.y = 44; b.vy = Math.abs(b.vy); SFX.play('bounce'); }
      // paleta
      if (b.vy > 0 && b.y + 7 >= PY - 7 && b.y < PY + 6 && Math.abs(b.x - pad.x) < pad.w / 2 + 6) {
        const rel = U.clamp((b.x - pad.x) / (pad.w / 2), -1, 1), a = -Math.PI / 2 + rel * 1.05;
        b.sp = Math.min(560, b.sp + 4); b.vx = Math.cos(a) * b.sp; b.vy = Math.sin(a) * b.sp; b.y = PY - 15;
        if (power === 'C') { b.stuck = true; b.off = b.x - pad.x; }
        SFX.tone({ f: 260, dur: .06, type: 'square', vol: .12 });
      }
      // ladrillos
      for (const br of bricks) {
        if (br.dead) continue;
        if (b.x + 7 > br.x && b.x - 7 < br.x + BW && b.y + 7 > br.y && b.y - 7 < br.y + BH) {
          const ox = Math.min(b.x + 7 - br.x, br.x + BW - (b.x - 7)), oy = Math.min(b.y + 7 - br.y, br.y + BH - (b.y - 7));
          if (ox < oy) b.vx = -b.vx; else b.vy = -b.vy;
          hitBrick(br);
          break;
        }
      }
    }
    if (b.y > H + 20) b.lost = true;
  }
  balls = balls.filter(b => !b.lost);
  if (!balls.length) { loseBall(); return; }
  // láseres
  for (const l of lasers) { l.y -= 700 * dt; for (const br of bricks) if (!br.dead && l.x > br.x && l.x < br.x + BW && l.y > br.y && l.y < br.y + BH) { l.dead = true; hitBrick(br, true); break; } }
  lasers = lasers.filter(l => !l.dead && l.y > 40);
  // cápsulas
  for (const c of caps) { c.y += 140 * dt; if (c.y > PY - 12 && c.y < PY + 10 && Math.abs(c.x - pad.x) < pad.w / 2 + 12) { c.got = true; grant(c.k); } }
  caps = caps.filter(c => !c.got && c.y < H + 20);
  bricks.forEach(b => b.flash = Math.max(0, b.flash - dt));
  if (bricks.every(b => b.dead || b.gold)) levelClear();
}
function render() {
  const g = ctx.createLinearGradient(0, 0, 0, H); g.addColorStop(0, '#0a0a2a'); g.addColorStop(1, '#14081f'); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  ctx.strokeStyle = 'rgba(61,123,255,.06)'; for (let y = 50; y < H; y += 24) for (let x = (y / 24 % 2) * 20; x < W; x += 40) { ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + 20, y + 12); ctx.lineTo(x, y + 24); ctx.stroke(); }
  // marco metálico
  const fr = ctx.createLinearGradient(0, 0, 14, 0); fr.addColorStop(0, '#5a6280'); fr.addColorStop(1, '#2a2f45');
  ctx.fillStyle = fr; ctx.fillRect(0, 36, 8, H); ctx.fillRect(W - 8, 36, 8, H); ctx.fillRect(0, 36, W, 8);
  if (warpOpen) { ctx.fillStyle = `rgba(192,77,255,${.5 + Math.sin(t * 10) * .3})`; ctx.fillRect(W - 8, PY - 30, 8, 50); D.text(ctx, 'SALIDA →', W - 50, PY - 40, { size: 10, color: '#c04dff' }); }
  ctx.save(); FX.applyShake(ctx);
  if (bricks) for (const b of bricks) {
    if (b.dead) continue;
    const col = b.flash > 0 ? '#ffffff' : COL[b.ch];
    const gr = ctx.createLinearGradient(b.x, b.y, b.x, b.y + BH); gr.addColorStop(0, col); gr.addColorStop(1, b.gold || b.ch === 's' ? '#555a70' : shade(col));
    ctx.fillStyle = gr; ctx.fillRect(b.x + 1, b.y + 1, BW - 2, BH - 2);
    ctx.fillStyle = 'rgba(255,255,255,.35)'; ctx.fillRect(b.x + 2, b.y + 2, BW - 4, 3);
    ctx.fillStyle = 'rgba(0,0,0,.3)'; ctx.fillRect(b.x + 2, b.y + BH - 4, BW - 4, 2);
    if (b.ch === 's' && b.hp > 1) D.text(ctx, String(b.hp), b.x + BW / 2, b.y + BH / 2 + 1, { size: 9, color: '#1a1a2e' });
  }
  for (const c of caps || []) { ctx.fillStyle = CAPS[c.k].c; D.rr(ctx, c.x - 16, c.y - 7, 32, 14, 7); ctx.fill(); ctx.fillStyle = 'rgba(255,255,255,.4)'; ctx.fillRect(c.x - 12, c.y - 5, 24, 3); D.text(ctx, c.k, c.x, c.y + 1, { size: 10, color: '#fff', stroke: 'rgba(0,0,0,.4)', strokeW: 2 }); }
  for (const l of lasers || []) { ctx.fillStyle = '#ff3d5a'; ctx.shadowColor = '#ff3d5a'; ctx.shadowBlur = 10; ctx.fillRect(l.x - 1.5, l.y - 8, 3, 14); ctx.shadowBlur = 0; }
  if (pad) {
    const x = pad.x - pad.w / 2;
    ctx.save(); ctx.shadowColor = power === 'L' ? '#ff3d5a' : '#3d7bff'; ctx.shadowBlur = 18;
    const pg = ctx.createLinearGradient(0, PY - 7, 0, PY + 7); pg.addColorStop(0, '#d8dcf0'); pg.addColorStop(1, '#6a7290');
    ctx.fillStyle = pg; D.rr(ctx, x, PY - 7, pad.w, 14, 7); ctx.fill(); ctx.restore();
    ctx.fillStyle = power === 'L' ? '#ff3d5a' : '#ff3d5a'; ctx.fillRect(x + 2, PY - 5, 10, 10); ctx.fillRect(x + pad.w - 12, PY - 5, 10, 10);
    if (power === 'L') { ctx.fillStyle = '#ffd400'; ctx.fillRect(x + 6, PY - 12, 4, 6); ctx.fillRect(x + pad.w - 10, PY - 12, 4, 6); }
  }
  for (const b of balls || []) D.glowCircle(ctx, b.x, b.y, 6.5, '#ffffff', 14);
  if (state === 'play' && balls && balls.some(b => b.stuck)) D.text(ctx, BG.isTouch ? 'TOCÁ PARA LANZAR' : 'ESPACIO PARA LANZAR', W / 2, PY - 60, { size: 12, color: 'rgba(255,255,255,.7)' });
  FX.draw(ctx);
  ctx.restore();
  if (power) D.text(ctx, `${CAPS[power].n}${power !== 'C' ? ' ' + Math.ceil(powerT) : ''}`, 16, H - 16, { size: 11, color: CAPS[power].c, align: 'left' });
  FX.drawFlash(ctx, W, H);
}
function shade(hex) { const n = parseInt(hex.slice(1), 16); return `rgb(${(n >> 16) * .55 | 0},${((n >> 8) & 255) * .55 | 0},${(n & 255) * .55 | 0})`; }
view.canvas.addEventListener('pointermove', e => { if (e.pointerType === 'mouse' || e.buttons) pointerX = view.toLocal(e.clientX, e.clientY).x; });
view.canvas.addEventListener('pointerdown', e => { pointerX = view.toLocal(e.clientX, e.clientY).x; if (state === 'play') { launch(); fire(); } });
window.addEventListener('keydown', e => { if (/Arrow|KeyA|KeyD/.test(e.code)) pointerX = null; });
if (BG.thumb) { level = 7; loadLevel(7); balls[0] = { x: 240, y: 420, vx: 0, vy: 0, sp: 0, stuck: false }; caps = [{ x: 330, y: 360, k: 'L' }]; power = 'L'; lasers = [{ x: 230, y: 300 }, { x: 290, y: 300 }]; bricks.slice(0, 9).forEach(b => b.dead = true); update = () => {}; }
else BG.ready.then(showMenu);
BG.loop(dt => update(dt), render);
</script>
</body>
</html>
