<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Typing Speed</title>
<link rel="stylesheet" href="kit/bg-kit.css">
<style>
#wrap { width: min(860px, 100%); padding: 16px; display: flex; flex-direction: column; gap: 14px; align-items: stretch; }
#opts { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; }
#opts .bg-btn { padding: 7px 12px; font-size: 11px; }
#box { position: relative; background: rgba(18,18,40,.85); border: 1px solid rgba(255,255,255,.1); border-radius: 16px; padding: 22px 24px; min-height: 180px; cursor: text; box-shadow: 0 14px 40px rgba(0,0,0,.5); }
#box.focus { border-color: rgba(0,229,160,.6); box-shadow: 0 0 0 3px rgba(0,229,160,.15), 0 14px 40px rgba(0,0,0,.5); }
#text { font-family: 'Rajdhani', monospace; font-size: clamp(20px, 3.6vw, 28px); line-height: 1.6; color: #5d5d80; letter-spacing: .5px; word-break: break-word; max-height: 5em; overflow: hidden; }
#text .ok { color: #e8e8ff; }
#text .bad { color: #ff4d6d; background: rgba(255,77,109,.15); border-radius: 3px; }
#text .cur { position: relative; }
#text .cur::before { content: ''; position: absolute; left: -1px; top: 12%; bottom: 12%; width: 2.5px; background: #00e5a0; animation: blink 1s steps(2) infinite; border-radius: 2px; }
@keyframes blink { 50% { opacity: 0; } }
#hint { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-family: 'Orbitron', sans-serif; font-size: 13px; letter-spacing: 2px; color: #00e5a0; background: rgba(10,10,24,.6); border-radius: 16px; pointer-events: none; }
#in { position: absolute; opacity: 0; left: 0; top: 0; width: 1px; height: 1px; }
#live { display: flex; justify-content: center; gap: 28px; font-family: 'Orbitron', sans-serif; }
#live div { text-align: center; } #live b { display: block; font-size: 28px; color: #00e5a0; } #live span { font-size: 10px; letter-spacing: 2px; color: #8b8ba3; }
#bar { height: 6px; border-radius: 3px; background: rgba(255,255,255,.08); overflow: hidden; } #bar i { display: block; height: 100%; background: linear-gradient(90deg, #00e5a0, #2ef2ff); width: 100%; transition: width .25s linear; }
canvas.chart { width: 100%; height: 120px; display: block; margin: 6px 0 10px; }
</style>
</head>
<body>
<div id="bg-stage">
  <div id="wrap">
    <div id="opts"></div>
    <div id="live"><div><b id="lw">0</b><span>PPM</span></div><div><b id="la">100%</b><span>PRECISIÓN</span></div><div><b id="lt">60</b><span>SEGUNDOS</span></div></div>
    <div id="bar"><i id="bari"></i></div>
    <div id="box"><div id="text"></div><div id="hint">HACÉ CLIC Y EMPEZÁ A ESCRIBIR</div><input id="in" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false"></div>
  </div>
</div>
<script src="kit/bg-kit.js"></script>
<script>
// ═══════════════════════════════════════════════════════════════════════════
//  TYPING SPEED — BandaGamer
//  30 / 60 / 120 segundos · palabras comunes o refranes · PPM en vivo,
//  precisión y gráfico de velocidad · funciona con el teclado del celular
// ═══════════════════════════════════════════════════════════════════════════
const { util: U, sfx: SFX } = BG;
const WORDS = 'de la que el en y a los se del las un por con no una su para es al lo como más o pero sus le ha me si sin sobre este ya entre cuando todo esta ser son dos también fue había era muy años hasta desde está mi porque qué sólo han yo hay vez puede todos así nos ni parte tiene él uno donde bien tiempo mismo ese ahora cada e vida otro después te otros aunque esa eso hace otra gobierno tan durante siempre día tanto ella tres sí dijo sido gran país según menos mundo año antes estado contra sino forma caso nada hacer general estaba poco estos presidente mayor ante unos les algo hacia casa ellos ayer hecho primera mucho mientras además quien momento millones esto españa hombre están pues hoy lugar madrid nacional trabajo otras mejor nuevo decir algunos entonces todas días debe política cómo casi toda tal luego pasado primer medio va estas sea tenía nunca poder aquí ver veces embargo partido personas grupo cuenta pueden tienen misma nueva cual fueron mujer frente josé tras cosas fin ciudad he social manera tener sistema será historia muchos juan tipo cuatro dentro nuestro punto dice ello cualquier noche aún agua parece haber situación fuera bajo grandes nuestra ejemplo acuerdo habían usted estados hizo nadie países horas posible tarde ley importante guerra desarrollo proceso realidad sentido lado mí tu cambio allí mano eran estar san número sociedad unas centro padre gente final relación cuerpo obra incluso través último madre mis modo problema cinco carlos hombres información ojos muerte nombre algunas público mujeres siglo todavía meses mañana esos nosotros hora muchas pueblo alguna dar problemas don da tú derecho verdad maría unidos podría sería junto cabeza aquel luis cuanto tierra equipo segundo director dicho cierto casos manos nivel podía familia largo partir falta llegar propio ministro cosa primero seguridad hemos mal trata algún tuvo respecto semana varios real sé voz paso señor mil quienes proyecto mercado mayoría luz claro iba éste pesetas orden español buena quiere aquella programa palabras internacional van esas segunda empresa puesto ahí propia libro igual político persona últimos ellas total creo tengo dios española condiciones méxico fuerza solo único acción amor policía puerta pesar zona sabe calle interior tampoco música ningún vista campo buen hubiera saber obras razón ex niños presencia tema dinero comisión antonio servicio hijo última ciento estoy hablar dio minutos producción camino seis quién fondo dirección papel demás barcelona idea especial diferentes dado base capital ambos europa libertad relaciones espacio medios ir actual población empresas estudio salud servicios haya principio siendo cultura anterior alto media mediante primeros arte paz sector imagen medida deben datos consejo personal interés julio grupos miembros ninguna existe cara edad etc movimiento visto llegó puntos actividad bueno uso niño difícil joven futuro aquellos mes pronto soy hacía nuevos nuestros estaban posibilidad sigue cerca resultados educación atención gonzález capacidad efecto necesario valor aire investigación siguiente figura central comunidad necesidad serie organización nuevas calidad'.split(' ');
const REFRANES = ['Al que madruga Dios lo ayuda', 'No por mucho madrugar amanece más temprano', 'Más vale pájaro en mano que cien volando', 'En boca cerrada no entran moscas', 'Camarón que se duerme se lo lleva la corriente', 'Dime con quién andas y te diré quién eres', 'A caballo regalado no se le miran los dientes', 'Ojos que no ven corazón que no siente', 'El que busca encuentra', 'Perro que ladra no muerde', 'Más vale tarde que nunca', 'No hay mal que por bien no venga', 'Cuando el río suena agua trae', 'A mal tiempo buena cara', 'Quien mucho abarca poco aprieta', 'El hábito no hace al monje', 'Del dicho al hecho hay mucho trecho', 'Agua que no has de beber déjala correr', 'Hablando del rey de Roma por la puerta se asoma', 'Cría cuervos y te sacarán los ojos', 'Donde hubo fuego cenizas quedan', 'A buen entendedor pocas palabras bastan', 'El que ríe último ríe mejor', 'No dejes para mañana lo que puedes hacer hoy', 'Más sabe el diablo por viejo que por diablo', 'Mal de muchos consuelo de tontos', 'Ojo por ojo diente por diente', 'Poco a poco se va lejos', 'Zapatero a tus zapatos', 'La práctica hace al maestro'];
const norm = s => s.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();

BG.init({
  id: 'typing', title: 'TYPING SPEED', icon: '⌨️', accent: '#00e5a0', accent2: '#2ef2ff', scroll: true, pausable: false, muteKey: false,
  subtitle: '¿Cuántas palabras por minuto escribís? Medilo y superate.',
  hud: [{ id: 'best', label: 'Récord PPM', color: '#00e5a0', value: '—' }, { id: 'mode', label: 'Modo', color: '#2ef2ff', value: '60 s' }],
  help: 'Escribí el texto tal cual. La barra espaciadora pasa a la siguiente palabra. Las tildes son opcionales.',
});
const cfg = BG.load('cfg', { secs: 60, kind: 'words' });
const textEl = document.getElementById('text'), inp = document.getElementById('in'), box = document.getElementById('box'), hintEl = document.getElementById('hint');
let target = '', typed = '', started = false, finished = false, t0 = 0, timer, samples = [], errorsTotal = 0, keystrokes = 0, lastLen = 0;
const mk = () => `${cfg.kind}${cfg.secs}`;

function genText() {
  if (cfg.kind === 'words') { const out = []; for (let i = 0; i < 260; i++) out.push(U.pick(WORDS)); return out.join(' '); }
  return U.shuffle(REFRANES.slice()).concat(U.shuffle(REFRANES.slice())).join('. ') + '.';
}
function reset() {
  clearInterval(timer); target = genText(); typed = ''; started = false; finished = false; samples = []; errorsTotal = 0; keystrokes = 0; lastLen = 0;
  inp.value = ''; document.getElementById('lt').textContent = cfg.secs; document.getElementById('lw').textContent = '0'; document.getElementById('la').textContent = '100%';
  document.getElementById('bari').style.width = '100%';
  hintEl.style.display = ''; buildOpts(); paint();
  const b = BG.getBest(mk()); BG.hud.set('best', b || '—'); BG.hud.set('mode', `${cfg.secs} s`);
}
function buildOpts() {
  const o = document.getElementById('opts');
  o.innerHTML = [15, 30, 60, 120].map(s => `<button class="bg-btn ${cfg.secs === s ? 'sel' : ''}" data-s="${s}">${s} s</button>`).join('') +
    `<button class="bg-btn ${cfg.kind === 'words' ? 'sel' : ''}" data-k="words">PALABRAS</button><button class="bg-btn ${cfg.kind === 'quotes' ? 'sel' : ''}" data-k="quotes">REFRANES</button><button class="bg-btn" data-r="1">↻</button>`;
  o.querySelectorAll('[data-s]').forEach(b => b.onclick = () => { cfg.secs = +b.dataset.s; BG.save('cfg', cfg); reset(); });
  o.querySelectorAll('[data-k]').forEach(b => b.onclick = () => { cfg.kind = b.dataset.k; BG.save('cfg', cfg); reset(); });
  o.querySelector('[data-r]').onclick = reset;
}
const same = (a, b) => a === b || norm(a) === norm(b);
function paint() {
  // mostrar una ventana del texto alrededor del cursor
  const pos = typed.length;
  const start = Math.max(0, target.lastIndexOf(' ', Math.max(0, pos - 60)));
  const end = Math.min(target.length, start + 260);
  let html = '';
  for (let i = start; i < end; i++) {
    const ch = target[i] === ' ' ? ' ' : U.esc(target[i]);
    let cls = '';
    if (i < pos) cls = same(typed[i], target[i]) ? 'ok' : 'bad';
    if (i === pos) cls += ' cur';
    html += cls ? `<span class="${cls}">${target[i] === ' ' && cls.includes('bad') ? '·' : ch}</span>` : ch;
  }
  textEl.innerHTML = html;
}
function stats() {
  const el = Math.max(.5, (performance.now() - t0) / 1000);
  let correct = 0; for (let i = 0; i < typed.length; i++) if (same(typed[i], target[i])) correct++;
  const wpm = Math.round(correct / 5 / (el / 60));
  const acc = keystrokes ? Math.max(0, Math.round((keystrokes - errorsTotal) / keystrokes * 100)) : 100;
  return { wpm, acc, el, correct, raw: Math.round(typed.length / 5 / (el / 60)) };
}
function onInput() {
  if (finished) { inp.value = typed; return; }
  const v = inp.value;
  if (!started && v.length) { started = true; t0 = performance.now(); hintEl.style.display = 'none'; timer = setInterval(tick, 100); }
  if (v.length > lastLen) {
    for (let i = lastLen; i < v.length; i++) { keystrokes++; if (!same(v[i], target[i])) { errorsTotal++; SFX.play('tick'); } }
  }
  lastLen = v.length; typed = v.slice(0, target.length);
  paint();
  if (typed.length >= target.length) finish();
}
function tick() {
  const s = stats(), left = Math.max(0, cfg.secs - s.el);
  document.getElementById('lt').textContent = Math.ceil(left);
  document.getElementById('lw').textContent = s.wpm;
  document.getElementById('la').textContent = s.acc + '%';
  document.getElementById('bari').style.width = (left / cfg.secs * 100) + '%';
  const sec = Math.floor(s.el); if (!samples[sec]) samples[sec] = s.wpm;
  if (left <= 0) finish();
}
function finish() {
  if (finished) return;
  finished = true; clearInterval(timer); inp.blur();
  const s = stats();
  SFX.play('win');
  const r = s.wpm > 0 ? BG.submitScore(s.wpm, { mode: mk() }) : { isRecord: false };
  const lvl = s.wpm >= 90 ? '🚀 Nivel profesional' : s.wpm >= 60 ? '⚡ Muy rápido' : s.wpm >= 40 ? '👍 Por encima del promedio' : s.wpm >= 25 ? '🙂 Promedio' : '🐢 A practicar un poco más';
  BG.ui.show({
    icon: '⌨️', title: `${s.wpm} PPM`, tone: 'good', sub: lvl, record: r.isRecord || r.first ? (r.first ? '★ ¡PRIMER RÉCORD! ★' : true) : null,
    stats: [{ label: 'Precisión', value: s.acc + '%' }, { label: 'PPM brutas', value: s.raw }, { label: 'Errores', value: errorsTotal }, { label: 'Récord', value: BG.getBest(mk()) || s.wpm }],
    html: '<div class="bg-label">Velocidad durante la prueba</div><canvas class="chart" width="640" height="200"></canvas>',
    buttons: [{ label: '↻ OTRA VEZ', primary: true, onClick: () => { BG.ui.hide(); reset(); setTimeout(() => inp.focus(), 50); } }],
    onShow: card => drawChart(card.querySelector('canvas')),
  });
}
function drawChart(c) {
  const g = c.getContext('2d'), w = c.width, h = c.height, data = samples.filter(x => x != null);
  if (data.length < 2) return;
  const max = Math.max(...data, 20) * 1.15;
  g.strokeStyle = 'rgba(255,255,255,.08)'; for (let y = 0; y < 4; y++) { g.beginPath(); g.moveTo(0, h * y / 4); g.lineTo(w, h * y / 4); g.stroke(); }
  const grd = g.createLinearGradient(0, 0, 0, h); grd.addColorStop(0, 'rgba(0,229,160,.45)'); grd.addColorStop(1, 'rgba(0,229,160,0)');
  g.beginPath(); data.forEach((v, i) => { const x = i / (data.length - 1) * w, y = h - v / max * h; i ? g.lineTo(x, y) : g.moveTo(x, y); });
  g.lineTo(w, h); g.lineTo(0, h); g.closePath(); g.fillStyle = grd; g.fill();
  g.beginPath(); data.forEach((v, i) => { const x = i / (data.length - 1) * w, y = h - v / max * h; i ? g.lineTo(x, y) : g.moveTo(x, y); });
  g.strokeStyle = '#00e5a0'; g.lineWidth = 4; g.stroke();
}
box.addEventListener('click', () => inp.focus());
inp.addEventListener('input', onInput);
inp.addEventListener('focus', () => box.classList.add('focus'));
inp.addEventListener('blur', () => box.classList.remove('focus'));
inp.addEventListener('paste', e => e.preventDefault());
document.addEventListener('keydown', e => { if (!BG.ui.open && document.activeElement !== inp && e.key.length === 1 && !e.ctrlKey && !e.metaKey) inp.focus(); });

if (BG.thumb) { target = genText(); typed = target.slice(0, 54).replace(/a/, 'q'); hintEl.style.display = 'none'; paint(); document.getElementById('lw').textContent = '64'; document.getElementById('la').textContent = '97%'; document.getElementById('lt').textContent = '38'; }
else { reset(); BG.ready.then(() => setTimeout(() => inp.focus(), 100)); }
</script>
</body>
</html>
