<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Infinite Runner</title>
<link rel="stylesheet" href="kit/bg-kit.css">
</head>
<body>
<script src="kit/bg-kit.js"></script>
<script>
// ═══════════════════════════════════════════════════════════════════════════
//  INFINITE RUNNER — BandaGamer
//  3 carriles en perspectiva · saltá vallas bajas, deslizate bajo las altas,
//  esquivá los muros · monedas · power-ups: imán, ×2 y jetpack · cada vez más rápido
// ═══════════════════════════════════════════════════════════════════════════
const { util: U, draw: D, fx: FX, sfx: SFX } = BG;
const W = 420, H = 680, HOR = 150, F = 300, CAMH = 5, PZ = 3.9, FAR = 50;
BG.init({
  post: { bloom: .55, vignette: .35, thumbFx: true },
  id: 'runner3d', title: 'INFINITE RUNNER', icon: '🏃', accent: '#ff3dd0', accent2: '#2ef2ff', music: true,
  subtitle: 'Corré, esquivá y juntá monedas. ¿Hasta dónde llegás?',
  hud: [{ id: 'score', label: 'Puntos' }, { id: 'coins', label: 'Monedas', color: '#ffd400' }, { id: 'dist', label: 'Metros', color: '#2ef2ff' }],
  help: '<kbd>←</kbd><kbd>→</kbd> cambiar de carril · <kbd>↑</kbd> saltar · <kbd>↓</kbd> deslizarse',
  helpTouch: 'Deslizá el dedo: izquierda/derecha cambia de carril, arriba salta, abajo se desliza.',
  onRestart: () => start(), onMenu: () => showMenu(),
});
const view = BG.canvas(W, H);
const ctx = view.ctx;
let p, objs = [], speed, dist, coins, score, spawnZ, power = {}, state = 'menu', t = 0, stripe = 0;
function proj(x, y, z) { const k = F / Math.max(.1, z); return { x: W / 2 + x * k, y: HOR + (CAMH - y) * k, k }; }
function start() {
  p = { lane: 0, x: 0, y: 0, vy: 0, slide: 0, run: 0, dead: false };
  objs = []; speed = 13; dist = 0; coins = 0; score = 0; spawnZ = 18; power = {};
  BG.hud.setAll({ score: 0, coins: 0, dist: 0 }); FX.clear(); state = 'play'; BG.start(); BG.music.play(SONG);
}
function showMenu() { state = 'menu'; BG.stop(); BG.music.stop(); if (!p) { p = { lane: 0, x: 0, y: 0, vy: 0, slide: 0, run: 0 }; objs = []; power = {}; speed = 10; } BG.ui.menu({ buttons: [{ label: '▶ CORRER', primary: true, onClick: start }] }); }
function act(a) {
  if (state !== 'play' || BG.paused) return;
  if (a === 'left' && p.lane > -1) { p.lane--; SFX.play('swap'); }
  if (a === 'right' && p.lane < 1) { p.lane++; SFX.play('swap'); }
  if (a === 'up' && p.y <= .01 && !(power.jet > 0)) { p.vy = 9.5; p.slide = 0; SFX.play('jump'); }
  if (a === 'down') { if (p.y > .05) p.vy = -14; p.slide = .7; SFX.play('whoosh'); }
}
['left', 'right', 'up', 'down'].forEach(a => BG.input.on(a, () => act(a)));
BG.input.swipe(view.canvas, d => act(d), 24);

// Patrones de obstáculos por "fila" (z): siempre deja un carril libre
function spawnRow(z) {
  const lanes = [-1, 0, 1];
  const r = Math.random(), diff = Math.min(1, dist / 3000);
  if (r < .22) { // fila de monedas en un carril
    const l = U.pick(lanes); for (let i = 0; i < 6; i++) objs.push({ t: 'coin', x: l, z: z + i * 1.4, y: .5 });
    return 6 * 1.4 + 3;
  }
  if (r < .25 && dist > 300) { objs.push({ t: 'pow', kind: U.pick(['mag', 'x2', 'jet']), x: U.pick(lanes), z, y: .6 }); return 5; }
  const free = U.pick(lanes);
  const gap = U.rand(8, 12) - diff * 2;
  lanes.forEach(l => {
    if (l === free) { if (Math.random() < .5) objs.push({ t: 'coin', x: l, z, y: .5 }); return; }
    const k = Math.random();
    if (k < .38) objs.push({ t: 'low', x: l, z });
    else if (k < .62 + diff * .1) objs.push({ t: 'high', x: l, z });
    else objs.push({ t: 'wall', x: l, z, len: Math.min(2 + Math.random() * 3 * diff, gap - 2.5) });   // nunca tapa la fila siguiente
  });
  return gap;
}
function die() {
  if (p.dead) return;
  p.dead = true; state = 'over'; BG.stop(); BG.music.stop();
  SFX.play('explode'); FX.shake(10, .4); FX.flash('#ff3d6e', .4);
  const pp = proj(p.x, .8, PZ); FX.burst(pp.x, pp.y, { n: 40, color: ['#ff3dd0', '#2ef2ff', '#fff'], speed: 300, life: .8 });
  const r = BG.submitScore(score);
  setTimeout(() => BG.ui.gameOver({ icon: '🏃', score, isRecord: r.isRecord || r.first, recordText: r.first ? '★ ¡PRIMER RÉCORD! ★' : null,
    stats: [{ label: 'Récord', value: U.fmt(BG.getBest() || score) }, { label: 'Metros', value: Math.floor(dist) }, { label: 'Monedas', value: coins }], onRetry: start, onMenu: showMenu }), 900);
}
function update(dt) {
  t += dt;
  if (state !== 'play') { stripe += dt * 6; return; }
  speed = Math.min(26, 13 + dist / 200);
  const dz = speed * dt;
  dist += dz; stripe += dz;
  for (const k in power) power[k] = Math.max(0, power[k] - dt);
  // jugador
  p.x = U.lerp(p.x, p.lane, Math.min(1, dt * 14));
  if (power.jet > 0) { p.y = U.lerp(p.y, 2.6, dt * 4); p.vy = 0; }
  else { p.vy -= 30 * dt; p.y = Math.max(0, p.y + p.vy * dt); if (p.y === 0) p.vy = 0; }
  p.slide = Math.max(0, p.slide - dt); p.run += dt * speed * .9;
  // objetos
  spawnZ -= dz;
  while (spawnZ < FAR) spawnZ += spawnRow(FAR + (spawnZ - FAR) + 2) ;
  for (const o of objs) {
    o.z -= dz;
    if (o.t === 'coin' && power.mag > 0 && o.z < 12 && o.z > PZ - 1) { o.x = U.lerp(o.x, p.x, dt * 8); o.y = U.lerp(o.y, p.y + .6, dt * 8); }
    if (o.hit) continue;
    const near = o.t === 'wall' ? (o.z < PZ + .3 && o.z + o.len > PZ - .3) : Math.abs(o.z - PZ) < .45;
    if (!near || Math.abs(o.x - p.x) > .45) continue;
    if (o.t === 'coin') { if (Math.abs(o.y - (p.y + .5)) < 1.1) { o.hit = true; coins++; const v = power.x2 > 0 ? 20 : 10; score += v; SFX.play('blip'); BG.hud.set('coins', coins, true); const pp = proj(o.x, o.y, o.z); FX.burst(pp.x, pp.y, { n: 6, color: ['#ffd400', '#fff'], speed: 120, life: .3 }); } continue; }
    if (o.t === 'pow') { o.hit = true; power[o.kind] = o.kind === 'jet' ? 5 : 10; SFX.play('power'); BG.ui.toast({ mag: '🧲 IMÁN', x2: '✖2 PUNTOS DOBLES', jet: '🚀 JETPACK' }[o.kind], '#2ef2ff'); continue; }
    if (power.jet > 0) continue;
    if (o.t === 'low' && p.y > .55) continue;
    if (o.t === 'high' && p.slide > 0) continue;
    die(); return;
  }
  objs = objs.filter(o => (o.t === 'wall' ? o.z + o.len : o.z) > -1 && !(o.hit && o.t !== 'coin') && !(o.hit && o.t === 'coin'));
  score += dz * (power.x2 > 0 ? 2 : 1) * .5;
  BG.hud.set('score', Math.floor(score)); BG.hud.set('dist', Math.floor(dist));
  if (Math.floor(dist / 500) !== Math.floor((dist - dz) / 500)) { BG.ui.toast(`¡${Math.floor(dist / 500) * 500} m!`, '#ff3dd0'); SFX.play('levelup'); }
}
// ── Dibujo ────────────────────────────────────────────────────────────────
function quad(a, b, c, d, fill) { ctx.fillStyle = fill; ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.lineTo(c.x, c.y); ctx.lineTo(d.x, d.y); ctx.closePath(); ctx.fill(); }
function box(x, z, w, h, y0, z2, col, top) {
  const l = x - w / 2, r = x + w / 2;
  const a = proj(l, y0, z), b = proj(r, y0, z), c = proj(r, y0 + h, z), d = proj(l, y0 + h, z);
  const a2 = proj(l, y0, z2), b2 = proj(r, y0, z2), c2 = proj(r, y0 + h, z2), d2 = proj(l, y0 + h, z2);
  quad(d, c, c2, d2, top);                     // techo
  if (x < 0) quad(b, b2, c2, c, shadeC(col, .7)); if (x > 0) quad(a, a2, d2, d, shadeC(col, .7));
  quad(a, b, c, d, col);                        // frente
}
function shadeC(hex, k) { const n = parseInt(hex.slice(1), 16); return `rgb(${(n >> 16) * k | 0},${((n >> 8) & 255) * k | 0},${(n & 255) * k | 0})`; }
function render() {
  const sky = ctx.createLinearGradient(0, 0, 0, HOR); sky.addColorStop(0, '#0a0420'); sky.addColorStop(1, '#3a0a4a');
  ctx.fillStyle = sky; ctx.fillRect(0, 0, W, HOR + 2);
  // sol retro
  const sg = ctx.createLinearGradient(0, HOR - 120, 0, HOR); sg.addColorStop(0, '#ffd400'); sg.addColorStop(1, '#ff3dd0');
  ctx.save(); ctx.beginPath(); ctx.arc(W / 2, HOR - 10, 80, Math.PI, 0); ctx.fillStyle = sg; ctx.fill();
  ctx.fillStyle = '#3a0a4a'; for (let i = 0; i < 6; i++) ctx.fillRect(W / 2 - 90, HOR - 12 - i * 13, 180, 2 + i * .8); ctx.restore();
  // ciudad
  ctx.fillStyle = '#1b0a33'; for (let i = 0; i < 16; i++) { const bw = 30, bh = 30 + (i * 37 % 70); ctx.fillRect(i * 28 - 10, HOR - bh, bw, bh); }
  // suelo
  ctx.fillStyle = '#07030f'; ctx.fillRect(0, HOR, W, H - HOR);
  // ruta
  const L = -1.5, R = 1.5;
  quad(proj(L, 0, 1), proj(R, 0, 1), proj(R, 0, FAR), proj(L, 0, FAR), '#120826');
  // líneas de la ruta (se mueven)
  ctx.strokeStyle = '#ff3dd0'; ctx.lineWidth = 2; ctx.shadowColor = '#ff3dd0'; ctx.shadowBlur = 10;
  for (const lx of [L, R]) { const a = proj(lx, 0, 1), b = proj(lx, 0, FAR); ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke(); }
  ctx.shadowBlur = 0; ctx.strokeStyle = 'rgba(46,242,255,.5)';
  for (const lx of [-.5, .5]) for (let z = 1 + (-(stripe % 3)) + 3; z < FAR; z += 3) { const a = proj(lx, 0, z), b = proj(lx, 0, z + 1.4); ctx.lineWidth = Math.max(1, a.k / 60); ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke(); }
  ctx.strokeStyle = 'rgba(255,61,208,.18)'; ctx.lineWidth = 1;
  for (let z = 1 + (3 - stripe % 3); z < FAR; z += 3) { const a = proj(-6, 0, z), b = proj(6, 0, z); ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke(); }
  ctx.save(); FX.applyShake(ctx);
  // objetos (de lejos a cerca)
  const list = (objs || []).filter(o => !o.hit && o.z > .6).sort((a, b) => b.z - a.z);
  const playerDrawn = { v: false };
  const drawPlayer = () => {
    if (!p || p.dead) return;
    const sliding = p.slide > 0, hgt = sliding ? .55 : 1.25, pp = proj(p.x, p.y, PZ), top = proj(p.x, p.y + hgt, PZ), k = pp.k;
    const sh = proj(p.x, 0, PZ); ctx.fillStyle = 'rgba(0,0,0,.4)'; ctx.beginPath(); ctx.ellipse(sh.x, sh.y, .35 * k, .08 * k, 0, 0, 7); ctx.fill();
    const w = .5 * k, legSw = Math.sin(p.run) * .18 * k;
    ctx.save(); ctx.shadowColor = '#2ef2ff'; ctx.shadowBlur = 16;
    if (!sliding && p.y < .05) { ctx.fillStyle = '#2b6bff'; ctx.fillRect(pp.x - w * .35 + legSw * .5, pp.y - .45 * k, w * .25, .45 * k); ctx.fillRect(pp.x + w * .1 - legSw * .5, pp.y - .45 * k, w * .25, .45 * k); }
    ctx.fillStyle = '#2ef2ff'; D.rr(ctx, pp.x - w / 2, top.y, w, (pp.y - top.y) * (sliding ? 1 : .68), w * .2); ctx.fill();
    ctx.fillStyle = '#ffd9b0'; ctx.beginPath(); ctx.arc(pp.x, top.y - w * .25, w * .32, 0, 7); ctx.fill();
    ctx.fillStyle = '#ff3dd0'; ctx.fillRect(pp.x - w * .36, top.y - w * .5, w * .72, w * .18);
    if (power.jet > 0) { ctx.fillStyle = '#ff9a1f'; ctx.beginPath(); ctx.moveTo(pp.x - w * .3, pp.y); ctx.lineTo(pp.x, pp.y + (.4 + Math.random() * .3) * k); ctx.lineTo(pp.x + w * .3, pp.y); ctx.fill(); }
    ctx.restore();
  };
  for (const o of list) {
    if (!playerDrawn.v && o.z < PZ) { drawPlayer(); playerDrawn.v = true; }
    if (o.t === 'coin') { const c = proj(o.x, o.y, o.z), r = .18 * c.k; ctx.fillStyle = '#ffd400'; ctx.beginPath(); ctx.ellipse(c.x, c.y, Math.abs(Math.cos(t * 5 + o.z)) * r + 1, r, 0, 0, 7); ctx.fill(); }
    else if (o.t === 'pow') { const c = proj(o.x, o.y + Math.sin(t * 4) * .1, o.z); D.glowCircle(ctx, c.x, c.y, .25 * c.k, 'rgba(46,242,255,.5)', 20); D.text(ctx, { mag: '🧲', x2: '✖2', jet: '🚀' }[o.kind], c.x, c.y, { size: Math.max(8, .3 * c.k), family: 'body', color: '#fff' }); }
    else if (o.t === 'low') box(o.x, o.z, .9, .45, 0, o.z + .3, '#ff9a1f', '#ffc06b');
    else if (o.t === 'high') { box(o.x - .38, o.z, .08, 1.7, 0, o.z + .1, '#888', '#aaa'); box(o.x + .38, o.z, .08, 1.7, 0, o.z + .1, '#888', '#aaa'); box(o.x, o.z, .9, .5, 1.0, o.z + .2, '#ff3d6e', '#ff8aa3'); }
    else if (o.t === 'wall') box(o.x, o.z, .95, 1.9, 0, o.z + o.len, '#4a2bff', '#7a6bff');
  }
  if (!playerDrawn.v) drawPlayer();
  FX.draw(ctx);
  ctx.restore();
  let px = 10; for (const [k, e] of [['mag', '🧲'], ['x2', '✖2'], ['jet', '🚀']]) if (power[k] > 0) { D.text(ctx, `${e} ${Math.ceil(power[k])}`, px, H - 16, { size: 13, color: '#fff', align: 'left', family: 'body' }); px += 62; }
  FX.drawFlash(ctx, W, H);
}
const SONG = { bpm: 150, tracks: [
  { type: 'square', vol: .22, notes: 'A4 . C5 . E5 . A5 . G5 . E5 . C5 . E5 . F4 . A4 . C5 . F5 . E5 . C5 . A4 . C5 .' },
  { type: 'triangle', vol: .6, notes: 'A2 A2 . A2 A2 . A2 . F2 F2 . F2 F2 . F2 . G2 G2 . G2 G2 . G2 . E2 E2 . E2 E2 . E2 .' },
  { drum: true, vol: .5, notes: 'K . H . S . H . K K H . S . H . K . H . S . H . K K H . S . S S' },
] };
if (BG.thumb) { start(); BG.stop(); BG.music.stop(); for (let i = 0; i < 60; i++) update(1 / 30); state = 'thumb'; p.y = .9; update = () => {}; }
else BG.ready.then(showMenu);
BG.loop(dt => update(dt), render);
</script>
</body>
</html>
